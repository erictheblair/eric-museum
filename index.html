async function lookupByTitle(collectionId, title, maker){
  if(collectionId === "laserdiscs" || collectionId === "movies") return lookupFilm(title);
  if(collectionId === "books"){
    const j = await getJSON("https://openlibrary.org/search.json?limit=1&fields=title,subtitle,author_name,first_publish_year,publisher,isbn,cover_i&title=" + encodeURIComponent(title) + (maker ? "&author=" + encodeURIComponent(maker) : ""));
    const b = (j.docs||[])[0]; if(!b) return null;
    return {source:"Open Library", title:[b.title, b.subtitle].filter(Boolean).join(": "), maker:(b.author_name||[]).join(", "), year:b.first_publish_year ? String(b.first_publish_year) : "",
      cover:b.cover_i ? "https://covers.openlibrary.org/b/id/" + b.cover_i + "-L.jpg" : "", fields:{publisher:(b.publisher||[])[0]||""}};
  }
  if(collectionId === "records"){
    const q = 'release:"' + title.replace(/"/g,"") + '"' + (maker ? ' AND artist:"' + maker.replace(/"/g,"") + '"' : "") + " AND format:vinyl";
    const j = await getJSON("https://musicbrainz.org/ws/2/release/?fmt=json&limit=5&query=" + encodeURIComponent(q));
    const r = (j.releases||[])[0]; if(!r) return null;
    const li = (r["label-info"]||[])[0] || {}, fm = formatFrom((r.media||[]).map(m=>m.format||""));
    return {source:"MusicBrainz", title:r.title, maker:(r["artist-credit"]||[]).map(a=>(a.name||"") + (a.joinphrase||"")).join(""), year:(r.date||"").slice(0,4),
      cover:"https://coverartarchive.org/release/" + r.id + "/front-500", fields:{label:(li.label||{}).name||"", catno:li["catalog-number"]||"", format:fm.format||"", pressing:r.country||""}};
  }
  return null;
}
async function enrichFilm(r){
  const t = (r.title||"").toLowerCase();
  const filmy = r.collectionId === "laserdiscs" || r.collectionId === "movies" || /laser ?disc|dvd|blu-?ray|vhs|widescreen/.test(t + " " + (r.category||""));
  if(!filmy) return r;
  if(!r.collectionId) r.collectionId = /laser ?disc/.test(t) ? "laserdiscs" : "movies";
  if(r.source === "MusicBrainz" || r.source === "Discogs") return r; // music laserdiscs: keep music data
  try{
    const f = await lookupFilm(r.title);
    if(f){ r = {...r, title:f.title, maker:f.maker || r.maker, year:f.year || r.year, source:r.source + " + " + f.source, fields:{...(r.fields||{}), ...Object.fromEntries(Object.entries(f.fields).filter(([,v])=>v))}}; }
  }catch(e){ console.warn(e.message); }
  return r;
}
async function lookupOpenLibrary(code){
  if(!isISBN(code)) return null;
  const j = await getJSON("https://openlibrary.org/api/books?bibkeys=ISBN:" + code + "&format=json&jscmd=data");
  const b = j["ISBN:" + code]; if(!b) return null;
  return {source:"Open Library", collectionId:"books", title:[b.title, b.subtitle].filter(Boolean).join(": "), maker:(b.authors||[]).map(a=>a.name).join(", "),
    year:((b.publish_date||"").match(/\d{4}/)||[""])[0], cover:b.cover && (b.cover.large || b.cover.medium),
    fields:{publisher:(b.publishers||[]).map(p=>p.name).join(", "), isbn:code, pages:b.number_of_pages ? String(b.number_of_pages) : ""}};
}
function formatFrom(fmts){
  const f = fmts.join(" ").toLowerCase();
  if(/laser ?disc/.test(f)) return {collectionId:"laserdiscs"};
  if(/vinyl|lp|7"|12"|10"|45 rpm|78 rpm/.test(f)) return {collectionId:"records", format:/7"|45 rpm/.test(f) ? '7"' : /10"/.test(f) ? '10"' : /78 rpm/.test(f) ? "78" : /\bep\b/.test(f) ? "EP" : /box/.test(f) ? "Box set" : "LP"};
  return {};
}
async function lookupDiscogs(code, tok){
  const j = await getJSON("https://api.discogs.com/database/search?type=release&per_page=10&barcode=" + encodeURIComponent(code) + "&token=" + encodeURIComponent(tok));
  const list = j.results || []; if(!list.length) return null;
  const r = list.find(x => /vinyl|laserdisc/i.test((x.format||[]).join(" "))) || list[0];
  const [artist, ...rest] = (r.title||"").split(" - ");
  const fm = formatFrom(r.format||[]);
  return {source:"Discogs", ref:{discogs:r.id}, collectionId:fm.collectionId, title:rest.length ? rest.join(" - ") : r.title, maker:rest.length ? artist.replace(/\s*\(\d+\)$/,"") : "",
    year:r.year||"", cover:r.cover_image && !/spacer\.gif/.test(r.cover_image) ? r.cover_image : "",
    fields:{label:(r.label||[])[0]||"", catno:r.catno && r.catno!=="none" ? r.catno : "", format:fm.format||"", pressing:r.country||"", color:vinylColor(r)}};
}
async function lookupMusicBrainz(code){
  const alt = code.length === 13 && code[0] === "0" ? code.slice(1) : code.length === 12 ? "0" + code : null;
  const q = "barcode:" + code + (alt ? " OR barcode:" + alt : "");
  const j = await getJSON("https://musicbrainz.org/ws/2/release/?fmt=json&limit=10&query=" + encodeURIComponent(q));
  const list = j.releases || []; if(!list.length) return null;
  const fmts = r => (r.media||[]).map(m=>m.format||"");
  const r = list.find(x => /vinyl|laserdisc/i.test(fmts(x).join(" "))) || list[0];
  const fm = formatFrom(fmts(r)), li = (r["label-info"]||[])[0] || {};
  return {source:"MusicBrainz", ref:{mb:r.id}, collectionId:fm.collectionId, title:r.title, maker:(r["artist-credit"]||[]).map(a=>(a.name||"") + (a.joinphrase||"")).join(""),
    year:(r.date||"").slice(0,4), cover:"https://coverartarchive.org/release/" + r.id + "/front-500",
    fields:{label:(li.label||{}).name||"", catno:li["catalog-number"]||"", format:fm.format||"", pressing:r.country||""}};
}
async function lookupUPCItemDB(code){
  const j = await getJSON("https://api.upcitemdb.com/prod/trial/lookup?upc=" + encodeURIComponent(code));
  const r = (j.items||[])[0]; if(!r) return null;
  return {source:"UPCitemdb", title:r.title, maker:"", category:r.category||"", cover:(r.images||[])[0]||"", extra:r.brand ? [{l:"Brand / publisher", v:r.brand}] : [], fields:{}};
}

/* Dropdown with the gallery's choices plus "Other…" to add a new one. */
function choiceSelect(id, name, value, opts){
  const list = [...opts]; if(value && !list.includes(value)) list.push(value);
  return `<select id="${id}" name="${name}" data-choice>${[""].concat(list).map(o => `<option value="${esc(o)}" ${o===(value||"")?"selected":""}>${o ? esc(o) : "—"}</option>`).join("")}<option value="__other">Other… (add a choice)</option></select>`;
}
function wireChoices(root, onAdd){
  root.querySelectorAll("select[data-choice]").forEach(sel => {
    let prev = sel.value;
    sel.onchange = () => {
      if(sel.value !== "__other"){ prev = sel.value; return; }
      const v = (prompt("Add a new choice:") || "").trim();
      if(!v){ sel.value = prev; return; }
      if(![...sel.options].some(o => o.value === v)){ const o = new Option(v, v); sel.insertBefore(o, sel.querySelector('option[value="__other"]')); }
      sel.value = v; prev = v; onAdd(sel.name, v);
    };
  });
}

  async function lookupInto(code){

    finally{ b.remove(); }

    pickResult(kind, kind === "comic" && iss && !/#/.test(it.title) ? it.title + " #" + iss : it.title, it.maker, async r => {
      found = {...r};

  async function applyResult(r, overwrite){
      if(r.collectionId && !existing && overwrite && cat.collections.some(c=>c.id===r.collectionId)) it.collectionId = r.collectionId;
      mergeResult(it, r, overwrite);
      if(r.cover && !it.media.some(m=>m.kind==="photo")){
        try{
          const blob = await (await fetchT(r.cover, {}, 15000)).blob();
          if(/^image\//.test(blob.type)) await addFiles([new File([blob], "cover.jpg", {type:blob.type})], "photo", true);

  }

  function readCopies(){ return [...document.querySelectorAll("#copies .copyrow")].map(r => ({condition:r.querySelector(".cc").value.trim(), location:r.querySelector(".cl").value.trim(), note:r.querySelector(".cn").value.trim()})); }
  function renderCopies(){
    const box = document.getElementById("copies"); if(!box) return;
    const n = Math.max(1, Math.min(200, parseInt(document.getElementById("qty").value, 10) || 1));
    const cur = box.children.length ? readCopies() : (it.copies || []);
    document.getElementById("copiesBox").style.display = n > 1 ? "block" : "none";
    box.innerHTML = n > 1 ? Array.from({length:n}, (_, i) => { const x = cur[i] || {}; return `<div class="copyrow"><b>Copy ${i+1}</b>
      <input class="cc" value="${esc(x.condition||"")}" placeholder="Condition" list="condList" aria-label="Copy ${i+1} condition">
      <input class="cl" value="${esc(x.location||"")}" placeholder="Where it's kept" aria-label="Copy ${i+1} location"><span></span>
      <input class="cn" value="${esc(x.note||"")}" placeholder="Notes (signed, sealed, from Mom…)" aria-label="Copy ${i+1} notes"></div>`; }).join("")
      + `<datalist id="condList">${conditionList().map(v => `<option value="${esc(v)}">`).join("")}</datalist>` : "";
  }
  function collect(){
    const f = document.getElementById("ef"), d = new FormData(f), c = coll(it.collectionId);
    ["title","maker","year","barcode","condition","location","acquiredDate","source","notes"].forEach(k => it[k] = (d.get(k)||"").trim().replace(/^__other$/,""));
    { const ms = (d.get("makerSort")||"").trim(), mk = (it.maker||"").trim().toLowerCase();   // one sort name per artist, used by all their pieces
      if(mk){ cat.makerSortManual = cat.makerSortManual || {}; const auto = msGet(cat.makerSort, it.maker) || it.maker;   // keep any choice that differs from the automatic one, including "as written" over MusicBrainz
        if(ms && ms !== auto) cat.makerSortManual[mk] = ms; else delete cat.makerSortManual[mk]; } }
    ["price","value"].forEach(k => { const v = (d.get(k)||"").replace(/[$,\s]/g,""); it[k] = v === "" ? "" : (isNaN(+v) ? v : +v); });
    it.tags = (d.get("tags")||"").split(",").map(s=>s.trim()).filter(Boolean);
    it.favorite = d.get("favorite") === "on";
    const q = parseInt(d.get("qty"), 10); if(q > 1) it.qty = q; else delete it.qty;
    if(d.get("bootleg")) it.bootleg = true; else delete it.bootleg;
    const cps = readCopies();
    if(q > 1 && cps.some(x => x.condition || x.location || x.note)) it.copies = cps.slice(0, q); else delete it.copies;
    it.fields = it.fields || {};
    c.fields.forEach(x => { const v = (d.get("x_"+x.k)||"").trim().replace(/^__other$/,""); if(v) it.fields[x.k] = v; else delete it.fields[x.k]; });
    if(document.getElementById("tracksTxt")){ const t = textToTracks(document.getElementById("tracksTxt").value);
      // Keep the exact saved rows when the text wasn't touched (so nothing is lost to re-reading it).
      // Compare with what the box showed when the form opened, so a listing filled in meanwhile isn't wiped by an untouched box.
      const tb = document.getElementById("tracksTxt");
      if(tb.value !== tb.defaultValue && tracksToText(t) !== tracksToText(textToTracks(tracksToText(it.tracks)))) { if(t.length) it.tracks = t; else delete it.tracks; } }
    it.extra = [...document.querySelectorAll("#extras .xrow")].map(r => ({l:r.querySelector("[data-xl]").value.trim(), v:r.querySelector("[data-xv]").value.trim()})).filter(x => x.l || x.v);

  }

  function renderMedia(){

      const p = pending.find(p => p.m === m);
      const im = m.kind === "photo" ? (p ? `<img src="${p.previewUrl}" alt="">` : `<img alt="" data-path="${esc(m.thumb||m.path)}">`) : (/pdf$/i.test(m.name||"") ? "📄" : "📜");

      return `<div class="mtile"><div class="im">${im}${isCover ? `<span class="tag">Cover</span>` : ""}</div><div class="row">
        ${m.kind === "photo" ? `${isCover ? "" : `<button type="button" data-cover="${m.id}" title="Make cover" aria-label="Make cover">⤒</button>`}<button type="button" data-edit="${m.id}" title="Crop &amp; rotate" aria-label="Crop and rotate">✎</button>`
          : `<input data-label="${m.id}" value="${esc(m.label||"")}" placeholder="COA, receipt…">`}

      const pi = pending.findIndex(p=>p.m===m); if(pi>=0) pending.splice(pi,1); else removed.push(m); renderMedia(); });
    el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editPhoto(b.dataset.edit));
    el.querySelectorAll("[data-cover]").forEach(b => b.onclick = () => { collect(); const i = it.media.findIndex(m=>m.id===b.dataset.cover); const [m] = it.media.splice(i,1); it.media.unshift(m); renderMedia(); });
    hydrate(el);
  }

  async function editPhoto(mid){
    collect();
    const m = it.media.find(x => x.id === mid); if(!m) return;
    const p = pending.find(x => x.m === m);
    let src = p && p.blob;
    if(!src){
      const done = busy("Opening the photo…");
      try{ const u = await mediaUrl(m.path); const r = await fetchT(u, {}, 30000); if(!r.ok) throw new Error("status " + r.status); src = await r.blob(); }
      catch(e){ done(); return alert("Couldn't open this photo for editing" + (m.remote ? " (the site it came from doesn't allow it). Save the picture to your phone and add it as a new photo instead." : ": " + e.message)); }
      done();
    }
    const out = await photoEditor(src); if(!out) return;
    const th = await shrink(out, 520, .8), big = await shrink(out, 2400, .88);
    if(p){ p.blob = big; p.thumbBlob = th; URL.revokeObjectURL(p.previewUrl); p.previewUrl = URL.createObjectURL(th); }
    else {
      // A saved photo keeps its file name and is overwritten on save (cached links are dropped then).
      // A linked database image becomes a real file of its own.
      const nm = {...m, id:m.remote ? uid() : m.id}; delete nm.remote;
      if(m.remote){ tmpMedia(it, nm); nm.name = "cover.jpg"; } else if(!nm.thumb) nm.thumb = nm.path.replace(/\.[a-z0-9]+$/i, "") + "_t.jpg";
      it.media[it.media.indexOf(m)] = nm; if(m.remote) removed.push(m);
      pending.push({m:nm, blob:big, thumbBlob:th, previewUrl:URL.createObjectURL(th)});
    }
    renderMedia(); toast("Photo updated. Save to keep it.");
  }
  // Browse cover images from the databases while adding/editing, same sheet as "Change cover" on a saved piece.
  async function pickCover(url, thumb, replace){
    const old = it.media.find(m => m.kind === "photo");
    if(replace && old){ it.media = it.media.filter(m => m !== old); const pi = pending.findIndex(p => p.m === old); if(pi >= 0) pending.splice(pi, 1); else if(!old.remote) removed.push(old); }
    const n = it.media.length;
    try{ const resp = await fetchT(url, {}, 20000), blob = await resp.blob(); if(!resp.ok || !/^image\//.test(blob.type)) throw new Error("not an image");
      await addFiles([new File([blob], "cover.jpg", {type:blob.type})], "photo", true); }
    catch(e){ it.media.push({id:uid(), kind:"photo", remote:true, name:"cover", path:url, thumb:thumb || url}); }
    const added = it.media.splice(n); it.media.unshift(...added); renderMedia(); toast("Cover set");
  }
  async function addFiles(files, kind, noCollect){
    if(!noCollect) collect();
    const done = busy("Preparing " + files.length + " file" + (files.length>1?"s":"") + "…");
    try{
      for(const file of files){
        const mid = uid(), isImg = /^image\//.test(file.type);
        const base = "media/tmp/" + mid; // real readable names are given on save, once the title is known
        if(kind === "photo"){
          if(!isImg) continue;
          const full = await shrink(file, 2400, .88), th = await shrink(file, 520, .8);
          const m = {id:mid, kind:"photo", name:safeName(file.name), path:base + ".jpg", thumb:base + "_t.jpg"};
          it.media.push(m); pending.push({m, blob:full, thumbBlob:th, previewUrl:URL.createObjectURL(th)});
        }else{
          const ext = (file.name.match(/\.\w+$/)||[isImg?".jpg":".pdf"])[0].toLowerCase();
          const m = {id:mid, kind:"document", name:safeName(file.name), path:base + ext, label:/coa|cert|authent/i.test(file.name) ? "Certificate of authenticity" : ""};
          it.media.push(m); pending.push({m, blob:file});
        }
      }
    }catch(e){ alert("Couldn't read one of those files: " + e.message); }
    finally{ done(); if(document.getElementById("media")) renderMedia(); }
  }

  // In the pop-up, a plain Save closes it and refreshes the page underneath; otherwise go where Save leads.
  function goNext(h, next){ dirty = () => false;
    if(ov && !next) return ov.done();
    if(ov) ov.close(true);
    if(location.hash === h) route(); else location.hash = h; }
  let snap = "";
  const formState = () => [...app.querySelectorAll("input,select,textarea")].map(x => x.type === "checkbox" ? x.checked : x.type === "file" ? "" : x.value).join("\u0001") + "|" + it.media.length + "|" + pending.length;
  let dirty = () => !!snap && formState() !== snap;
  if(ov) ov.dirty = () => dirty();
  async function save(next){
    if(!it.title) return toast("Please add a title.");
    if(!existing){
      const dupes = findDupes(it);
      if(dupes.length){
        const ch = await askDupe(it, dupes);
        if(!ch) return;
        if(ch.add){
          const d = ch.add, add = it.qty || 1, was = d.qty || 1;
          const prevCopies = d.copies ? d.copies.slice() : null;
          const cps = (d.copies || []).slice(0, was); while(cps.length < was) cps.push(cps.length ? {} : {condition:d.condition||"", location:d.location||""});
          for(let k = 0; k < add; k++) cps.push({condition:it.condition||"", location:it.location||"", note:[it.notes, it.acquiredDate || it.source ? "Acquired " + [it.acquiredDate, it.source].filter(Boolean).join(" from ") : ""].filter(Boolean).join(" · ")});
          d.copies = cps.some(x => x.condition || x.location || x.note) ? cps : undefined; if(!d.copies) delete d.copies;
          d.qty = was + add; d.updated = new Date().toISOString();
          const done = busy("Saving…");
          try{ await persist(); }catch(e){ if(was > 1) d.qty = was; else delete d.qty; if(prevCopies) d.copies = prevCopies; else delete d.copies; done(); return alert(e.message); }
          done(); pending.length = 0;
          toast("You now have " + d.qty + " of “" + d.title + "”");
          goNext(next ? "#/new?c=" + encodeURIComponent(it.collectionId) + (next === "scan" ? "&scan=1" : "") + "&n=" + Date.now() : "#/i/" + d.id, next);
          return;
        }
      }
    }
    const done = busy(pending.length ? "Uploading " + pending.length + " file" + (pending.length>1?"s":"") + "…" : "Saving…");
    try{
      const fresh = pending.map(p => p.m).filter(m => /^media\/tmp\//.test(m.path));
      if(fresh.length) placeNew(it, fresh);
      for(const p of pending){ await store.putFile(p.m.path, p.blob); store.forget(p.m.path); if(p.thumbBlob){ await store.putFile(p.m.thumb, p.thumbBlob); store.forget(p.m.thumb); } }
      it.updated = new Date().toISOString(); it.created = it.created || it.updated;
      const idx = cat.items.findIndex(x => x.id === it.id);
      const before = idx >= 0 ? cat.items[idx] : null;
      // A track listing filled in (in the background) while this form was open: keep it unless the box was edited.
      const tb = document.getElementById("tracksTxt");
      if(before && (before.tracks||[]).length && !(it.tracks||[]).length && (!tb || tb.value === tb.defaultValue)) it.tracks = before.tracks;
      if(idx >= 0) cat.items[idx] = it; else cat.items.push(it);
      try{ await persist(); }catch(e){ if(before) cat.items[idx] = before; else cat.items.pop(); throw e; }
      const live = new Set(it.media.flatMap(m => [m.path, m.thumb]));
      for(const m of removed){ if(m.remote) continue; if(!live.has(m.path)) store.deleteFile(m.path).catch(()=>{}); if(m.thumb && !live.has(m.thumb)) store.deleteFile(m.thumb).catch(()=>{}); }

      toast(next ? "Saved “" + it.title + "”" : "Saved");
      goNext(next ? "#/new?c=" + encodeURIComponent(it.collectionId) + (next === "scan" ? "&scan=1" : "") + "&n=" + Date.now() : "#/i/" + it.id, next);
    }catch(e){ alert(e.message); } finally{ done(); }
  }
  render();
  setTimeout(() => { snap = formState(); }, 0);
  if(params.get("scan") && !existing) setTimeout(() => document.getElementById("scanTop")?.click(), 50);

    const here = location.hash;

      document.removeEventListener("keydown", k); location.hash = document.getElementById("edCancel").getAttribute("href");
    });
  }
}

// On a computer, a piece opens as a pop-up over the page you're on. Edit turns the pop-up into the form;
// Save or Esc goes back to the piece, and Esc (or clicking outside) on the piece closes the pop-up.
let pieceOv = null;
function openPiece(id, mode){
  const E = document.getElementById("edlayer"), y = scrollY, title0 = document.title; if(!item(id)) return;
  document.getElementById("qeC")?.click(); document.getElementById("layer").innerHTML = "";
  E.innerHTML = `<div class="lightbox" id="ed" style="background:rgba(10,8,6,.6)"><div class="panel" role="dialog">
    <button class="iconbtn" id="edX" aria-label="Close">✕</button><div id="edHost"></div></div></div>`;
  document.body.style.overflow = "hidden";
  const host = document.getElementById("edHost"), panel = host.parentNode;
  const P = pieceOv = {id, mode:"", changed:false};
  const ov = {host, dirty: () => false};
  P.show = m => { if(!item(id)) return P.shut();
    P.mode = m; ov.dirty = () => false; host.innerHTML = ""; panel.scrollTop = 0; panel.classList.toggle("editing", m === "edit");
    if(m === "edit"){ viewEdit(id, new URLSearchParams(), ov); setTimeout(() => { const t = host.querySelector("#title"); t && t.focus({preventScroll:true}); }, 30); }
    else viewItem(id, host); };
  ov.close = force => { if(!force && ov.dirty() && !confirm("Leave without saving your changes?")) return; P.show("item"); };
  ov.done = () => { P.changed = true; P.show("item"); };
  P.shut = () => { window.removeEventListener("keydown", onKey, true); if(pieceOv === P) pieceOv = null;
    if(!E.querySelector("#ed")) return; E.innerHTML = ""; document.body.style.overflow = "";
    if(P.changed){ route(); const go = () => scrollTo(0, y); requestAnimationFrame(go); setTimeout(go, 120); setTimeout(go, 400); }
    else document.title = title0; };
  P.back = () => { if(P.mode === "edit") ov.close(); else P.shut(); };
  const onKey = e => { if(!document.getElementById("ed")) return window.removeEventListener("keydown", onKey, true);
    if(e.key !== "Escape" || document.getElementById("layer").children.length || document.querySelector(".busy")) return;
    e.preventDefault(); e.stopPropagation(); P.back(); };
  window.addEventListener("keydown", onKey, true);
  document.getElementById("edX").onclick = () => { if(P.mode === "edit" && ov.dirty() && !confirm("Close without saving your changes?")) return; P.shut(); };
  let downOut = false;
  panel.parentNode.addEventListener("mousedown", e => { downOut = e.target.id === "ed"; });
  panel.parentNode.addEventListener("click", e => { if(downOut && e.target.id === "ed") P.back(); downOut = false; });
  P.show(mode || "item");
}

function download(blob, name){ const a = document.createElement("a"), u = URL.createObjectURL(blob); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); }
// One gallery (in the order you're looking at it) or everything. A single gallery uses its own column names, and private mode leaves out prices, values and private fields.
function csvBlob(items, g){
  const hide = !!g && priv;
  const fieldCols = []; (g ? [g] : cat.collections).forEach(c => c.fields.forEach(f => { if(!(hide && f.priv) && !fieldCols.some(x=>x.l===f.l)) fieldCols.push(f); }));
  const head = ["Collection","Title",g ? (g.maker||"Maker") : "Maker","Year","Barcode","Condition","Location","Acquired","Source", ...(hide ? [] : ["Price paid","Estimated value"]),"Tags","Notes","More details","Tracks", ...fieldCols.map(f=>f.l), "Photos","Documents"];
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const rows = (items || sortItems(cat.items,"title")).map(i => { const c = coll(i.collectionId);
    return [c.name, i.title, i.maker, i.year, i.barcode, i.condition, i.location, i.acquiredDate, i.source, ...(hide ? [] : [i.price, i.value]), (i.tags||[]).join("; "), i.notes, (i.extra||[]).map(x=>x.l + ": " + x.v).join("; "), (i.tracks||[]).filter(t => !t.h).map(t => [t.p, t.t].filter(Boolean).join(" ")).join("; "),
      ...fieldCols.map(fc => { const f = c.fields.find(x=>x.l===fc.l); return f ? (i.fields||{})[f.k] : ""; }),
      (i.media||[]).filter(m=>m.kind==="photo").length, (i.media||[]).filter(m=>m.kind!=="photo").map(m=>m.label||m.name).join("; ")]; });
  return new Blob(["\ufeff" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n")], {type:"text/csv"});
}

function posterLayout(n, o){
  const lay = poOpt(o,"layout"), gr = poOpt(o,"gap").g, sh = o.style === "shelf" ? .09 : 0;
  const m = Math.max(gr, sh ? .06 : 0, lay.a ? .04 : 0, o.style === "shadow" ? .05 : 0);
  const unitW = c => c + (c - 1) * gr + 2 * m, unitH = r => r + (r - 1) * gr + r * sh + 2 * m;
  let W, H, tile, cols;
  if(!lay.a){
    cols = Math.max(1, Math.ceil(Math.sqrt(n * 1.6 * (1 + sh)))); const rows = Math.ceil(n / cols);
    tile = 300; W = unitW(cols) * tile; H = unitH(rows) * tile;
  } else {
    W = lay.a >= 1 ? lay.L : Math.round(lay.L * lay.a); H = lay.a >= 1 ? Math.round(lay.L / lay.a) : lay.L; tile = 0;
    for(let c = 1; c <= n; c++){ const t = Math.min(W / unitW(c), H / unitH(Math.ceil(n / c))); if(t > tile){ tile = t; cols = c; } }
  }
  const cap = Math.min(1, 14000 / Math.max(W, H), Math.sqrt(16e6 / (W * H)));   // stay inside what phones and Safari can draw
  W = Math.round(W * cap); H = Math.round(H * cap); tile *= cap;
  const rows = Math.ceil(n / cols), gap = tile * gr, step = tile + gap, rowStep = tile * (1 + sh) + gap;
  const gw = cols * tile + (cols - 1) * gap, gh = rows * tile * (1 + sh) + (rows - 1) * gap;

    removed.forEach(f => cat.items.forEach(i => { if(i.collectionId === id && i.fields && i.fields[f.k]){ i.extra = i.extra || []; i.extra.push({l:f.l, v:i.fields[f.k]}); delete i.fields[f.k]; } }));
    Object.assign(orig, {name:document.getElementById("gname").value.trim() || g.name, icon:document.getElementById("gicon").value.trim() || "📦", maker:document.getElementById("gmaker").value.trim() || "Maker", lookup:document.getElementById("glook").value, fields});
    if(orig.lookup === "comic" && !orig.comicSetup){ orig.comicSetup = 1; const norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g,"");
      const add = COMIC_FIELDS.filter(f => !orig.fields.some(x => norm(x.l) === norm(f.l) || x.k === f.k)).map(f => JSON.parse(JSON.stringify(f)));
      const iss = add.find(f => f.k === "issue"); orig.fields = (iss ? [iss] : []).concat(orig.fields, add.filter(f => f.k !== "issue")); }
    try{ await persist(); toast("Collection saved"); location.hash = "#/c/" + id;
      if(JSON.parse(backup).c.name !== orig.name) tidyGallery(cat.items.filter(i => i.collectionId === id)); }
    catch(er){ const b = JSON.parse(backup); Object.assign(orig, b.c); b.items.forEach(bi => { const ix = cat.items.findIndex(i=>i.id===bi.id); if(ix>=0) cat.items[ix] = bi; }); alert(er.message); }
  };
}

  const shut = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };

    if(open){ const on = menu.querySelector("a.on"); if(on) on.scrollIntoView({block:"nearest"}); } };
  menu.onclick = shut;

    document.addEventListener("keydown", e => { if(e.key === "Escape") shut(); }); }
  shut();
}

// Where you came from, and how far down each list you were, so "back" lands you where you left off.
let navPrev = "", navCur = location.hash || "#/";
const scrollMemo = new Map();
addEventListener("scroll", () => { scrollMemo.set(location.hash || "#/", scrollY); }, {passive:true});
function route(){
  if((location.hash || "#/") !== navCur){ navPrev = navCur; navCur = location.hash || "#/"; }
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?"), params = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  document.getElementById("layer").innerHTML = "";
  if(document.getElementById("edlayer").children.length){ document.getElementById("edlayer").innerHTML = ""; document.body.style.overflow = ""; }
  pieceOv = null;
  document.body.classList.remove("wallmode");
  fillGalNav(parts[0] === "c" || parts[0] === "wall" ? parts[1] : parts[0] === "i" || parts[0] === "edit" ? ((cat && cat.items.find(i => i.id === parts[1])) || {}).collectionId : "");
  window.scrollTo(0, 0);
  if(!parts.length) return viewHome(params);
  if(parts[0]==="c"){ const r = viewHall(parts[1], params);
    // Coming back from a piece: return to the same spot in the list.
    const y = scrollMemo.get(location.hash); if(y && navPrev.startsWith("#/i/")){ const go = () => scrollTo(0, y); requestAnimationFrame(go); setTimeout(go, 120); setTimeout(go, 400); }
    return r; }
  if(parts[0]==="i") return viewItem(parts[1]);
  if(parts[0]==="new") return viewEdit(null, params);
  if(parts[0]==="edit") return viewEdit(parts[1], params);
  if(parts[0]==="settings") return viewSettings();
  if(parts[0]==="report") return viewReport();
  if(parts[0]==="stats") return viewStats();
  if(parts[0]==="ask") return viewAsk(params);
  if(parts[0]==="gallery") return viewGallery(parts[1]);
  if(parts[0]==="wall") return viewWall(parts[1], params);
  notFound();
}

/* Phones (especially home-screen apps) can keep an old copy of the app; check for a newer one. */
async function checkUpdate(manual){
  if(!manual && (document.querySelector(".busy") || trackJob)) return;   // don't offer to reload in the middle of a long job (e.g. filling track listings)
  try{
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/APP_VERSION = "([^"]+)"/)||[])[1];
    if(v && v !== APP_VERSION){
      if(trackJob && !confirm("Updating now stops filling in track listings (it carries on after the update). Update now?")) return;
      if(manual || confirm("A newer version of the museum is available. Update now?")) location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
    }else if(manual) toast("You're on the latest version.");
  }catch(e){ if(manual) toast("Couldn't check for updates."); }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") checkUpdate(false); });

async function boot(){
  setPriv(priv);
  app.innerHTML = `<div class="empty">Opening the museum…</div>`;
  let justConnected = false;
  try{ justConnected = await DropboxStore.finishAuth(); }catch(e){ alert(e.message); }
  if(LS.get("cm.justConnected", false)){ justConnected = true; LS.del("cm.justConnected"); }
  const dbx = LS.get("cm.dropbox", null);
  const local = new LocalStore();
  if(LS.get("cm.mode","local") === "dropbox" && dbx){
    store = new DropboxStore(dbx.appKey);
    try{
      cat = await store.load();
      if(!cat){
        // First connection: start fresh, or carry over what's on this device.
        const prev = await local.load().catch(()=>null);
        cat = newCatalog();
        if(justConnected && LS.get("cm.carry", true) && prev && prev.items.length){
          const done = busy("Copying " + prev.items.length + " pieces to Dropbox…");
          try{
            for(const it of prev.items) for(const m of it.media||[]){
              const b = await local.getBlob(m.path); if(b) await store.putFile(m.path, b);
              if(m.thumb){ const tb = await local.getBlob(m.thumb); if(tb) await store.putFile(m.thumb, tb); }
            }
            cat = prev;
          } finally { done(); }
        }
        await store.save(cat);
      }
      if(justConnected) toast("Connected to Dropbox");
      store.snapshot().catch(() => {});
    }catch(e){
      const damaged = e instanceof SyntaxError;
      app.innerHTML = `<div class="panel"><h2>${damaged ? "Your catalog file looks damaged" : "Couldn't reach Dropbox"}</h2><p>${damaged ? "The app couldn't read <code>catalog.json</code> in your Dropbox. You can put back a copy from an earlier day." : esc(e.message)}</p><div class="actions"><button class="iconbtn primary" onclick="location.reload()">Try again</button>${damaged ? `<button class="iconbtn" id="bootVers">🕘 Earlier versions</button>` : ""}<a class="iconbtn" href="#/settings" onclick="setTimeout(()=>location.reload())">Settings</a></div></div>`;
      if(damaged) document.getElementById("bootVers").onclick = () => showVersions();
      if(!LS.get("cm.dropbox", null)) LS.set("cm.mode","local");
      return;
    }
  }else{
    store = local;
    cat = (await local.load().catch(()=>null)) || newCatalog();
  }
  // Make sure newer preset galleries/fields exist in older catalogs.
  cat.presetsSeen = cat.presetsSeen || ["records","laserdiscs","books","prints","autographs","cels","pennies","memorabilia","instruments","antiques"];
  PRESETS.forEach(p => { if(!cat.presetsSeen.includes(p.id)){ cat.presetsSeen.push(p.id); if(!cat.collections.some(x=>x.id===p.id)) cat.collections.push(JSON.parse(JSON.stringify(p))); } });
  // Comic galleries get comic fields (Issue #, grade…) once; existing same-named fields are kept.
  cat.collections.forEach(c => { if(lookupKind(c) !== "comic" || c.comicSetup) return; c.comicSetup = 1;
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g,"");
    const add = COMIC_FIELDS.filter(f => !c.fields.some(x => norm(x.l) === norm(f.l) || x.k === f.k)).map(f => JSON.parse(JSON.stringify(f)));
    const iss = add.find(f => f.k === "issue"); c.fields = (iss ? [iss] : []).concat(c.fields, add.filter(f => f.k !== "issue"));
    if(!c.maker || c.maker === "Maker") c.maker = "Publisher"; });
  // One-time: records formats moved to LP / 7" / 10" style choices.
  if(!cat.migFormats){ cat.migFormats = 1; const rc = cat.collections.find(c => c.id === "records"); const ff = rc && rc.fields.find(f => f.k === "format");
    if(ff){ const pf = PRESETS[0].fields[0].opts; ff.opts = [...new Set([...pf, ...(ff.opts||[]).filter(o => o !== '7" single')])];
      cat.items.forEach(i => { if(i.collectionId === "records" && i.fields && i.fields.format === '7" single') i.fields.format = '7"'; }); } }
  // Add preset fields introduced in newer versions, but never re-add ones the user removed.
  PRESETS.forEach(p => { const c = cat.collections.find(x=>x.id===p.id); if(!c) return; c.seen = c.seen || c.fields.map(f=>f.k);
    p.fields.forEach((f, n) => { if(!c.seen.includes(f.k)){ c.seen.push(f.k); if(!c.fields.some(x=>x.k===f.k)){
      // Slot it in after the field that comes before it in the preset (e.g. Vinyl color right after Format).
      const after = n ? c.fields.findIndex(x => x.k === p.fields[n-1].k) : -1;
      c.fields.splice(after >= 0 ? after + 1 : c.fields.length, 0, JSON.parse(JSON.stringify(f)));
      // A "More details" line with the same label (e.g. Genre) moves into the new field.
      const nl = x => String(x).toLowerCase().replace(/[^a-z0-9]/g,""), key = nl(f.l.split(/ [(\/]/)[0]);
      cat.items.forEach(i => { if(i.collectionId !== c.id || !(i.extra||[]).length || (i.fields||{})[f.k]) return;
        const x = i.extra.find(e => nl(e.l) === key || nl(e.l) === nl(f.l)); if(x && x.v){ i.fields = i.fields || {}; i.fields[f.k] = x.v; i.extra = i.extra.filter(e => e !== x); } }); } } }); });
  // The upgrades above are the same on every device, so count them as the starting point when merging with another device's changes.
  if(store.kind === "dropbox" && store.base) store.base = JSON.stringify(cat, null, 1);
  // One-time: laserdiscs filed under Records (a format, tag or title that says Laserdisc) move to their own Laserdiscs collection,
  // and a collection named like "Records & Laserdiscs" goes back to "Records". Fields Laserdiscs doesn't have move to "More details", so nothing is lost.
  // Done after the line above on purpose: it's saved as a real change so other devices pick it up instead of undoing it.
  if(!cat.migLD){ cat.migLD = 1;
    const isLD = v => /\blaser ?discs?\b|^ld$|^(clv|cav)\b/i.test(String(v||"").trim());
    const looksLD = i => isLD((i.fields||{}).format) || (i.tags||[]).some(isLD) || /\blaser ?disc/i.test(i.title||"")
      || (i.extra||[]).some(e => /format|media/i.test(e.l||"") && isLD(e.v));
    const from = cat.collections.filter(c => c.id !== "laserdiscs" && (c.id === "records" || (/laser/i.test(c.name) && /record|vinyl|album|music|lp/i.test(c.name))));
    const moving = cat.items.filter(i => from.some(c => c.id === i.collectionId) && looksLD(i));
    let ld = cat.collections.find(c => c.id === "laserdiscs");
    if(moving.length && !ld){ ld = JSON.parse(JSON.stringify(PRESETS.find(p => p.id === "laserdiscs"))); ld.seen = ld.fields.map(f => f.k); cat.collections.push(ld); }
    moving.forEach(i => { const src = coll(i.collectionId); i.collectionId = "laserdiscs";
      Object.keys(i.fields||{}).forEach(k => { if(ld.fields.some(f => f.k === k) || !String(i.fields[k]||"").trim()) return;
        const f = src.fields.find(f => f.k === k); i.extra = (i.extra||[]).concat({l:f ? f.l.split(/ [(\/]/)[0] : k, v:i.fields[k]}); delete i.fields[k]; }); });
    from.forEach(c => { Object.defineProperty(c, "_was", {value:c.name, enumerable:false}); if(/laser/i.test(c.name)){ const nm = c.name.replace(/\s*(&|and|\+|,|\/)?\s*laser ?discs?\s*/ig, " ").replace(/^\s*(&|and|\+|,|\/)\s*|\s*(&|and|\+|,|\/)\s*$/g, "").replace(/\s+/g, " ").trim(); if(nm) c.name = nm; } });
    if(moving.length || from.some(c => c.name !== c._was)) persist().then(() => moving.length && tidyLater(moving)).catch(() => {});
    if(moving.length) LS.set("cm.flash", `Moved ${moving.length} laserdisc${moving.length === 1 ? "" : "s"} from Records into the Laserdiscs collection`);
  }
  setBrand();
  window.addEventListener("hashchange", route);
  route();
  const flash = LS.get("cm.flash", ""); if(flash){ LS.del("cm.flash"); toast(flash, 3500); }
}
/* Coming back to the app (e.g. the phone after adding pieces on the computer): pick up changes made elsewhere.
   Skipped while a form, pop-up or gallery walk is open so nothing in progress is disturbed. */
let lastFresh = 0;
async function refreshFromDropbox(){
  if(!store || store.kind !== "dropbox" || !cat || trackJob || Date.now() - lastFresh < 20000) return;
  if(/^#\/(new|edit)/.test(location.hash) || document.querySelector("#layer > *, #edlayer > *, .busy") || document.body.classList.contains("wallmode")) return;
  lastFresh = Date.now();
  try{
    const meta = await store.rpc("files/get_metadata", {path:"/catalog.json"});
    if(meta.rev === store.rev) return;
    const oldRev = store.rev, oldBase = store.base;
    const fresh = await store.load(), undo = () => { store.rev = oldRev; store.base = oldBase; }; // next save then merges instead
    if(!fresh || !Array.isArray(fresh.items)) return undo();
    if(/^#\/(new|edit)/.test(location.hash) || document.querySelector("#layer > *, #edlayer > *, .busy") || document.body.classList.contains("wallmode")) return undo();
    const y = scrollY; cat = fresh; setBrand(); route(); scrollTo(0, y);
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refreshFromDropbox(); });
boot();
setTimeout(() => checkUpdate(false), 1500);
setTimeout(() => { if(cat) autoSyncBGG(); }, 2500);
setTimeout(() => { if(cat) offerTrackResume(); }, 4000);

/* Swipe a pop-up sheet down (from the top of its scroll) to close it, like iPhone sheets. */
(() => {
  let sw = null;
  const closeBtn = p => p.querySelector('[id$="X"]') || p.closest(".lightbox").querySelector(".x");
  document.addEventListener("touchstart", e => {
    const p = e.target.closest("#layer .lightbox > .panel");
    sw = p && e.touches.length === 1 && p.scrollTop <= 0 && !e.target.closest("input,textarea,select") ? {p, y:e.touches[0].clientY, x:e.touches[0].clientX, t:Date.now(), dy:0, on:false} : null;
  }, {passive:true});
  document.addEventListener("touchmove", e => {
    if(!sw) return;
    const dy = e.touches[0].clientY - sw.y, dx = e.touches[0].clientX - sw.x;
    if(!sw.on){ if(dy > 8 && dy > Math.abs(dx) && sw.p.scrollTop <= 0){ sw.on = true; sw.y += 8; } else if(Math.abs(dx) > 8 || dy < -8){ sw = null; return; } else return; }
    e.preventDefault();
    sw.dy = Math.max(0, e.touches[0].clientY - sw.y);
    sw.p.style.transition = "none"; sw.p.style.transform = `translateY(${sw.dy}px)`;
  }, {passive:false});
  document.addEventListener("touchend", () => {
    if(!sw || !sw.on){ sw = null; return; }
    const {p, dy, t} = sw; sw = null;
    const fast = dy / Math.max(1, Date.now() - t) > .5;
    if(dy > Math.min(140, p.offsetHeight * .3) || (fast && dy > 40)){
      p.style.transition = "transform .18s ease-in"; p.style.transform = `translateY(${p.offsetHeight + 40}px)`;
      setTimeout(() => { const b = closeBtn(p); if(b) b.click(); }, 170);
    } else { p.style.transition = "transform .2s ease-out"; p.style.transform = ""; }
  });
})();

/* Fast-scroll handle: appears on long pages while scrolling; drag it to fly through the list. */
(() => {
  const h = document.createElement("div"); h.id = "fsc"; h.setAttribute("aria-hidden", "true");
  h.innerHTML = `<span class="bub"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>`;
  document.body.appendChild(h);
  const TOP = 70, BOT = 110, bub = h.querySelector(".bub");
  let hideT = 0, drag = null;
  const range = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const track = () => innerHeight - TOP - BOT - h.offsetHeight;
  const long = () => document.documentElement.scrollHeight > innerHeight * 3 && !document.body.classList.contains("wallmode") && !document.querySelector("#layer > *");
  const place = () => { h.style.transform = `translateY(${TOP + track() * Math.min(1, scrollY / range())}px)`; };
  const label = () => {
    // Section heading (A, B, C… or year/maker groups) currently in view, else the piece under the middle of the screen.
    let g = ""; for(const el of document.querySelectorAll(".grouphead")){ if(el.getBoundingClientRect().top < innerHeight * .45) g = el.firstChild ? el.firstChild.textContent.trim() : el.textContent.trim(); else break; }
    if(g) return g.slice(0, 40);
    for(const x of [.25, .5, .75]){ const el = document.elementFromPoint(innerWidth * x, innerHeight * .45), a = el && el.closest('a[href^="#/i/"]');
      if(a){ const t = a.querySelector(".t, b, strong"); return (t ? t.textContent : a.textContent).replace(/^★\s*/, "").trim().slice(0, 40); } }
    return ""; };
  const show = () => { if(!long()){ h.classList.remove("on"); return; } place(); h.classList.add("on"); clearTimeout(hideT); if(!drag) hideT = setTimeout(() => h.classList.remove("on"), 1600); };
  addEventListener("scroll", () => { if(drag){ place(); bub.textContent = label(); return; } show(); }, {passive:true});
  addEventListener("hashchange", () => h.classList.remove("on"));
  h.addEventListener("pointerdown", e => { e.preventDefault(); h.setPointerCapture(e.pointerId); clearTimeout(hideT);
    const r = h.getBoundingClientRect(); drag = {off:e.clientY - r.top}; h.classList.add("drag"); bub.textContent = label(); });
  h.addEventListener("pointermove", e => { if(!drag) return;
    const f = Math.min(1, Math.max(0, (e.clientY - drag.off - TOP) / track())); scrollTo(0, f * range()); });
  const end = () => { if(!drag) return; drag = null; h.classList.remove("drag"); bub.textContent = ""; show(); };
  h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
})();

/* Swipe right from the left edge to go back (home-screen iPhone apps have no browser back gesture). */
(() => {
  let sx = null;
  const app = document.getElementById("app");
  document.addEventListener("touchstart", e => { const t = e.touches[0];
    sx = e.touches.length === 1 && t.clientX < 28 && document.querySelector("#app [data-back]") && !document.querySelector("#layer > *") ? {x:t.clientX, y:t.clientY, dx:0} : null; }, {passive:true});
  document.addEventListener("touchmove", e => { if(!sx) return; const t = e.touches[0], dx = t.clientX - sx.x, dy = t.clientY - sx.y;
    if(Math.abs(dy) > 40 && Math.abs(dy) > dx){ app.style.transform = ""; sx = null; return; }
    sx.dx = Math.max(0, dx); app.style.transition = "none"; app.style.transform = `translateX(${sx.dx * .6}px)`; }, {passive:true});
  document.addEventListener("touchend", () => { if(!sx) return; const go = sx.dx > 90; sx = null;
    app.style.transition = "transform .18s"; app.style.transform = "";
    if(go){ const b = document.querySelector("#app [data-back]"); if(b) location.hash = b.getAttribute("href"); } });
})();
</script>
