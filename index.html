<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Collection</title>
<meta name="description" content="A private museum for personal collections.">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Museum">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --ink:#1d1a16; --muted:#6f665b; --line:#e2d9c9;
  --accent:#8a2b1d; --accent-ink:#fff; --frame:#2a241d; --mat:#efe7d8; --chip:#ece4d4;
  --danger:#a1271b; --ok:#2f6b3a; --shadow:0 1px 2px rgba(40,30,20,.08),0 6px 20px rgba(40,30,20,.08);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15130f; --surface:#1f1c17; --ink:#f1ebe0; --muted:#a69c8e; --line:#38322a; --accent:#d9846f; --accent-ink:#1a1210;
    --frame:#0c0b09; --mat:#2a261f; --chip:#2e2922; --danger:#ef7d6e; --ok:#86c493; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:var(--serif);font-size:1.25rem;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-size:.9rem}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:20px 0 80px}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.hero{padding:18px 0 22px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.hero p{color:var(--muted);margin:.4rem 0 0}
.search{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
.search select{flex:0 0 auto;max-width:48%}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-top:8px}
.stats b{color:var(--ink);font-family:var(--serif);font-size:1.1rem;font-weight:600;margin-right:4px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;gap:10px}
.section-title h2{font-size:1.35rem}
.section-title span{color:var(--muted);font-size:.85rem}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.hall{position:relative;display:block;text-decoration:none;border-radius:14px;overflow:hidden;background:var(--frame);aspect-ratio:4/3;box-shadow:var(--shadow)}
.hall img{width:100%;height:100%;object-fit:cover;opacity:.72;transition:transform .5s,opacity .3s}
.hall:hover img{transform:scale(1.04);opacity:.6}
.hall .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4rem;opacity:.35}
.hall .label{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hall .label h3{font-size:1.3rem}
.hall .label span{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:block;text-decoration:none;min-width:0}
.frame{background:var(--frame);padding:7px;border-radius:4px;box-shadow:var(--shadow)}
.matte{background:var(--mat);padding:8px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.matte img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px;padding:8px}
.placeholder .em{font-size:2.4rem;opacity:.7}
.placeholder .t{font-family:var(--serif);font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plaque{padding:9px 2px 0}
.plaque .t{font-family:var(--serif);font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plaque .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#c8962c}
.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* item */
.item{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:820px){.item{grid-template-columns:minmax(0,1fr);gap:18px}}
.viewer .frame{padding:10px}
.viewer .matte{aspect-ratio:auto;min-height:260px;max-height:70vh;padding:14px;cursor:zoom-in}
.viewer .matte img{max-height:calc(70vh - 28px)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
.thumbs button{flex:0 0 64px;height:64px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:var(--mat);cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.crumbs a{text-decoration:none}
.item h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.15}
.item .by{color:var(--muted);margin:.35rem 0 1rem;font-size:1.02rem}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;border-top:1px solid var(--line);padding-top:14px}
dl.facts dt{color:var(--muted);font-size:.85rem;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.docs{display:grid;gap:8px;margin-top:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.doc .ic{font-size:1.3rem}
.doc .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:520px){.brand small{display:none} #privBtn .lbl{font-size:.85rem}}
.hidden-val{letter-spacing:.2em;color:var(--muted)}
/* forms */
form.edit{max-width:760px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.8rem;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;min-width:0;width:100%}
.f textarea{min-height:110px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 16px}
legend{font-family:var(--serif);font-weight:600;padding:0 6px}
.media-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.mtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:.78rem}
.mtile .im{aspect-ratio:1/1;background:var(--mat);display:flex;align-items:center;justify-content:center;font-size:2rem}
.mtile .im img{width:100%;height:100%;object-fit:cover}
.mtile .row{display:flex;gap:4px;padding:6px;align-items:center}
.mtile input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);font-size:.78rem}
.mtile button{border:none;background:none;cursor:pointer;padding:2px 4px;font-size:.95rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
/* overlay */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.96);display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox img.zoom{max-width:none;max-height:none;width:auto}
.lightbox .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--surface);padding:14px 18px;border-radius:12px;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:6px}
.panel p{margin:.4rem 0;color:var(--muted);font-size:.92rem}
.panel code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:.85rem;overflow-wrap:anywhere}
ol.steps{padding-left:20px;margin:.5rem 0;font-size:.92rem}
ol.steps li{margin:.3rem 0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;height:54px;padding:0 20px;border-radius:999px;border:none;background:var(--accent);color:var(--accent-ink);font-size:1rem;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
/* report */
table.report{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:20px}
table.report th,table.report td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.report td.n,table.report th.n{text-align:right;white-space:nowrap}
.report-wrap{overflow-x:auto}
@media print{header.top,.fab,.noprint{display:none!important} body{background:#fff;color:#000} main{padding:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/" id="brand">The Collection<small>Private museum</small></a>
  <button class="iconbtn" id="privBtn" title="Private mode hides values, prices and serial numbers" aria-pressed="false">👁 <span class="lbl">Show values</span></button>
  <a class="iconbtn" href="#/settings" title="Settings">⚙︎</a>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="layer"></div>

<script>
"use strict";
/* ============================================================
   Collection presets and data model
   ============================================================ */
const CONDITIONS = ["Mint","Near Mint","Excellent","Very Good","Good","Fair","Poor"];
const PRESETS = [
  {id:"records", name:"Records", icon:"🎵", maker:"Artist", fields:[
    {k:"format",l:"Format",opts:["LP","EP","7\" single","12\" single","78","Box set","Picture disc"]},{k:"label",l:"Label"},{k:"catno",l:"Catalog #"},
    {k:"pressing",l:"Pressing / country"},{k:"matrix",l:"Matrix / runout"},{k:"mediaGrade",l:"Media grade"},{k:"sleeveGrade",l:"Sleeve grade"}]},
  {id:"laserdiscs", name:"Laserdiscs", icon:"💿", maker:"Director / studio", fields:[
    {k:"label",l:"Label / publisher"},{k:"catno",l:"Catalog #"},{k:"format",l:"Format",opts:["CLV","CAV","CLV/CAV","Extended play"]},
    {k:"sides",l:"Sides"},{k:"edition",l:"Edition (e.g. Criterion, widescreen)"},{k:"region",l:"Region / system"}]},
  {id:"books", name:"Books", icon:"📚", maker:"Author", fields:[
    {k:"publisher",l:"Publisher"},{k:"edition",l:"Edition / printing"},{k:"isbn",l:"ISBN"},{k:"binding",l:"Binding",opts:["Hardcover","Paperback","Leather","Other"]},{k:"signed",l:"Signed / inscribed"}]},
  {id:"prints", name:"Art Prints", icon:"🖼️", maker:"Artist", fields:[
    {k:"medium",l:"Medium (screenprint, giclée…)"},{k:"edition",l:"Edition (e.g. 45/200)"},{k:"dimensions",l:"Dimensions"},{k:"framed",l:"Framed"},{k:"publisher",l:"Publisher / gallery"}]},
  {id:"autographs", name:"Autographs", icon:"✍️", maker:"Signer", fields:[
    {k:"signedItem",l:"Signed item"},{k:"inscription",l:"Inscription"},{k:"dateSigned",l:"Date / place signed"},{k:"authenticator",l:"Authenticator (PSA, JSA, BAS…)"},{k:"cert",l:"Cert #",priv:true}]},
  {id:"cels", name:"Animation Cels", icon:"🎞️", maker:"Studio", fields:[
    {k:"production",l:"Production / film / show"},{k:"characters",l:"Character(s)"},{k:"celType",l:"Type",opts:["Production cel","Production cel + drawing","Sericel","Limited edition","Key setup","Drawing"]},
    {k:"edition",l:"Edition #"},{k:"seal",l:"Seal / stamp / COA"},{k:"background",l:"Background"}]},
  {id:"pennies", name:"Pressed Pennies", icon:"🪙", maker:"Machine / set", fields:[
    {k:"place",l:"Location / attraction"},{k:"design",l:"Design"},{k:"coin",l:"Coin",opts:["Cent","Nickel","Dime","Quarter","Token","Foreign"]},{k:"coinYear",l:"Coin date"},{k:"orientation",l:"Orientation"},{k:"datePressed",l:"Date pressed"}]},
  {id:"memorabilia", name:"Memorabilia", icon:"🏆", maker:"Franchise / team", fields:[
    {k:"type",l:"Type of piece"},{k:"event",l:"Event / occasion"},{k:"provenance",l:"Provenance"}]},
  {id:"instruments", name:"Instruments", icon:"🎸", maker:"Brand", fields:[
    {k:"model",l:"Model"},{k:"serial",l:"Serial #",priv:true},{k:"mfgYear",l:"Year of manufacture"},{k:"finish",l:"Finish / color"},{k:"case",l:"Case"},{k:"mods",l:"Modifications / repairs"}]},
  {id:"antiques", name:"Antiques", icon:"🏺", maker:"Maker", fields:[
    {k:"era",l:"Period / era"},{k:"origin",l:"Origin"},{k:"materials",l:"Materials"},{k:"mark",l:"Maker's mark"},{k:"dimensions",l:"Dimensions"},{k:"provenance",l:"Provenance"}]},
];
function newCatalog(){
  return {version:1, title:"The Collection", collections:JSON.parse(JSON.stringify(PRESETS)), items:[], updated:new Date().toISOString()};
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n===""||n==null||isNaN(+n)) ? "" : (+n).toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:+n%1?2:0});
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

/* ============================================================
   Storage: on-device (IndexedDB) and Dropbox (App folder)
   ============================================================ */
class LocalStore {
  constructor(){ this.kind="local"; this.urls=new Map(); }
  db(){
    if(this._db) return this._db;
    this._db = new Promise((res,rej)=>{
      const r = indexedDB.open("collection-museum",1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("files"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  }
  async tx(store, mode, fn){
    const db = await this.db();
    return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); });
  }
  async load(){ return (await this.tx("kv","readonly",s=>s.get("catalog"))) || null; }
  async save(cat){ await this.tx("kv","readwrite",s=>s.put(cat,"catalog")); }
  async putFile(path, blob){ await this.tx("files","readwrite",s=>s.put(blob,path)); }
  async deleteFile(path){ this.urls.delete(path); await this.tx("files","readwrite",s=>s.delete(path)); }
  async getBlob(path){ return await this.tx("files","readonly",s=>s.get(path)); }
  async url(path){
    if(this.urls.has(path)) return this.urls.get(path);
    const b = await this.getBlob(path); if(!b) return null;
    const u = URL.createObjectURL(b); this.urls.set(path,u); return u;
  }
}

class DropboxStore {
  constructor(appKey){ this.kind="dropbox"; this.appKey=appKey; this.rev=null; this.links=new Map(Object.entries(LS.get("cm.links",{}))); }
  static redirectUri(){ return location.origin + location.pathname; }
  static b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  static async beginAuth(appKey){
    const verifier = DropboxStore.b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = DropboxStore.b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const state = uid();
    sessionStorage.setItem("cm.pkce", JSON.stringify({verifier, state, appKey}));
    const q = new URLSearchParams({client_id:appKey, response_type:"code", code_challenge:challenge, code_challenge_method:"S256",
      redirect_uri:DropboxStore.redirectUri(), token_access_type:"offline", state});
    location.href = "https://www.dropbox.com/oauth2/authorize?" + q;
  }
  static async finishAuth(){
    const p = new URLSearchParams(location.search);
    if(!p.has("code") && !p.has("error")) return false;
    history.replaceState(null, "", location.pathname + location.hash);
    if(p.has("error")) throw new Error("Dropbox sign-in was cancelled.");
    const saved = JSON.parse(sessionStorage.getItem("cm.pkce") || "null");
    if(!saved || saved.state !== p.get("state")) throw new Error("Dropbox sign-in could not be verified. Please try again.");
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams({
      code:p.get("code"), grant_type:"authorization_code", code_verifier:saved.verifier, client_id:saved.appKey, redirect_uri:DropboxStore.redirectUri()})});
    if(!r.ok) throw new Error("Dropbox sign-in failed (" + r.status + ").");
    const j = await r.json();
    LS.set("cm.dropbox", {appKey:saved.appKey, refresh:j.refresh_token, access:j.access_token, exp:Date.now()+(j.expires_in-60)*1000});
    LS.set("cm.mode","dropbox");
    sessionStorage.removeItem("cm.pkce");
    return true;
  }
  async token(){
    const a = LS.get("cm.dropbox", null);
    if(!a) throw new Error("Not connected to Dropbox.");
    if(a.access && a.exp > Date.now()) return a.access;
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams({grant_type:"refresh_token", refresh_token:a.refresh, client_id:a.appKey})});
    if(!r.ok){ if(r.status===400||r.status===401){ LS.del("cm.dropbox"); } throw new Error("Dropbox session expired. Please reconnect in Settings."); }
    const j = await r.json(); a.access=j.access_token; a.exp=Date.now()+(j.expires_in-60)*1000; LS.set("cm.dropbox",a); return a.access;
  }
  static arg(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0")); }
  async rpc(endpoint, body){
    const r = await fetch("https://api.dropboxapi.com/2/" + endpoint, {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary || "conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox error " + r.status);
    return r.json();
  }
  async upload(path, blob, mode){
    const r = await fetch("https://content.dropboxapi.com/2/files/upload", {method:"POST", headers:{Authorization:"Bearer " + await this.token(),
      "Content-Type":"application/octet-stream", "Dropbox-API-Arg":DropboxStore.arg({path, mode: mode || "overwrite", autorename:false, mute:true})}, body:blob});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary||"conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox upload failed (" + r.status + ")");
    return r.json();
  }
  async load(){
    let meta;
    try{ meta = await this.rpc("files/get_metadata", {path:"/catalog.json"}); }
    catch(e){ if((e.summary||"").includes("not_found")) { this.rev=null; return null; } throw e; }
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/catalog.json"})}});
    if(!r.ok) throw new Error("Could not read your catalog from Dropbox (" + r.status + ")");
    this.rev = meta.rev;
    return JSON.parse(await r.text());
  }
  async save(cat){
    const blob = new Blob([JSON.stringify(cat, null, 1)], {type:"application/json"});
    try{
      const m = await this.upload("/catalog.json", blob, this.rev ? {".tag":"update", update:this.rev} : {".tag":"add"});
      this.rev = m.rev;
    }catch(e){
      if((e.summary||"").includes("conflict")) throw new Error("Your catalog was changed on another device. Reload the page to get the latest, then redo this change.");
      throw e;
    }
  }
  async putFile(path, blob){ await this.upload("/" + path, blob, "overwrite"); }
  async deleteFile(path){ this.links.delete(path); try{ await this.rpc("files/delete_v2", {path:"/" + path}); }catch(e){ if(!(e.summary||"").includes("not_found")) throw e; } }
  async getBlob(path){
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/" + path})}});
    return r.ok ? r.blob() : null;
  }
  async url(path){
    const c = this.links.get(path);
    if(c && c.exp > Date.now()) return c.link;
    try{
      const j = await this.rpc("files/get_temporary_link", {path:"/" + path});
      this.links.set(path, {link:j.link, exp:Date.now() + 3.5*3600*1000});
      clearTimeout(this._lt); this._lt = setTimeout(()=>LS.set("cm.links", Object.fromEntries(this.links)), 500);
      return j.link;
    }catch{ return null; }
  }
}

/* Resolve <img data-path> after rendering */
async function hydrate(root){
  const imgs = [...root.querySelectorAll("img[data-path]")];
  let i = 0;
  async function worker(){ while(i < imgs.length){ const el = imgs[i++]; const u = await store.url(el.dataset.path); if(u) el.src = u; else el.replaceWith(Object.assign(document.createElement("span"),{textContent:"🖼️"})); } }
  await Promise.all(Array.from({length:6}, worker));
}

function plate(it){
  const c = coll(it.collectionId), m = cover(it);
  const inner = m ? `<img alt="${esc(it.title)}" data-path="${esc(m.thumb||m.path)}" loading="lazy">`
    : `<div class="placeholder"><div class="em">${c.icon}</div><div class="t">${esc(it.title)}</div></div>`;
  const sub = [it.maker, it.year].filter(Boolean).join(" · ");
  return `<a class="card" href="#/i/${it.id}"><div class="frame"><div class="matte">${inner}</div></div>
    <div class="plaque"><div class="t">${it.favorite?'<span class="star">★</span> ':""}${esc(it.title)}</div><div class="s">${esc(sub)||"&nbsp;"}</div></div></a>`;
}

function matches(it, q){
  if(!q) return true;
  const c = coll(it.collectionId);
  const hay = [it.title, it.maker, it.year, it.location, it.notes, it.condition, it.source, c.name, ...(it.tags||[]),
    ...Object.entries(it.fields||{}).filter(([k])=>!priv || !(c.fields.find(f=>f.k===k)||{}).priv).map(([,v])=>v)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function sortItems(list, how){
  const by = {
    recent:(a,b)=> (b.created||"").localeCompare(a.created||""),
    title:(a,b)=> (a.title||"").localeCompare(b.title||"", undefined, {numeric:true}),
    maker:(a,b)=> (a.maker||"").localeCompare(b.maker||"") || (a.title||"").localeCompare(b.title||""),
    year:(a,b)=> (parseInt(a.year)||9999) - (parseInt(b.year)||9999),
    value:(a,b)=> (+b.value||0) - (+a.value||0),
  }[how] || (()=>0);
  return [...list].sort(by);
}

/* ---------- Image processing ---------- */
async function shrink(file, max, quality){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch{ bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, s = Math.min(1, max / Math.max(w,h));
  const cv = document.createElement("canvas"); cv.width = Math.round(w*s); cv.height = Math.round(h*s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, "image/jpeg", quality));
}

  function collect(){
    const f = document.getElementById("ef"), d = new FormData(f), c = coll(it.collectionId);
    ["title","maker","year","condition","location","acquiredDate","source","notes"].forEach(k => it[k] = (d.get(k)||"").trim());
    ["price","value"].forEach(k => { const v = (d.get(k)||"").replace(/[$,\s]/g,""); it[k] = v === "" ? "" : (isNaN(+v) ? v : +v); });
    it.tags = (d.get("tags")||"").split(",").map(s=>s.trim()).filter(Boolean);
    it.favorite = d.get("favorite") === "on";
    it.fields = it.fields || {};
    c.fields.forEach(x => { const v = (d.get("x_"+x.k)||"").trim(); if(v) it.fields[x.k] = v; else delete it.fields[x.k]; });
    document.querySelectorAll("#media [data-label]").forEach(inp => { const m = it.media.find(m=>m.id===inp.dataset.label); if(m) m.label = inp.value.trim(); });
  }

  function renderMedia(){
    const el = document.getElementById("media");
    el.innerHTML = it.media.map((m,n) => {
      const p = pending.find(p => p.m === m);
      const im = m.kind === "photo" ? (p ? `<img src="${p.previewUrl}" alt="">` : `<img alt="" data-path="${esc(m.thumb||m.path)}">`) : (/pdf$/i.test(m.name||"") ? "📄" : "📜");
      return `<div class="mtile"><div class="im">${im}</div><div class="row">
        ${m.kind === "photo" ? `<span style="flex:1;color:var(--muted)">${n===it.media.findIndex(x=>x.kind==="photo")?"Cover":"Photo"}</span><button type="button" data-cover="${m.id}" title="Make cover">⤒</button>`
          : `<input data-label="${m.id}" value="${esc(m.label||"")}" placeholder="COA, receipt…">`}
        <button type="button" data-rm="${m.id}" title="Remove">✕</button></div></div>`;
    }).join("");
    el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { collect(); const i = it.media.findIndex(m=>m.id===b.dataset.rm); const [m] = it.media.splice(i,1);
      const pi = pending.findIndex(p=>p.m===m); if(pi>=0) pending.splice(pi,1); else removed.push(m); renderMedia(); });
    el.querySelectorAll("[data-cover]").forEach(b => b.onclick = () => { collect(); const i = it.media.findIndex(m=>m.id===b.dataset.cover); const [m] = it.media.splice(i,1); it.media.unshift(m); renderMedia(); });
    hydrate(el);
  }

  async function addFiles(files, kind){
    collect();
    const done = busy("Preparing " + files.length + " file" + (files.length>1?"s":"") + "…");
    try{
      for(const file of files){
        const mid = uid(), isImg = /^image\//.test(file.type);
        const base = "media/" + it.id + "/" + mid;
        if(kind === "photo"){
          if(!isImg) continue;
          const full = await shrink(file, 2400, .88), th = await shrink(file, 520, .8);
          const m = {id:mid, kind:"photo", name:safeName(file.name), path:base + ".jpg", thumb:base + "_t.jpg"};
          it.media.push(m); pending.push({m, blob:full, thumbBlob:th, previewUrl:URL.createObjectURL(th)});
        }else{
          const ext = (file.name.match(/\.\w+$/)||[isImg?".jpg":".pdf"])[0].toLowerCase();
          const m = {id:mid, kind:"document", name:safeName(file.name), path:base + ext, label:/coa|cert|authent/i.test(file.name) ? "Certificate of authenticity" : ""};
          it.media.push(m); pending.push({m, blob:file});
        }
      }
    }catch(e){ alert("Couldn't read one of those files: " + e.message); }
    finally{ done(); renderMedia(); }
  }

  async function save(){
    if(!it.title) return toast("Please add a title.");
    const done = busy(pending.length ? "Uploading " + pending.length + " file" + (pending.length>1?"s":"") + "…" : "Saving…");
    try{
      for(const p of pending){ await store.putFile(p.m.path, p.blob); if(p.thumbBlob) await store.putFile(p.m.thumb, p.thumbBlob); }
      it.updated = new Date().toISOString(); it.created = it.created || it.updated;
      const idx = cat.items.findIndex(x => x.id === it.id);
      const before = idx >= 0 ? cat.items[idx] : null;
      if(idx >= 0) cat.items[idx] = it; else cat.items.push(it);
      try{ await persist(); }catch(e){ if(before) cat.items[idx] = before; else cat.items.pop(); throw e; }
      for(const m of removed){ store.deleteFile(m.path).catch(()=>{}); if(m.thumb) store.deleteFile(m.thumb).catch(()=>{}); }
      pending.length = 0;
      toast("Saved");
      location.hash = "#/i/" + it.id;
    }catch(e){ alert(e.message); } finally{ done(); }
  }
  render();
}

function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exportCSV(){
  const fieldCols = []; cat.collections.forEach(c => c.fields.forEach(f => { if(!fieldCols.some(x=>x.l===f.l)) fieldCols.push(f); }));
  const head = ["Gallery","Title","Maker","Year","Condition","Location","Acquired","Source","Price paid","Estimated value","Tags","Notes", ...fieldCols.map(f=>f.l), "Photos","Documents"];
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const rows = sortItems(cat.items,"title").map(i => { const c = coll(i.collectionId);
    return [c.name, i.title, i.maker, i.year, i.condition, i.location, i.acquiredDate, i.source, i.price, i.value, (i.tags||[]).join("; "), i.notes,
      ...fieldCols.map(fc => { const f = c.fields.find(x=>x.l===fc.l); return f ? (i.fields||{})[f.k] : ""; }),
      (i.media||[]).filter(m=>m.kind==="photo").length, (i.media||[]).filter(m=>m.kind!=="photo").map(m=>m.label||m.name).join("; ")]; });
  download(new Blob(["﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n")], {type:"text/csv"}), "collection-" + new Date().toISOString().slice(0,10) + ".csv");
}

      <td>${esc((i.media||[]).filter(m=>m.kind!=="photo").map(m=>m.label||"Document").join(", "))}</td></tr>`).join("")}

function notFound(){ app.innerHTML = `<div class="empty">That piece isn't here. <a href="#/">Back to the museum</a></div>`; }

/* ============================================================
   Router + boot
   ============================================================ */
function route(){
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?"), params = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  document.getElementById("layer").innerHTML = "";
  window.scrollTo(0, 0);
  if(!parts.length) return viewHome(params);
  if(parts[0]==="c") return viewHall(parts[1], params);
  if(parts[0]==="i") return viewItem(parts[1]);
  if(parts[0]==="new") return viewEdit(null, params);
  if(parts[0]==="edit") return viewEdit(parts[1], params);
  if(parts[0]==="settings") return viewSettings();
  if(parts[0]==="report") return viewReport();
  notFound();
}

async function boot(){
  setPriv(priv);
  app.innerHTML = `<div class="empty">Opening the museum…</div>`;
  let justConnected = false;
  try{ justConnected = await DropboxStore.finishAuth(); }catch(e){ alert(e.message); }
  const dbx = LS.get("cm.dropbox", null);
  const local = new LocalStore();
  if(LS.get("cm.mode","local") === "dropbox" && dbx){
    store = new DropboxStore(dbx.appKey);
    try{
      cat = await store.load();
      if(!cat){
        // First connection: start fresh, or carry over what's on this device.
        const prev = await local.load().catch(()=>null);
        cat = newCatalog();
        if(justConnected && LS.get("cm.carry", true) && prev && prev.items.length){
          const done = busy("Copying " + prev.items.length + " pieces to Dropbox…");
          try{
            for(const it of prev.items) for(const m of it.media||[]){
              const b = await local.getBlob(m.path); if(b) await store.putFile(m.path, b);
              if(m.thumb){ const tb = await local.getBlob(m.thumb); if(tb) await store.putFile(m.thumb, tb); }
            }
            cat = prev;
          } finally { done(); }
        }
        await store.save(cat);
      }
      if(justConnected) toast("Connected to Dropbox");
    }catch(e){
      app.innerHTML = `<div class="panel"><h2>Couldn't reach Dropbox</h2><p>${esc(e.message)}</p><div class="actions"><button class="iconbtn primary" onclick="location.reload()">Try again</button><a class="iconbtn" href="#/settings" onclick="setTimeout(()=>location.reload())">Settings</a></div></div>`;
      if(/reconnect|Not connected/.test(e.message)) LS.set("cm.mode","local");
      return;
    }
  }else{
    store = local;
    cat = (await local.load().catch(()=>null)) || newCatalog();
  }
  // Make sure newer preset galleries/fields exist in older catalogs.
  PRESETS.forEach(p => { const c = cat.collections.find(x=>x.id===p.id); if(!c) return; p.fields.forEach(f => { if(!c.fields.some(x=>x.k===f.k)) c.fields.push(JSON.parse(JSON.stringify(f))); }); });
  setBrand();
  window.addEventListener("hashchange", route);
  route();
}
boot();
