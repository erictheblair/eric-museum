<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Collection</title>
<meta name="description" content="A private museum for personal collections.">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Museum">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --ink:#1d1a16; --muted:#6f665b; --line:#e2d9c9;
  --accent:#8a2b1d; --accent-ink:#fff; --frame:#2a241d; --mat:#efe7d8; --chip:#ece4d4;
  --danger:#a1271b; --ok:#2f6b3a; --shadow:0 1px 2px rgba(40,30,20,.08),0 6px 20px rgba(40,30,20,.08);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15130f; --surface:#1f1c17; --ink:#f1ebe0; --muted:#a69c8e; --line:#38322a; --accent:#d9846f; --accent-ink:#1a1210;
    --frame:#0c0b09; --mat:#2a261f; --chip:#2e2922; --danger:#ef7d6e; --ok:#86c493; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:var(--serif);font-size:1.25rem;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-size:.9rem}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:20px 0 80px}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.hero{padding:18px 0 22px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.hero p{color:var(--muted);margin:.4rem 0 0}
.search{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
.search select{flex:0 0 auto;max-width:48%}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-top:8px}
.stats b{color:var(--ink);font-family:var(--serif);font-size:1.1rem;font-weight:600;margin-right:4px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;gap:10px}
.section-title h2{font-size:1.35rem}
.section-title span{color:var(--muted);font-size:.85rem}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.hall{position:relative;display:block;text-decoration:none;border-radius:14px;overflow:hidden;background:var(--frame);aspect-ratio:4/3;box-shadow:var(--shadow)}
.hall img{width:100%;height:100%;object-fit:cover;opacity:.72;transition:transform .5s,opacity .3s}
.hall:hover img{transform:scale(1.04);opacity:.6}
.hall .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4rem;opacity:.35}
.hall .label{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hall .label h3{font-size:1.3rem}
.hall .label span{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:block;text-decoration:none;min-width:0}
.frame{background:var(--frame);padding:7px;border-radius:4px;box-shadow:var(--shadow)}
.matte{background:var(--mat);padding:8px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.matte img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px;padding:8px}
.placeholder .em{font-size:2.4rem;opacity:.7}
.placeholder .t{font-family:var(--serif);font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plaque{padding:9px 2px 0}
.plaque .t{font-family:var(--serif);font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plaque .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#c8962c}
/* compact view */
.sizer{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.sizer button{border:none;background:none;padding:5px 11px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.sizer button.on{background:var(--ink);color:var(--bg)}
.dense .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.dense .frame{padding:3px;border-radius:3px}
.dense .matte{padding:3px}
.dense .plaque{padding-top:5px}
.dense .plaque .t{font-size:.78rem;-webkit-line-clamp:1}
.dense .plaque .s{font-size:.68rem}
.dense .placeholder .em{font-size:1.5rem}
.dense .placeholder .t{display:none}
.dense .halls{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dense .hall{aspect-ratio:16/9;border-radius:10px}
.dense .hall .label{padding:8px 10px}
.dense .hall .label h3{font-size:.95rem}
.dense .hall .label span{font-size:.62rem}
.dense .hall .ph{font-size:2.2rem}
@media (max-width:520px){
  .dense .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .dense .plaque .s{display:none}
  .dense .halls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* item */
.item{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:820px){.item{grid-template-columns:minmax(0,1fr);gap:18px}}
.viewer .frame{padding:10px}
.viewer .matte{aspect-ratio:auto;min-height:260px;max-height:70vh;padding:14px;cursor:zoom-in}
.viewer .matte img{max-height:calc(70vh - 28px)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
.thumbs button{flex:0 0 64px;height:64px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:var(--mat);cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.crumbs a{text-decoration:none}
.item h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.15}
.item .by{color:var(--muted);margin:.35rem 0 1rem;font-size:1.02rem}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;border-top:1px solid var(--line);padding-top:14px}
dl.facts dt{color:var(--muted);font-size:.85rem;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.docs{display:grid;gap:8px;margin-top:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.doc .ic{font-size:1.3rem}
.doc .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:520px){.brand small{display:none} #privBtn .lbl{font-size:.85rem}}
.hidden-val{letter-spacing:.2em;color:var(--muted)}
/* forms */
form.edit{max-width:760px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.8rem;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;min-width:0;width:100%}
.f textarea{min-height:110px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 16px}
legend{font-family:var(--serif);font-weight:600;padding:0 6px}
.media-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.mtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:.78rem}
.mtile .im{aspect-ratio:1/1;background:var(--mat);display:flex;align-items:center;justify-content:center;font-size:2rem}
.mtile .im img{width:100%;height:100%;object-fit:cover}
.mtile .row{display:flex;gap:4px;padding:6px;align-items:center}
.mtile input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);font-size:.78rem}
.mtile button{border:none;background:none;cursor:pointer;padding:2px 4px;font-size:.95rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
/* overlay */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.96);display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox img.zoom{max-width:none;max-height:none;width:auto}
.lightbox .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2}
.scanner{position:fixed;inset:0;z-index:52;background:#000;display:flex;flex-direction:column;color:#fff}
.scanner video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.scanner .aim{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.scanner .bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;flex-direction:column;gap:10px}
.scanner .bar form{display:flex;gap:8px}
.scanner .bar input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;padding:0 12px}
.scanner .msg{font-size:.92rem;color:#ddd}
.found{border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.found img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:var(--mat)}
.found .grow{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--surface);padding:14px 18px;border-radius:12px;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:6px}
.panel p{margin:.4rem 0;color:var(--muted);font-size:.92rem}
.panel code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:.85rem;overflow-wrap:anywhere}
ol.steps{padding-left:20px;margin:.5rem 0;font-size:.92rem}
ol.steps li{margin:.3rem 0}
.fabs{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:10px}
.fab.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fab{height:54px;padding:0 20px;border-radius:999px;border:none;background:var(--accent);color:var(--accent-ink);font-size:1rem;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
/* report */
table.report{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:20px}
table.report th,table.report td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.report td.n,table.report th.n{text-align:right;white-space:nowrap}
.report-wrap{overflow-x:auto}
@media print{header.top,.fabs,.noprint{display:none!important} body{background:#fff;color:#000} main{padding:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/" id="brand">The Collection<small>Private museum</small></a>
  <button class="iconbtn" id="privBtn" title="Private mode hides values, prices and serial numbers" aria-pressed="false">👁 <span class="lbl">Show values</span></button>
  <a class="iconbtn" href="#/settings" title="Settings">⚙︎</a>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="layer"></div>

<script>
"use strict";
/* ============================================================
   Collection presets and data model
   ============================================================ */
const CONDITIONS = ["Mint","Near Mint","Excellent","Very Good","Good","Fair","Poor"];
const PRESETS = [
  {id:"records", name:"Records", icon:"🎵", maker:"Artist", fields:[
    {k:"format",l:"Format",opts:["LP","EP","7\" single","12\" single","78","Box set","Picture disc"]},{k:"label",l:"Label"},{k:"catno",l:"Catalog #"},
    {k:"pressing",l:"Pressing / country"},{k:"matrix",l:"Matrix / runout"},{k:"mediaGrade",l:"Media grade"},{k:"sleeveGrade",l:"Sleeve grade"}]},
  {id:"laserdiscs", name:"Laserdiscs", icon:"💿", maker:"Director", fields:[
    {k:"label",l:"Label / publisher"},{k:"catno",l:"Catalog #"},{k:"format",l:"Format",opts:["CLV","CAV","CLV/CAV","Extended play"]},
    {k:"sides",l:"Sides"},{k:"edition",l:"Edition (e.g. Criterion, widescreen)"},{k:"region",l:"Region / system"},{k:"runtime",l:"Runtime"},{k:"cast",l:"Starring"},{k:"studio",l:"Studio"}]},
  {id:"movies", name:"Movies", icon:"🎬", maker:"Director", fields:[
    {k:"format",l:"Format",opts:["DVD","Blu-ray","4K UHD","VHS","Betamax","Film reel"]},{k:"studio",l:"Studio"},{k:"label",l:"Label / distributor"},{k:"catno",l:"Catalog / spine #"},
    {k:"edition",l:"Edition (e.g. steelbook, Criterion)"},{k:"runtime",l:"Runtime"},{k:"cast",l:"Starring"},{k:"region",l:"Region"}]},
  {id:"books", name:"Books", icon:"📚", maker:"Author", fields:[
    {k:"publisher",l:"Publisher"},{k:"edition",l:"Edition / printing"},{k:"isbn",l:"ISBN"},{k:"binding",l:"Binding",opts:["Hardcover","Paperback","Leather","Other"]},{k:"signed",l:"Signed / inscribed"}]},
  {id:"prints", name:"Art Prints", icon:"🖼️", maker:"Artist", fields:[
    {k:"medium",l:"Medium (screenprint, giclée…)"},{k:"edition",l:"Edition (e.g. 45/200)"},{k:"dimensions",l:"Dimensions"},{k:"framed",l:"Framed"},{k:"publisher",l:"Publisher / gallery"}]},
  {id:"autographs", name:"Autographs", icon:"✍️", maker:"Signer", fields:[
    {k:"signedItem",l:"Signed item"},{k:"inscription",l:"Inscription"},{k:"dateSigned",l:"Date / place signed"},{k:"authenticator",l:"Authenticator (PSA, JSA, BAS…)"},{k:"cert",l:"Cert #",priv:true}]},
  {id:"cels", name:"Animation Cels", icon:"🎞️", maker:"Studio", fields:[
    {k:"production",l:"Production / film / show"},{k:"characters",l:"Character(s)"},{k:"celType",l:"Type",opts:["Production cel","Production cel + drawing","Sericel","Limited edition","Key setup","Drawing"]},
    {k:"edition",l:"Edition #"},{k:"seal",l:"Seal / stamp / COA"},{k:"background",l:"Background"}]},
  {id:"pennies", name:"Pressed Pennies", icon:"🪙", maker:"Machine / set", fields:[
    {k:"place",l:"Location / attraction"},{k:"design",l:"Design"},{k:"coin",l:"Coin",opts:["Cent","Nickel","Dime","Quarter","Token","Foreign"]},{k:"coinYear",l:"Coin date"},{k:"orientation",l:"Orientation"},{k:"datePressed",l:"Date pressed"}]},
  {id:"memorabilia", name:"Memorabilia", icon:"🏆", maker:"Franchise / team", fields:[
    {k:"type",l:"Type of piece"},{k:"event",l:"Event / occasion"},{k:"provenance",l:"Provenance"}]},
  {id:"instruments", name:"Instruments", icon:"🎸", maker:"Brand", fields:[
    {k:"model",l:"Model"},{k:"serial",l:"Serial #",priv:true},{k:"mfgYear",l:"Year of manufacture"},{k:"finish",l:"Finish / color"},{k:"case",l:"Case"},{k:"mods",l:"Modifications / repairs"}]},
  {id:"antiques", name:"Antiques", icon:"🏺", maker:"Maker", fields:[
    {k:"era",l:"Period / era"},{k:"origin",l:"Origin"},{k:"materials",l:"Materials"},{k:"mark",l:"Maker's mark"},{k:"dimensions",l:"Dimensions"},{k:"provenance",l:"Provenance"}]},
];
function newCatalog(){
  return {version:1, title:"The Collection", collections:JSON.parse(JSON.stringify(PRESETS)), presetsSeen:PRESETS.map(p=>p.id), items:[], updated:new Date().toISOString()};
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n===""||n==null||isNaN(+n)) ? "" : (+n).toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:+n%1?2:0});
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

/* ============================================================
   Storage: on-device (IndexedDB) and Dropbox (App folder)
   ============================================================ */
class LocalStore {
  constructor(){ this.kind="local"; this.urls=new Map(); }
  db(){
    if(this._db) return this._db;
    this._db = new Promise((res,rej)=>{
      const r = indexedDB.open("collection-museum",1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("files"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  }
  async tx(store, mode, fn){
    const db = await this.db();
    return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); });
  }
  async load(){ return (await this.tx("kv","readonly",s=>s.get("catalog"))) || null; }
  async save(cat){ await this.tx("kv","readwrite",s=>s.put(cat,"catalog")); }
  async putFile(path, blob){ await this.tx("files","readwrite",s=>s.put(blob,path)); }
  async deleteFile(path){ this.urls.delete(path); await this.tx("files","readwrite",s=>s.delete(path)); }
  async getBlob(path){ return await this.tx("files","readonly",s=>s.get(path)); }
  async url(path){
    if(this.urls.has(path)) return this.urls.get(path);
    const b = await this.getBlob(path); if(!b) return null;
    const u = URL.createObjectURL(b); this.urls.set(path,u); return u;
  }
}

class DropboxStore {
  constructor(appKey){ this.kind="dropbox"; this.appKey=appKey; this.rev=null; this.links=new Map(Object.entries(LS.get("cm.links",{}))); }
  static redirectUri(){ return location.origin + location.pathname; }
  static b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  static standalone(){ return navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }
  // Prepared ahead of the tap: iPhone home-screen apps ignore navigation that happens after an await.
  static async prepare(){
    const verifier = DropboxStore.b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = DropboxStore.b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    return {verifier, challenge, state:uid()};
  }
  static authUrl(appKey, pre, manual){
    const q = new URLSearchParams({client_id:appKey, response_type:"code", code_challenge:pre.challenge, code_challenge_method:"S256", token_access_type:"offline"});
    if(!manual){ q.set("redirect_uri", DropboxStore.redirectUri()); q.set("state", pre.state); }
    return "https://www.dropbox.com/oauth2/authorize?" + q;
  }
  static remember(appKey, pre, manual){ LS.set("cm.pkce", {verifier:pre.verifier, state:pre.state, appKey, manual:!!manual}); }
  static async exchange(code, saved, withRedirect){
    const body = {code, grant_type:"authorization_code", code_verifier:saved.verifier, client_id:saved.appKey};
    if(withRedirect) body.redirect_uri = DropboxStore.redirectUri();
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams(body)});
    if(!r.ok){ const t = await r.text().catch(()=> ""); authLog("sign-in exchange failed " + r.status + " " + t.slice(0,120)); throw new Error("Dropbox sign-in failed (" + r.status + "). Please try again."); }
    const j = await r.json();
    LS.set("cm.dropbox", {appKey:saved.appKey, refresh:j.refresh_token, access:j.access_token, exp:Date.now()+(j.expires_in-60)*1000, since:new Date().toISOString()});
    LS.set("cm.mode","dropbox"); LS.del("cm.pkce");
    authLog("connected" + (DropboxStore.standalone() ? " (home-screen app)" : " (browser)"));
  }
  static async finishManual(code){
    const saved = LS.get("cm.pkce", null);
    if(!saved) throw new Error("Please tap “Connect Dropbox” again first.");
    await DropboxStore.exchange(code.trim(), saved, false);
  }
  static async finishAuth(){
    const p = new URLSearchParams(location.search);
    if(!p.has("code") && !p.has("error")) return false;
    history.replaceState(null, "", location.pathname + location.hash);
    if(p.has("error")) throw new Error("Dropbox sign-in was cancelled.");
    const saved = LS.get("cm.pkce", null);
    if(!saved){ authLog("sign-in returned but no pending sign-in on this device"); throw new Error("Dropbox sign-in could not be finished here. Please tap Connect Dropbox again."); }
    // PKCE ties the code to this device's secret, so a code from another sign-in simply fails to exchange.
    if(saved.state !== p.get("state")) authLog("state differs (" + (p.get("state") ? "other" : "none") + ", " + (saved.manual ? "manual" : "redirect") + "); trying anyway");
    try{ await DropboxStore.exchange(p.get("code"), saved, true); }
    catch(e){ await DropboxStore.exchange(p.get("code"), saved, false); }
    return true;
  }
  async token(){
    const a = LS.get("cm.dropbox", null);
    if(!a) throw new Error("Not connected to Dropbox.");
    if(a.access && a.exp > Date.now()) return a.access;
    if(this._refreshing) return this._refreshing;
    this._refreshing = (async () => {
      let r;
      try{ r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams({grant_type:"refresh_token", refresh_token:a.refresh, client_id:a.appKey})}); }
      catch(e){ throw new Error("Couldn't reach Dropbox. Check your connection and try again."); }
      if(!r.ok){
        const j = await r.json().catch(()=>({}));
        authLog("refresh failed " + r.status + " " + (j.error || "") + " " + (j.error_description || ""));
        if(j.error === "invalid_grant"){ LS.del("cm.dropbox"); const e = new Error("Dropbox sign-in expired or was revoked. Please reconnect in Settings."); e.signedOut = true; throw e; }
        throw new Error("Dropbox is having trouble right now (" + r.status + "). Please try again in a minute.");
      }
      const j = await r.json(); a.access=j.access_token; a.exp=Date.now()+(j.expires_in-60)*1000; LS.set("cm.dropbox",a); return a.access;
    })();
    try{ return await this._refreshing; } finally{ this._refreshing = null; }
  }
  static arg(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0")); }
  async rpc(endpoint, body){
    const r = await fetch("https://api.dropboxapi.com/2/" + endpoint, {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary || "conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox error " + r.status);
    return r.json();
  }
  async upload(path, blob, mode){
    const r = await fetch("https://content.dropboxapi.com/2/files/upload", {method:"POST", headers:{Authorization:"Bearer " + await this.token(),
      "Content-Type":"application/octet-stream", "Dropbox-API-Arg":DropboxStore.arg({path, mode: mode || "overwrite", autorename:false, mute:true})}, body:blob});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary||"conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox upload failed (" + r.status + ")");
    return r.json();
  }
  async load(){
    let meta;
    try{ meta = await this.rpc("files/get_metadata", {path:"/catalog.json"}); }
    catch(e){ if((e.summary||"").includes("not_found")) { this.rev=null; return null; } throw e; }
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/catalog.json"})}});
    if(!r.ok) throw new Error("Could not read your catalog from Dropbox (" + r.status + ")");
    this.rev = meta.rev;
    return JSON.parse(await r.text());
  }
  async save(cat){
    const blob = new Blob([JSON.stringify(cat, null, 1)], {type:"application/json"});
    try{
      const m = await this.upload("/catalog.json", blob, this.rev ? {".tag":"update", update:this.rev} : {".tag":"add"});
      this.rev = m.rev;
    }catch(e){
      if((e.summary||"").includes("conflict")) throw new Error("Your catalog was changed on another device. Reload the page to get the latest, then redo this change.");
      throw e;
    }
  }
  async putFile(path, blob){ await this.upload("/" + path, blob, "overwrite"); }
  async deleteFile(path){ this.links.delete(path); try{ await this.rpc("files/delete_v2", {path:"/" + path}); }catch(e){ if(!(e.summary||"").includes("not_found")) throw e; } }
  async getBlob(path){
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/" + path})}});
    return r.ok ? r.blob() : null;
  }
  async url(path){
    const c = this.links.get(path);
    if(c && c.exp > Date.now()) return c.link;
    try{
      const j = await this.rpc("files/get_temporary_link", {path:"/" + path});
      this.links.set(path, {link:j.link, exp:Date.now() + 3.5*3600*1000});
      clearTimeout(this._lt); this._lt = setTimeout(()=>LS.set("cm.links", Object.fromEntries(this.links)), 500);
      return j.link;
    }catch{ return null; }
  }
}

function authLog(msg){ const l = LS.get("cm.authlog", []); l.unshift(new Date().toLocaleString() + ": " + msg); LS.set("cm.authlog", l.slice(0,8)); }
let store, cat, priv = LS.get("cm.private", true);
const coll = id => cat.collections.find(c => c.id === id) || {id, name:"Uncategorized", icon:"📦", maker:"Maker", fields:[]};
const item = id => cat.items.find(i => i.id === id);
const cover = it => (it.media||[]).find(m => m.kind === "photo");

function toast(msg, ms=2600){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function busy(msg){ const b=document.createElement("div"); b.className="busy"; b.innerHTML="<div>"+esc(msg||"Saving…")+"</div>"; document.body.appendChild(b); return ()=>b.remove(); }
async function persist(){ cat.updated = new Date().toISOString(); await store.save(cat); }

function setPriv(v){
  priv = v; LS.set("cm.private", v);
  const b = document.getElementById("privBtn");
  b.setAttribute("aria-pressed", String(!v));
  b.querySelector(".lbl").textContent = v ? "Show values" : "Hide values";
}
document.getElementById("privBtn").onclick = () => { setPriv(!priv); route(); };

/* Large / small grid toggle */
function sizer(){ const d = document.body.classList.contains("dense");
  return `<span class="sizer" role="group" aria-label="Grid size"><button type="button" data-size="large" class="${d?"":"on"}" aria-pressed="${!d}">Large</button><button type="button" data-size="small" class="${d?"on":""}" aria-pressed="${d}">Small</button></span>`; }
function setDense(v){ document.body.classList.toggle("dense", v); LS.set("cm.dense", v);
  document.querySelectorAll(".sizer button").forEach(b => { const on = (b.dataset.size === "small") === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
document.addEventListener("click", e => { const b = e.target.closest(".sizer button"); if(b) setDense(b.dataset.size === "small"); });
document.body.classList.toggle("dense", LS.get("cm.dense", false));

/* Resolve <img data-path> after rendering */
async function hydrate(root){
  const imgs = [...root.querySelectorAll("img[data-path]")];
  let i = 0;
  async function worker(){ while(i < imgs.length){ const el = imgs[i++]; const u = await store.url(el.dataset.path); if(u) el.src = u; else el.replaceWith(Object.assign(document.createElement("span"),{textContent:"🖼️"})); } }
  await Promise.all(Array.from({length:6}, worker));
}

function plate(it){
  const c = coll(it.collectionId), m = cover(it);
  const inner = m ? `<img alt="${esc(it.title)}" data-path="${esc(m.thumb||m.path)}" loading="lazy">`
    : `<div class="placeholder"><div class="em">${c.icon}</div><div class="t">${esc(it.title)}</div></div>`;
  const sub = [it.maker, it.year].filter(Boolean).join(" · ");
  return `<a class="card" href="#/i/${it.id}"><div class="frame"><div class="matte">${inner}</div></div>
    <div class="plaque"><div class="t">${it.favorite?'<span class="star">★</span> ':""}${esc(it.title)}</div><div class="s">${esc(sub)||"&nbsp;"}</div></div></a>`;
}

function matches(it, q){
  if(!q) return true;
  const c = coll(it.collectionId);
  const hay = [it.title, it.maker, it.year, it.barcode, it.location, it.notes, it.condition, it.source, c.name, ...(it.tags||[]), ...(it.extra||[]).map(x=>x.v),
    ...Object.entries(it.fields||{}).filter(([k])=>!priv || !(c.fields.find(f=>f.k===k)||{}).priv).map(([,v])=>v)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function sortItems(list, how){
  const by = {
    recent:(a,b)=> (b.created||"").localeCompare(a.created||""),
    title:(a,b)=> (a.title||"").localeCompare(b.title||"", undefined, {numeric:true}),
    maker:(a,b)=> (a.maker||"").localeCompare(b.maker||"") || (a.title||"").localeCompare(b.title||""),
    year:(a,b)=> (parseInt(a.year)||9999) - (parseInt(b.year)||9999),
    value:(a,b)=> (+b.value||0) - (+a.value||0),
  }[how] || (()=>0);
  return [...list].sort(by);
}

const app = document.getElementById("app");

function modeBanner(){
  if(store.kind === "dropbox") return "";
  return `<div class="banner noprint"><span>🗄️</span><div class="grow">${cat.items.length ? "This catalog is saved on this device only." : "Welcome! Your catalog is on this device for now."}

}

  const halls = cat.collections.filter(c => counts[c.id]).concat(cat.collections.filter(c => !counts[c.id]));

    <p>A private museum of things worth keeping.</p>
    <form class="search" id="sf"><input type="search" name="q" placeholder="Search everything: artist, title, tag, place…" value="${esc(q)}" aria-label="Search"></form>
    <div class="stats"><span><b>${cat.items.length}</b>pieces</span><span><b>${Object.keys(counts).length}</b>collections</span>
      ${priv ? "" : `<span><b>${esc(money(total)||"$0")}</b>estimated value</span>`}</div>
  </section>
  ${results ? `<div class="section-title"><h2>Results</h2><span>${results.length} found</span></div>
      ${results.length ? `<div class="grid">${results.map(plate).join("")}</div>` : `<div class="empty">Nothing matches “${esc(q)}”.</div>`}` : `
  ${favs.length ? `<div class="section-title"><h2>Highlights</h2><span>Starred pieces</span></div><div class="grid">${favs.map(plate).join("")}</div>` : ""}
  <div class="section-title"><h2>Galleries</h2><span style="display:flex;gap:10px;align-items:center">${sizer()}<a href="#/settings">Manage</a></span></div>
  <div class="halls">${halls.map(c => { const it = sortItems(cat.items.filter(i=>i.collectionId===c.id && cover(i)), "recent").sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0))[0];
    return `<a class="hall" href="#/c/${c.id}">${it ? `<img alt="" data-path="${esc(cover(it).thumb||cover(it).path)}" loading="lazy">` : `<div class="ph">${c.icon}</div>`}
      <div class="label"><h3>${c.icon} ${esc(c.name)}</h3><span>${counts[c.id]||0} ${counts[c.id]===1?"piece":"pieces"}</span></div></a>`; }).join("")}</div>
  ${recent.length ? `<div class="section-title"><h2>Recently added</h2></div><div class="grid">${recent.map(plate).join("")}</div>` : ""}`}
  <div class="fabs"><a class="fab ghost" href="#/new?scan=1">▦ Scan</a><a class="fab" href="#/new">＋ Add a piece</a></div>`;
  document.getElementById("sf").onsubmit = e => { e.preventDefault(); const v = new FormData(e.target).get("q").trim(); location.hash = v ? "#/?q=" + encodeURIComponent(v) : "#/"; };
  hydrate(app);
}

function viewHall(id, params){
  const c = coll(id);
  const q = params.get("q") || "", sort = params.get("sort") || LS.get("cm.sort."+id, "title"), tag = params.get("tag") || "";
  document.title = c.name + " · " + (cat.title||"The Collection");

  const total = all.reduce((s,i)=>s+(+i.value||0),0);
  const link = (o) => { const p = new URLSearchParams({q, sort, tag, ...o}); [...p.keys()].forEach(k=>{ if(!p.get(k)) p.delete(k); }); return "#/c/"+id+(p.toString()?"?"+p:""); };
  app.innerHTML = `<div class="crumbs" style="display:flex;justify-content:space-between;gap:8px"><span><a href="#/">Museum</a> › ${esc(c.name)}</span><a href="#/gallery/${c.id}">✎ Edit gallery</a></div>
  <section class="hero" style="padding-top:4px"><h1>${c.icon} ${esc(c.name)}</h1>
    <div class="stats" style="align-items:center"><span><b>${all.length}</b>${all.length===1?"piece":"pieces"}</span>${priv?"":`<span><b>${esc(money(total)||"$0")}</b>estimated value</span>`}<span style="margin-left:auto">${sizer()}</span></div>
    <form class="search" id="sf"><input type="search" name="q" placeholder="Search ${esc(c.name.toLowerCase())}…" value="${esc(q)}" aria-label="Search">
      <select name="sort" aria-label="Sort">${[["title","Title"],["maker",c.maker||"Maker"],["year","Year"],["recent","Recently added"]].concat(priv?[]:[["value","Value"]]).map(([v,l])=>`<option value="${v}" ${v===sort?"selected":""}>Sort: ${esc(l)}</option>`).join("")}</select></form>
    ${tags.length ? `<div class="chips" style="margin-top:8px">${tags.map(t=>`<a class="chip ${t===tag?"on":""}" href="${link({tag:t===tag?"":t})}">${esc(t)}</a>`).join("")}</div>` : ""}
  </section>
  ${list.length ? `<div class="grid">${list.map(plate).join("")}</div>` : `<div class="empty">${all.length ? "Nothing matches." : "This gallery is empty. Add the first piece!"}</div>`}
  <div class="fabs"><a class="fab ghost" href="#/new?scan=1&c=${id}">▦ Scan</a><a class="fab" href="#/new?c=${id}">＋ Add</a></div>`;

  f.sort.onchange = () => { LS.set("cm.sort."+id, f.sort.value); location.hash = link({sort:f.sort.value, q:new FormData(f).get("q").trim()}); };

function viewItem(id){
  const it = item(id); if(!it) return notFound();
  const c = coll(it.collectionId);
  document.title = it.title + " · " + (cat.title||"The Collection");
  const photos = (it.media||[]).filter(m => m.kind === "photo"), docs = (it.media||[]).filter(m => m.kind !== "photo");
  const hidden = `<span class="hidden-val" title="Hidden in private mode">••••</span>`;
  const facts = [];
  const add = (l, v, isPriv) => { if(v !== "" && v != null) facts.push([l, isPriv && priv ? hidden : esc(v)]); };
  add(c.maker || "Maker", it.maker); add("Year", it.year);
  c.fields.forEach(f => add(f.l, (it.fields||{})[f.k], f.priv));
  add("Condition", it.condition); add("Barcode", it.barcode); add("Location", it.location);
  add("Acquired", [it.acquiredDate, it.source].filter(Boolean).join(" · "));
  if(it.price) facts.push(["Price paid", priv ? hidden : esc(money(it.price))]);
  if(it.value) facts.push(["Estimated value", priv ? hidden : esc(money(it.value))]);
  (it.extra||[]).forEach(x => add(x.l, x.v));
  app.innerHTML = `<div class="crumbs"><a href="#/">Museum</a> › <a href="#/c/${c.id}">${esc(c.name)}</a></div>
  <article class="item">
    <div class="viewer">${photos.length ? `<div class="frame"><div class="matte" id="hero"><img id="heroImg" alt="${esc(it.title)}" data-path="${esc(photos[0].path)}"></div></div>
      ${photos.length > 1 ? `<div class="thumbs">${photos.map((p,n)=>`<button data-n="${n}" class="${n?"":"on"}" aria-label="Photo ${n+1}"><img alt="" data-path="${esc(p.thumb||p.path)}"></button>`).join("")}</div>` : ""}`
      : `<div class="frame"><div class="matte" style="aspect-ratio:4/3"><div class="placeholder"><div class="em" style="font-size:4rem">${c.icon}</div><div>No photos yet</div></div></div></div>`}
    </div>
    <div>
      <h1>${it.favorite?'<span class="star">★</span> ':""}${esc(it.title)}</h1>
      <div class="by">${esc([it.maker, it.year].filter(Boolean).join(", "))}</div>
      <dl class="facts">${facts.map(([l,v])=>`<dt>${esc(l)}</dt><dd>${v}</dd>`).join("")}</dl>
      ${(it.tags||[]).length ? `<div class="chips" style="margin-top:14px">${it.tags.map(t=>`<a class="chip" href="#/c/${c.id}?tag=${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div>` : ""}
      ${it.notes ? `<div class="notes">${esc(it.notes)}</div>` : ""}
      ${docs.length ? `<h3 style="margin-top:20px;font-size:1.05rem">Documents</h3><div class="docs">${docs.map(d=>`<button class="doc" data-path="${esc(d.path)}" data-name="${esc(d.name||"")}"><span class="ic">${/pdf$/i.test(d.name||"")?"📄":"📜"}</span><span class="grow"><b>${esc(d.label||"Document")}</b><br><small style="color:var(--muted)">${esc(d.name||"")}</small></span><span>↗</span></button>`).join("")}</div>` : ""}
      <div class="actions noprint"><a class="iconbtn primary" href="#/edit/${it.id}">✎ Edit</a><button class="iconbtn" id="dupBtn">Duplicate</button><button class="iconbtn" id="delBtn" style="color:var(--danger)">Delete</button></div>
    </div>
  </article>`;
  hydrate(app);
  app.querySelectorAll(".thumbs button").forEach(b => b.onclick = async () => {
    app.querySelectorAll(".thumbs button").forEach(x=>x.classList.toggle("on", x===b));
    const p = photos[+b.dataset.n], img = document.getElementById("heroImg");
    img.dataset.path = p.path; const u = await store.url(p.path); if(u) img.src = u;
  });
  const hero = document.getElementById("hero"); if(hero) hero.onclick = () => lightbox(document.getElementById("heroImg").src);
  app.querySelectorAll(".doc").forEach(b => b.onclick = () => openDoc(b.dataset.path, b.dataset.name));
  document.getElementById("delBtn").onclick = async () => {
    if(!confirm(`Delete “${it.title}” and its photos and documents? This can't be undone.`)) return;
    const done = busy("Deleting…");
    try{
      cat.items = cat.items.filter(x => x.id !== it.id); await persist();
      for(const m of it.media||[]){ await store.deleteFile(m.path).catch(()=>{}); if(m.thumb) await store.deleteFile(m.thumb).catch(()=>{}); }
      location.hash = "#/c/" + c.id;
    }catch(e){ cat.items.push(it); alert(e.message); } finally{ done(); }
  };
  document.getElementById("dupBtn").onclick = () => { location.hash = "#/new?from=" + it.id; };
}

async function openDoc(path, name){
  const w = store.kind === "local" ? null : window.open("", "_blank");
  const u = await store.url(path);
  if(!u){ w && w.close(); return toast("Couldn't open that document."); }
  if(w) w.location = u;
  else if(/\.pdf$/i.test(name||"")) window.open(u, "_blank");
  else lightbox(u);
}

function lightbox(src){
  if(!src) return;
  const L = document.getElementById("layer");
  L.innerHTML = `<div class="lightbox" id="lb"><button class="iconbtn x" aria-label="Close">✕</button><img src="${esc(src)}" alt=""></div>`;
  const lb = document.getElementById("lb"), img = lb.querySelector("img");
  img.onclick = e => { e.stopPropagation(); img.classList.toggle("zoom"); };
  lb.querySelector(".x").onclick = () => L.innerHTML = "";
  lb.onclick = e => { if(e.target === lb) L.innerHTML = ""; };
  document.addEventListener("keydown", function k(e){ if(e.key==="Escape"){ L.innerHTML=""; document.removeEventListener("keydown",k);} });
}

/* ---------- Image processing ---------- */
async function shrink(file, max, quality){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch{ bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, s = Math.min(1, max / Math.max(w,h));
  const cv = document.createElement("canvas"); cv.width = Math.round(w*s); cv.height = Math.round(h*s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, "image/jpeg", quality));

let zxingLoad;
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  return zxingLoad = zxingLoad || new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="vendor/zxing.min.js"; s.onload=res; s.onerror=()=>{ zxingLoad=null; rej(new Error("Couldn't load the scanner.")); }; document.head.appendChild(s); });
}
function scanBarcode(onCode){
  const L = document.getElementById("layer");
  L.innerHTML = `<div class="scanner" id="sc"><video playsinline muted autoplay></video><div class="aim"></div>
    <div class="bar"><div class="msg" id="scMsg">Starting camera…</div>
    <form id="scForm"><input name="code" inputmode="numeric" placeholder="Or type the number under the barcode"><button class="iconbtn primary" type="submit">Look up</button></form>
    <button class="iconbtn" id="scClose" type="button" style="background:#222;color:#fff;border-color:#444">Cancel</button></div></div>`;
  const video = L.querySelector("video"), msg = document.getElementById("scMsg");
  let finished = false;
  const stop = () => { finished = true; const st = video.srcObject; if(st) st.getTracks().forEach(t=>t.stop()); L.innerHTML = ""; };
  const finish = code => { if(finished) return; stop(); onCode(code); };
  document.getElementById("scClose").onclick = stop;
  document.getElementById("scForm").onsubmit = e => { e.preventDefault(); const v = new FormData(e.target).get("code").trim(); if(v) finish(v); };
  (async () => {
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("This browser can't use the camera here.");
      await loadZXing();
      if(finished) return;
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}});
      if(finished){ stream.getTracks().forEach(t=>t.stop()); return; }
      video.srcObject = stream; await video.play().catch(()=>{});
      const F = ZXing.BarcodeFormat, hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const zx = new ZXing.MultiFormatReader(); zx.setHints(hints);
      let native = null;
      try{ if("BarcodeDetector" in window) native = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]}); }catch{}
      const cv = document.createElement("canvas"), ctx = cv.getContext("2d", {willReadFrequently:true});
      const tick = async () => {
        if(finished) return;
        if(video.readyState >= 2 && video.videoWidth){
          const s = Math.min(1, 1280 / video.videoWidth);
          cv.width = Math.round(video.videoWidth * s); cv.height = Math.round(video.videoHeight * s);
          ctx.drawImage(video, 0, 0, cv.width, cv.height);
          try{
            if(native){ const r = await native.detect(cv); if(r.length) return finish(r[0].rawValue); }
            const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
            const r = zx.decode(bmp); if(r) return finish(r.getText());
          }catch(e){ /* not found in this frame */ }
        }
        setTimeout(tick, 200);
      };
      tick();
      if(!finished) msg.textContent = "Point the camera at the barcode and hold steady.";
    }catch(e){
      if(finished) return;
      msg.textContent = (e && e.name === "NotAllowedError") ? "Camera permission was blocked. Allow camera access for this site, or type the number below." : (e.message || "Camera unavailable.") + " You can type the number below.";
    }
  })();
}

function isISBN(code){ return /^97[89]\d{10}$/.test(code) || /^\d{9}[\dX]$/i.test(code); }
async function lookupBarcode(code){
  const tries = [];
  if(isISBN(code)) tries.push(lookupOpenLibrary);
  const tok = (cat.settings||{}).discogsToken;
  if(tok) tries.push(c => lookupDiscogs(c, tok));
  tries.push(lookupMusicBrainz);
  if(!isISBN(code)) tries.push(lookupOpenLibrary);

}
const FILM_TYPES = new Set(["Q11424","Q24869","Q506240","Q202866","Q24862","Q17123180","Q226730","Q5398426","Q21191270","Q29168811","Q20650540","Q1259759"]);
function cleanTitle(t){
  return String(t||"").replace(/\[[^\]]*\]|\([^)]*\)/g," ")
    .replace(/\b(laser ?discs?|ld|dvd|blu-?ray|4k|uhd|vhs|widescreen|letterbox(ed)?|full ?screen|special edition|collector'?s edition|director'?s cut|unrated|remastered|\d+(th)? anniversary edition|deluxe edition|cav|clv|extended play|ntsc|pal|digitally mastered|thx|the criterion collection|criterion)\b/gi," ")
    .replace(/\s+[-–:|]\s*$/,"").replace(/\s{2,}/g," ").trim().replace(/^[-–:|\s]+|[-–:|\s]+$/g,"");
}
async function wdEntities(ids, props){
  if(!ids.length) return {};
  const j = await getJSON("https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&languages=en&props=" + props + "&ids=" + ids.slice(0,50).join("|"));
  return j.entities || {};
}
async function lookupFilm(rawTitle, yearHint){
  const title = cleanTitle(rawTitle); if(!title) return null;
  const r = await lookupFilmExact(title, yearHint);
  if(r) return r;
  const short = title.split(/\s[-–:|]\s|:\s/)[0].trim();
  return short && short !== title ? lookupFilmExact(short, yearHint) : null;
}
async function lookupFilmExact(title, yearHint){
  const s = await getJSON("https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&language=en&type=item&limit=12&search=" + encodeURIComponent(title));
  const ids = (s.search||[]).map(x=>x.id); if(!ids.length) return null;
  const ents = await wdEntities(ids, "claims|labels");
  const val = (en,p) => (en.claims[p]||[]).map(c => c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value).filter(Boolean);
  const year = en => { const t = val(en,"P577")[0]; return t && t.time ? t.time.slice(1,5) : ""; };
  let films = ids.map(id=>ents[id]).filter(en => en && en.claims && val(en,"P31").some(v => FILM_TYPES.has(v.id)));
  if(yearHint) films.sort((a,b) => (year(b)===String(yearHint)) - (year(a)===String(yearHint)));
  const film = films[0]; if(!film) return null;
  const qids = p => val(film,p).map(v=>v.id).filter(Boolean);
  const directors = qids("P57"), cast = qids("P161").slice(0,5), studios = qids("P272").slice(0,2);
  const names = await wdEntities([...new Set([...directors, ...cast, ...studios])], "labels");
  const nm = list => list.map(id => names[id] && names[id].labels.en && names[id].labels.en.value).filter(Boolean).join(", ");
  const dur = val(film,"P2047")[0];
  return {source:"Wikidata", title:(film.labels.en||{}).value || title, maker:nm(directors), year:year(film),
    fields:{runtime: dur ? Math.round(+dur.amount) + " min" : "", cast:nm(cast), studio:nm(studios)}};
}
async function lookupByTitle(collectionId, title, maker){
  if(collectionId === "laserdiscs" || collectionId === "movies") return lookupFilm(title);
  if(collectionId === "books"){
    const j = await getJSON("https://openlibrary.org/search.json?limit=1&fields=title,subtitle,author_name,first_publish_year,publisher,isbn,cover_i&title=" + encodeURIComponent(title) + (maker ? "&author=" + encodeURIComponent(maker) : ""));
    const b = (j.docs||[])[0]; if(!b) return null;
    return {source:"Open Library", title:[b.title, b.subtitle].filter(Boolean).join(": "), maker:(b.author_name||[]).join(", "), year:b.first_publish_year ? String(b.first_publish_year) : "",
      cover:b.cover_i ? "https://covers.openlibrary.org/b/id/" + b.cover_i + "-L.jpg" : "", fields:{publisher:(b.publisher||[])[0]||""}};
  }
  if(collectionId === "records"){
    const q = 'release:"' + title.replace(/"/g,"") + '"' + (maker ? ' AND artist:"' + maker.replace(/"/g,"") + '"' : "") + " AND format:vinyl";
    const j = await getJSON("https://musicbrainz.org/ws/2/release/?fmt=json&limit=5&query=" + encodeURIComponent(q));
    const r = (j.releases||[])[0]; if(!r) return null;
    const li = (r["label-info"]||[])[0] || {}, fm = formatFrom((r.media||[]).map(m=>m.format||""));
    return {source:"MusicBrainz", title:r.title, maker:(r["artist-credit"]||[]).map(a=>(a.name||"") + (a.joinphrase||"")).join(""), year:(r.date||"").slice(0,4),
      cover:"https://coverartarchive.org/release/" + r.id + "/front-500", fields:{label:(li.label||{}).name||"", catno:li["catalog-number"]||"", format:fm.format||"", pressing:r.country||""}};
  }
  return null;
}
async function enrichFilm(r){
  const t = (r.title||"").toLowerCase();
  const filmy = r.collectionId === "laserdiscs" || r.collectionId === "movies" || /laser ?disc|dvd|blu-?ray|vhs|widescreen/.test(t + " " + (r.category||""));
  if(!filmy) return r;
  if(!r.collectionId) r.collectionId = /laser ?disc/.test(t) ? "laserdiscs" : "movies";
  if(r.source === "MusicBrainz" || r.source === "Discogs") return r; // music laserdiscs: keep music data
  try{
    const f = await lookupFilm(r.title);
    if(f){ r = {...r, title:f.title, maker:f.maker || r.maker, year:f.year || r.year, source:r.source + " + " + f.source, fields:{...(r.fields||{}), ...Object.fromEntries(Object.entries(f.fields).filter(([,v])=>v))}}; }
  }catch(e){ console.warn(e.message); }
  return r;
}
async function lookupOpenLibrary(code){
  if(!isISBN(code)) return null;
  const j = await getJSON("https://openlibrary.org/api/books?bibkeys=ISBN:" + code + "&format=json&jscmd=data");
  const b = j["ISBN:" + code]; if(!b) return null;
  return {source:"Open Library", collectionId:"books", title:[b.title, b.subtitle].filter(Boolean).join(": "), maker:(b.authors||[]).map(a=>a.name).join(", "),
    year:((b.publish_date||"").match(/\d{4}/)||[""])[0], cover:b.cover && (b.cover.large || b.cover.medium),
    fields:{publisher:(b.publishers||[]).map(p=>p.name).join(", "), isbn:code}};
}
function formatFrom(fmts){
  const f = fmts.join(" ").toLowerCase();
  if(/laser ?disc/.test(f)) return {collectionId:"laserdiscs"};
  if(/vinyl|lp|7"|12"|10"|45 rpm|78 rpm/.test(f)) return {collectionId:"records", format:/7"|45 rpm/.test(f) ? '7" single' : /78 rpm/.test(f) ? "78" : /\bep\b/.test(f) ? "EP" : /box/.test(f) ? "Box set" : "LP"};
  return {};
}
async function lookupDiscogs(code, tok){
  const j = await getJSON("https://api.discogs.com/database/search?type=release&per_page=10&barcode=" + encodeURIComponent(code) + "&token=" + encodeURIComponent(tok));
  const list = j.results || []; if(!list.length) return null;
  const r = list.find(x => /vinyl|laserdisc/i.test((x.format||[]).join(" "))) || list[0];
  const [artist, ...rest] = (r.title||"").split(" - ");

  return {source:"Discogs", collectionId:fm.collectionId, title:rest.length ? rest.join(" - ") : r.title, maker:rest.length ? artist.replace(/\s*\(\d+\)$/,"") : "",
    year:r.year||"", cover:r.cover_image && !/spacer\.gif/.test(r.cover_image) ? r.cover_image : "",
    fields:{label:(r.label||[])[0]||"", catno:r.catno && r.catno!=="none" ? r.catno : "", format:fm.format||"", pressing:r.country||""}};
}
async function lookupMusicBrainz(code){
  const alt = code.length === 13 && code[0] === "0" ? code.slice(1) : code.length === 12 ? "0" + code : null;
  const q = "barcode:" + code + (alt ? " OR barcode:" + alt : "");
  const j = await getJSON("https://musicbrainz.org/ws/2/release/?fmt=json&limit=10&query=" + encodeURIComponent(q));
  const list = j.releases || []; if(!list.length) return null;
  const fmts = r => (r.media||[]).map(m=>m.format||"");
  const r = list.find(x => /vinyl|laserdisc/i.test(fmts(x).join(" "))) || list[0];
  const fm = formatFrom(fmts(r)), li = (r["label-info"]||[])[0] || {};
  return {source:"MusicBrainz", collectionId:fm.collectionId, title:r.title, maker:(r["artist-credit"]||[]).map(a=>(a.name||"") + (a.joinphrase||"")).join(""),
    year:(r.date||"").slice(0,4), cover:"https://coverartarchive.org/release/" + r.id + "/front-500",
    fields:{label:(li.label||{}).name||"", catno:li["catalog-number"]||"", format:fm.format||"", pressing:r.country||""}};
}
async function lookupUPCItemDB(code){

    if(found.dupe){ box.innerHTML = `<div class="found" style="border-color:#c8962c"><span style="font-size:1.6rem">⚠️</span><div class="grow"><b>You already have this barcode</b><br><a href="#/i/${found.dupe.id}">${esc(found.dupe.title)}</a></div></div>`; }
    else box.innerHTML = "";
    if(found.title) box.innerHTML += `<div class="found">${found.cover ? `<img src="${esc(found.cover)}" alt="">` : ""}<div class="grow"><b>${esc(found.title)}</b><br><small style="color:var(--muted)">${esc([found.maker, found.year].filter(Boolean).join(" · "))}${found.source ? " · from " + esc(found.source) : ""}</small></div></div>`;
    else if(found.miss) box.innerHTML += `<div class="found" style="border-color:var(--line)"><span style="font-size:1.4rem">🔍</span><div class="grow">No match for <b>${esc(found.code)}</b>. The barcode is saved; fill in the rest by hand.</div></div>`;
  }

  async function lookupInto(code){
    code = String(code).replace(/\D/g, "") || String(code).trim();
    it.barcode = code;
    const dupe = cat.items.find(x => x.id !== it.id && x.barcode && sameCode(x.barcode, code));
    const done = busy("Looking up " + code + "…");
    let r = null;
    try{ r = await lookupBarcode(code); }catch(e){ console.warn(e); }
    finally{ done(); }
    found = {code, dupe, miss:!r, ...(r||{})};
    if(r) await applyResult(r, true);
    if(navigator.vibrate) navigator.vibrate(60);
    render();
  }

  async function lookupTitle(){
    collect();
    if(!it.title) return toast("Type a title first.");
    const done = busy("Looking up “" + it.title + "”…");
    let r = null;
    try{ r = await lookupByTitle(it.collectionId, it.title, it.maker); }catch(e){ console.warn(e); }
    finally{ done(); }
    if(!r){ found = null; render(); return toast("No match found. Try a shorter title, or add the artist/director."); }
    found = {...r};
    await applyResult(r, false);
    render();
  }

  async function applyResult(r, overwrite){
      if(r.collectionId && !existing && overwrite && cat.collections.some(c=>c.id===r.collectionId)) it.collectionId = r.collectionId;
      ["title","maker","year"].forEach(k => { if(r[k] && (overwrite || !it[k])) it[k] = r[k]; });
      it.fields = it.fields || {};
      Object.entries(r.fields||{}).forEach(([k,v]) => { if(v && (overwrite || !it.fields[k]) && coll(it.collectionId).fields.some(f=>f.k===k)) it.fields[k] = v; });
      it.extra = it.extra || [];
      (r.extra||[]).forEach(x => { if(x.v && !it.extra.some(e=>e.l.toLowerCase()===x.l.toLowerCase())) it.extra.push(x); });
      if(r.cover && !it.media.some(m=>m.kind==="photo")){
        try{
          const blob = await (await fetch(r.cover)).blob();
          if(/^image\//.test(blob.type)) await addFiles([new File([blob], "cover.jpg", {type:blob.type})], "photo", true);
          else found.cover = "";
        }catch(e){ console.warn("cover fetch failed", e); found.cover = ""; }
      }
  }

  function collect(){
    const f = document.getElementById("ef"), d = new FormData(f), c = coll(it.collectionId);
    ["title","maker","year","barcode","condition","location","acquiredDate","source","notes"].forEach(k => it[k] = (d.get(k)||"").trim());
    ["price","value"].forEach(k => { const v = (d.get(k)||"").replace(/[$,\s]/g,""); it[k] = v === "" ? "" : (isNaN(+v) ? v : +v); });
    it.tags = (d.get("tags")||"").split(",").map(s=>s.trim()).filter(Boolean);
    it.favorite = d.get("favorite") === "on";
    it.fields = it.fields || {};
    c.fields.forEach(x => { const v = (d.get("x_"+x.k)||"").trim(); if(v) it.fields[x.k] = v; else delete it.fields[x.k]; });
    it.extra = [...document.querySelectorAll("#extras .xrow")].map(r => ({l:r.querySelector("[data-xl]").value.trim(), v:r.querySelector("[data-xv]").value.trim()})).filter(x => x.l || x.v);
    document.querySelectorAll("#media [data-label]").forEach(inp => { const m = it.media.find(m=>m.id===inp.dataset.label); if(m) m.label = inp.value.trim(); });
  }

  function renderMedia(){
    const el = document.getElementById("media");
    el.innerHTML = it.media.map((m,n) => {
      const p = pending.find(p => p.m === m);
      const im = m.kind === "photo" ? (p ? `<img src="${p.previewUrl}" alt="">` : `<img alt="" data-path="${esc(m.thumb||m.path)}">`) : (/pdf$/i.test(m.name||"") ? "📄" : "📜");
      return `<div class="mtile"><div class="im">${im}</div><div class="row">
        ${m.kind === "photo" ? `<span style="flex:1;color:var(--muted)">${n===it.media.findIndex(x=>x.kind==="photo")?"Cover":"Photo"}</span><button type="button" data-cover="${m.id}" title="Make cover">⤒</button>`
          : `<input data-label="${m.id}" value="${esc(m.label||"")}" placeholder="COA, receipt…">`}
        <button type="button" data-rm="${m.id}" title="Remove">✕</button></div></div>`;
    }).join("");
    el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { collect(); const i = it.media.findIndex(m=>m.id===b.dataset.rm); const [m] = it.media.splice(i,1);
      const pi = pending.findIndex(p=>p.m===m); if(pi>=0) pending.splice(pi,1); else removed.push(m); renderMedia(); });
    el.querySelectorAll("[data-cover]").forEach(b => b.onclick = () => { collect(); const i = it.media.findIndex(m=>m.id===b.dataset.cover); const [m] = it.media.splice(i,1); it.media.unshift(m); renderMedia(); });
    hydrate(el);
  }

  async function addFiles(files, kind, noCollect){
    if(!noCollect) collect();
    const done = busy("Preparing " + files.length + " file" + (files.length>1?"s":"") + "…");
    try{
      for(const file of files){
        const mid = uid(), isImg = /^image\//.test(file.type);
        const base = "media/" + it.id + "/" + mid;
        if(kind === "photo"){
          if(!isImg) continue;
          const full = await shrink(file, 2400, .88), th = await shrink(file, 520, .8);
          const m = {id:mid, kind:"photo", name:safeName(file.name), path:base + ".jpg", thumb:base + "_t.jpg"};
          it.media.push(m); pending.push({m, blob:full, thumbBlob:th, previewUrl:URL.createObjectURL(th)});
        }else{
          const ext = (file.name.match(/\.\w+$/)||[isImg?".jpg":".pdf"])[0].toLowerCase();
          const m = {id:mid, kind:"document", name:safeName(file.name), path:base + ext, label:/coa|cert|authent/i.test(file.name) ? "Certificate of authenticity" : ""};
          it.media.push(m); pending.push({m, blob:file});
        }
      }
    }catch(e){ alert("Couldn't read one of those files: " + e.message); }
    finally{ done(); if(document.getElementById("media")) renderMedia(); }
  }

  async function save(){
    if(!it.title) return toast("Please add a title.");
    const done = busy(pending.length ? "Uploading " + pending.length + " file" + (pending.length>1?"s":"") + "…" : "Saving…");
    try{
      for(const p of pending){ await store.putFile(p.m.path, p.blob); if(p.thumbBlob) await store.putFile(p.m.thumb, p.thumbBlob); }
      it.updated = new Date().toISOString(); it.created = it.created || it.updated;
      const idx = cat.items.findIndex(x => x.id === it.id);
      const before = idx >= 0 ? cat.items[idx] : null;
      if(idx >= 0) cat.items[idx] = it; else cat.items.push(it);
      try{ await persist(); }catch(e){ if(before) cat.items[idx] = before; else cat.items.pop(); throw e; }
      for(const m of removed){ store.deleteFile(m.path).catch(()=>{}); if(m.thumb) store.deleteFile(m.thumb).catch(()=>{}); }
      pending.length = 0;
      toast("Saved");
      location.hash = "#/i/" + it.id;
    }catch(e){ alert(e.message); } finally{ done(); }
  }
  render();
  if(params.get("scan") && !existing) setTimeout(() => document.getElementById("scanTop")?.click(), 50);
}

function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exportCSV(){
  const fieldCols = []; cat.collections.forEach(c => c.fields.forEach(f => { if(!fieldCols.some(x=>x.l===f.l)) fieldCols.push(f); }));
  const head = ["Gallery","Title","Maker","Year","Barcode","Condition","Location","Acquired","Source","Price paid","Estimated value","Tags","Notes","More details", ...fieldCols.map(f=>f.l), "Photos","Documents"];
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const rows = sortItems(cat.items,"title").map(i => { const c = coll(i.collectionId);
    return [c.name, i.title, i.maker, i.year, i.barcode, i.condition, i.location, i.acquiredDate, i.source, i.price, i.value, (i.tags||[]).join("; "), i.notes, (i.extra||[]).map(x=>x.l + ": " + x.v).join("; "),
      ...fieldCols.map(fc => { const f = c.fields.find(x=>x.l===fc.l); return f ? (i.fields||{})[f.k] : ""; }),
      (i.media||[]).filter(m=>m.kind==="photo").length, (i.media||[]).filter(m=>m.kind!=="photo").map(m=>m.label||m.name).join("; ")]; });
  download(new Blob(["﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n")], {type:"text/csv"}), "collection-" + new Date().toISOString().slice(0,10) + ".csv");
}

    <fieldset><legend>Name</legend><div class="fgrid">
      <div class="f"><label for="gname">Gallery name</label><input id="gname" required value="${esc(g.name)}"></div>
      <div class="f"><label for="gicon">Emoji</label><input id="gicon" value="${esc(g.icon)}" maxlength="8"></div>
      <div class="f"><label for="gmaker">What to call the maker</label><input id="gmaker" value="${esc(g.maker||"")}" placeholder="Artist, Author, Brand…"></div>
    </div></fieldset>
    <fieldset><legend>Fields</legend>
      <p style="color:var(--muted);font-size:.82rem;margin:0 0 10px">Rename fields freely; your entries stay attached. 🔒 hides a field when values are hidden. Removing a field moves anything you'd entered into that piece's “More details”, so nothing is lost.</p>
      <div id="frows" style="display:grid;gap:8px">${g.fields.map(fieldRow).join("")}</div>
      <div class="actions" style="margin-top:10px"><button type="button" class="iconbtn" id="addF">＋ Add a field</button></div>
    </fieldset>
    <div class="actions"><button class="iconbtn primary" type="submit" style="height:44px;padding:0 22px">Save</button><a class="iconbtn" href="#/c/${id}" style="height:44px">Cancel</a>
      <span style="flex:1"></span>${n ? `<span style="color:var(--muted);font-size:.85rem;align-self:center">Move or delete its ${n} piece${n===1?"":"s"} to delete this gallery</span>` : `<button type="button" class="iconbtn" id="delG" style="height:44px;color:var(--danger)">Delete gallery</button>`}</div>
  </form>`;
  const wire = () => app.querySelectorAll("[data-frm]").forEach(b => b.onclick = () => {
    const row = b.closest(".frow"), k = row.dataset.k, u = k ? used(k) : 0;
    if(u && !confirm(`${u} piece${u===1?" has":"s have"} this field filled in. Remove it? Those entries will move to “More details”.`)) return;
    row.remove(); });
  wire();
  document.getElementById("addF").onclick = () => { document.getElementById("frows").insertAdjacentHTML("beforeend", fieldRow({l:""})); wire(); document.querySelector("#frows .frow:last-child [data-fl]").focus(); };
  if(document.getElementById("delG")) document.getElementById("delG").onclick = async () => {
    if(!confirm(`Delete the empty “${g.name}” gallery?`)) return;
    cat.collections = cat.collections.filter(c => c.id !== id);
    try{ await persist(); location.hash = "#/settings"; }catch(e){ cat.collections.push(orig); alert(e.message); }
  };
  document.getElementById("gf").onsubmit = async e => {
    e.preventDefault();
    const fields = [...app.querySelectorAll("#frows .frow")].map(r => ({k:r.dataset.k || "f_" + uid().slice(-6), l:r.querySelector("[data-fl]").value.trim(), priv:r.querySelector("[data-fp]").checked}))
      .filter(f => f.l).map(f => { const o = orig.fields.find(x => x.k === f.k); return {...(o||{}), ...f, priv:f.priv || undefined}; });
    const removed = orig.fields.filter(f => !fields.some(x => x.k === f.k));
    const backup = JSON.stringify({c:orig, items:cat.items.filter(i=>i.collectionId===id)});
    removed.forEach(f => cat.items.forEach(i => { if(i.collectionId === id && i.fields && i.fields[f.k]){ i.extra = i.extra || []; i.extra.push({l:f.l, v:i.fields[f.k]}); delete i.fields[f.k]; } }));
    Object.assign(orig, {name:document.getElementById("gname").value.trim() || g.name, icon:document.getElementById("gicon").value.trim() || "📦", maker:document.getElementById("gmaker").value.trim() || "Maker", fields});
    try{ await persist(); toast("Gallery saved"); location.hash = "#/c/" + id; }
    catch(er){ const b = JSON.parse(backup); Object.assign(orig, b.c); b.items.forEach(bi => { const ix = cat.items.findIndex(i=>i.id===bi.id); if(ix>=0) cat.items[ix] = bi; }); alert(er.message); }
  };
}

function notFound(){ app.innerHTML = `<div class="empty">That piece isn't here. <a href="#/">Back to the museum</a></div>`; }
function setBrand(){ document.getElementById("brand").firstChild.textContent = cat.title || "The Collection"; }

/* ---------- Samples ---------- */
async function loadSamples(){
  const now = Date.now(), t = n => new Date(now - n*864e5).toISOString();
  const s = [
    {collectionId:"records", title:"Rumours", maker:"Fleetwood Mac", year:"1977", fields:{format:"LP", label:"Warner Bros.", catno:"BSK 3010", mediaGrade:"VG+", sleeveGrade:"VG"}, condition:"Very Good", location:"Shelf A3", tags:["70s","first pressing"], price:18, value:45, favorite:true},
    {collectionId:"laserdiscs", title:"Blade Runner (Director's Cut)", maker:"Warner Home Video", year:"1993", fields:{format:"CLV", sides:"2", edition:"Widescreen"}, condition:"Excellent", location:"LD cabinet", tags:["sci-fi"], price:12, value:30},
    {collectionId:"cels", title:"Hand-painted production cel", maker:"Example Studio", year:"1988", fields:{celType:"Production cel + drawing", characters:"Lead character", seal:"Studio seal, lower right"}, condition:"Excellent", tags:["framed"], price:350, value:600, favorite:true, notes:"Sample entry: replace with your own cels."},
    {collectionId:"pennies", title:"Boardwalk lighthouse", maker:"Coastal set of 4", fields:{place:"Seaside boardwalk", coin:"Cent", coinYear:"1981", orientation:"Vertical", datePressed:"2015-07"}, condition:"Mint", tags:["beach trip"], price:0.51, value:1},
    {collectionId:"instruments", title:"Electric guitar", maker:"Example Guitars", year:"2004", fields:{model:"Standard", serial:"EX04-123456", finish:"Sunburst", case:"Hardshell"}, condition:"Excellent", location:"Music room", price:900, value:1100, notes:"Sample entry. Note how the serial number hides when values are hidden."},
    {collectionId:"autographs", title:"Signed concert poster", maker:"A Favorite Musician", year:"2012", fields:{signedItem:"11×17 tour poster", authenticator:"JSA", cert:"AB12345"}, condition:"Near Mint", price:120, value:200},
  ];
  s.forEach((x,n) => cat.items.push({id:uid(), tags:[], media:[], ...x, created:t(n), updated:t(n)}));
  await persist(); toast("Samples added");
}

/* ============================================================
   Router + boot
   ============================================================ */
function route(){
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?"), params = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  document.getElementById("layer").innerHTML = "";
  window.scrollTo(0, 0);
  if(!parts.length) return viewHome(params);
  if(parts[0]==="c") return viewHall(parts[1], params);
  if(parts[0]==="i") return viewItem(parts[1]);
  if(parts[0]==="new") return viewEdit(null, params);
  if(parts[0]==="edit") return viewEdit(parts[1], params);
  if(parts[0]==="settings") return viewSettings();
  if(parts[0]==="report") return viewReport();
  if(parts[0]==="gallery") return viewGallery(parts[1]);
  notFound();
}

async function boot(){
  setPriv(priv);
  app.innerHTML = `<div class="empty">Opening the museum…</div>`;
  let justConnected = false;
  try{ justConnected = await DropboxStore.finishAuth(); }catch(e){ alert(e.message); }
  if(LS.get("cm.justConnected", false)){ justConnected = true; LS.del("cm.justConnected"); }
  const dbx = LS.get("cm.dropbox", null);
  const local = new LocalStore();
  if(LS.get("cm.mode","local") === "dropbox" && dbx){
    store = new DropboxStore(dbx.appKey);
    try{
      cat = await store.load();
      if(!cat){
        // First connection: start fresh, or carry over what's on this device.
        const prev = await local.load().catch(()=>null);
        cat = newCatalog();
        if(justConnected && LS.get("cm.carry", true) && prev && prev.items.length){
          const done = busy("Copying " + prev.items.length + " pieces to Dropbox…");
          try{
            for(const it of prev.items) for(const m of it.media||[]){
              const b = await local.getBlob(m.path); if(b) await store.putFile(m.path, b);
              if(m.thumb){ const tb = await local.getBlob(m.thumb); if(tb) await store.putFile(m.thumb, tb); }
            }
            cat = prev;
          } finally { done(); }
        }
        await store.save(cat);
      }
      if(justConnected) toast("Connected to Dropbox");
    }catch(e){
      app.innerHTML = `<div class="panel"><h2>Couldn't reach Dropbox</h2><p>${esc(e.message)}</p><div class="actions"><button class="iconbtn primary" onclick="location.reload()">Try again</button><a class="iconbtn" href="#/settings" onclick="setTimeout(()=>location.reload())">Settings</a></div></div>`;
      if(!LS.get("cm.dropbox", null)) LS.set("cm.mode","local");
      return;
    }
  }else{
    store = local;
    cat = (await local.load().catch(()=>null)) || newCatalog();
  }
  // Make sure newer preset galleries/fields exist in older catalogs.
  cat.presetsSeen = cat.presetsSeen || ["records","laserdiscs","books","prints","autographs","cels","pennies","memorabilia","instruments","antiques"];
  PRESETS.forEach(p => { if(!cat.presetsSeen.includes(p.id)){ cat.presetsSeen.push(p.id); if(!cat.collections.some(x=>x.id===p.id)) cat.collections.push(JSON.parse(JSON.stringify(p))); } });
  // Add preset fields introduced in newer versions, but never re-add ones the user removed.
  PRESETS.forEach(p => { const c = cat.collections.find(x=>x.id===p.id); if(!c) return; c.seen = c.seen || c.fields.map(f=>f.k);
    p.fields.forEach(f => { if(!c.seen.includes(f.k)){ c.seen.push(f.k); if(!c.fields.some(x=>x.k===f.k)) c.fields.push(JSON.parse(JSON.stringify(f))); } }); });
  setBrand();
  window.addEventListener("hashchange", route);
  route();
}
boot();
</script>
