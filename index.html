<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Collection</title>
<meta name="description" content="A private museum for personal collections.">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Museum">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --ink:#1d1a16; --muted:#6f665b; --line:#e2d9c9;
  --accent:#8a2b1d; --accent-ink:#fff; --frame:#2a241d; --mat:#efe7d8; --chip:#ece4d4;
  --danger:#a1271b; --ok:#2f6b3a; --shadow:0 1px 2px rgba(40,30,20,.08),0 6px 20px rgba(40,30,20,.08);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15130f; --surface:#1f1c17; --ink:#f1ebe0; --muted:#a69c8e; --line:#38322a; --accent:#d9846f; --accent-ink:#1a1210;
    --frame:#0c0b09; --mat:#2a261f; --chip:#2e2922; --danger:#ef7d6e; --ok:#86c493; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:var(--serif);font-size:1.25rem;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-size:.9rem}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:20px 0 calc(120px + env(safe-area-inset-bottom))}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.hero{padding:18px 0 22px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.hero p{color:var(--muted);margin:.4rem 0 0}
.search{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
.search select{flex:0 0 auto;max-width:48%}
.sbox{position:relative;flex:1;min-width:0;display:flex}
.sbox input{padding-right:40px}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox .sx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--chip);color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.sbox input:placeholder-shown + .sx{display:none}
@media (max-width:520px){#sf .sbox{flex-basis:100%} #sf select{flex:1 1 0;max-width:none}}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-top:8px}
.stats .homebtns{margin-left:auto;display:flex;gap:8px}
@media (max-width:560px){.stats .homebtns{flex-basis:100%;margin-left:0}.stats .homebtns a{flex:1;justify-content:center}}
.stats b{color:var(--ink);font-family:var(--serif);font-size:1.1rem;font-weight:600;margin-right:4px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;gap:10px}
.section-title h2{font-size:1.35rem}
.section-title span{color:var(--muted);font-size:.85rem}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.hall{position:relative;display:block;text-decoration:none;border-radius:14px;overflow:hidden;background:var(--frame);aspect-ratio:4/3;box-shadow:var(--shadow)}
.hall img{width:100%;height:100%;object-fit:cover;opacity:.72;transition:transform .5s,opacity .3s}
.hall:hover img{transform:scale(1.04);opacity:.6}
.hall .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4rem;opacity:.35}
.hall .label{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hall .label h3{font-size:1.3rem}
.hall .label span{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:block;text-decoration:none;min-width:0}
/* Quick edit: a pencil on hover (mouse only) opens a small editor without leaving the gallery */
.card{position:relative}
.card .qe{display:none}
@media (hover:hover) and (pointer:fine){
  .card .qe{display:flex;position:absolute;z-index:4;top:10px;right:10px;width:36px;height:36px;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);opacity:0;transform:scale(.9);transition:opacity .15s,transform .15s}
  .card:hover .qe,.card .qe:focus-visible{opacity:1;transform:none}
  .card .qe:hover{background:var(--ink);color:var(--bg)}}
#qe .fgrid{margin-top:6px}
#qe .qbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin:16px -16px -18px;padding:12px 16px 14px;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--surface);border-radius:0 0 16px 16px;border-top:1px solid var(--line)}
#layer:not(:empty) ~ #fsz,#edlayer:not(:empty) ~ #fsz{display:none}
#qe .qbar a{margin-right:auto;font-size:.88rem}
.frame{background:var(--frame);padding:7px;border-radius:4px;box-shadow:var(--shadow)}
.matte{background:var(--mat);padding:8px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.matte img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px;padding:8px}
.placeholder .em{font-size:2.4rem;opacity:.7}
.placeholder .t{font-family:var(--serif);font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plaque{padding:9px 2px 0}
.plaque .t{font-family:var(--serif);font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plaque .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#c8962c}
.halls.arranging .hall{touch-action:none;cursor:grab;outline:2px dashed var(--accent);outline-offset:3px;animation:wob .35s ease-in-out infinite alternate}
.halls.arranging .hall:nth-child(2n){animation-delay:.15s}
.halls.arranging .hall.dragging{opacity:.75;transform:scale(1.04);animation:none;z-index:2;cursor:grabbing}
@keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
@media (prefers-reduced-motion: reduce){.halls.arranging .hall{animation:none}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.savebar .wrap{display:flex;gap:8px;align-items:center}
form.edit{padding-bottom:84px}
/* compact view */
.sizer{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.sizer button{border:none;background:none;padding:5px 11px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.sizer button.on{background:var(--ink);color:var(--bg)}
@media (pointer:coarse){.sizer button{padding:8px 13px}} /* easier to tap on phones */
/* When the view buttons scroll out of sight, a copy floats just under the header */
#fsz{position:fixed;left:0;right:0;top:calc(64px + env(safe-area-inset-top));z-index:19;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
#fsz.on{opacity:1;transform:none}
#fsz .wrap{display:flex;justify-content:flex-end}
#fsz .sizer{pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#fsz:not(.on) .sizer{pointer-events:none}
#fsz .sizer button{padding:8px 14px;font-size:.85rem}
.dense .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.dense .frame{padding:3px;border-radius:3px}
.dense .matte{padding:3px}
.dense .plaque{padding-top:5px}
.dense .plaque .t{font-size:.78rem;-webkit-line-clamp:1}
.dense .plaque .s{font-size:.68rem}
.dense .placeholder .em{font-size:1.5rem}
.dense .placeholder .t{display:none}
.dense .halls,.listview .halls{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dense .hall,.listview .hall{aspect-ratio:16/9;border-radius:10px}
.dense .hall .label,.listview .hall .label{padding:8px 10px}
.dense .hall .label h3,.listview .hall .label h3{font-size:.95rem}
.dense .hall .label span,.listview .hall .label span{font-size:.62rem}
.dense .hall .ph,.listview .hall .ph{font-size:2.2rem}
@media (max-width:520px){
  .dense .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .dense .plaque .s{display:none}
  .dense .halls,.listview .halls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
/* list view */
.card .meta{display:none}
.listview .grid{display:flex;flex-direction:column;gap:0}
.listview .card{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.listview .card:hover{background:var(--surface)}
.listview .frame{flex:0 0 52px;padding:2px;border-radius:3px;box-shadow:none}
.listview .matte{padding:2px}
.listview .placeholder .t{display:none}
.listview .placeholder .em{font-size:1.3rem}
.listview .plaque{padding:0;flex:1;min-width:0}
.listview .plaque .t{-webkit-line-clamp:1;font-size:.95rem}
.listview .card .meta{display:block;flex:0 1 40%;min-width:0;text-align:right;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.listview .card .meta{flex-basis:34%}}
.grouphead{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink);scroll-margin-top:70px}
.groupbar{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}
.groupbar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:30px;height:28px;padding:0 6px;font-size:.78rem;cursor:pointer}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.filters label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;min-width:0}
.filters .check{flex-direction:row;font-size:.85rem;color:var(--ink);align-self:end;height:36px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* item */
.item{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:820px){.item{grid-template-columns:minmax(0,1fr);gap:18px}}
.viewer .frame{padding:10px}
.viewer .matte{aspect-ratio:auto;min-height:260px;max-height:70vh;padding:14px;cursor:zoom-in}
.viewer .matte img{max-height:calc(70vh - 28px)}
/* Arrows over the main photo when a piece has more than one */
.viewer .frame{position:relative}
.viewer #hero{touch-action:pan-y pinch-zoom}
.pnav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(20,17,14,.55);color:#f3ead9;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;opacity:0;transition:opacity .2s,background .2s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pnav:hover{background:rgba(20,17,14,.8)}
.pnav.prev{left:14px}.pnav.next{right:14px}
.frame:hover .pnav,.pnav:focus-visible{opacity:1}
.pcount{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(20,17,14,.6);color:#f3ead9;font:600 .74rem/1 var(--sans,system-ui);padding:5px 9px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s}
.frame:hover .pcount{opacity:1}
@media (hover:none){.pnav{opacity:.85;width:40px;height:40px}.pnav.prev{left:10px}.pnav.next{right:10px}.pcount{opacity:.9}}
@keyframes slideFromR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideFromL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.slidel{animation:slideFromR .22s ease-out}.slider{animation:slideFromL .22s ease-out}
@media (prefers-reduced-motion:reduce){.slidel,.slider{animation:none}}
.lbnav{position:fixed;top:50%;transform:translateY(-50%);z-index:2;width:48px;height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(30,26,22,.7);color:#f3ead9;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.lbnav.prev{left:12px}.lbnav.next{right:12px}
.lbcount{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:2;color:#f3ead9;font:600 .8rem/1 var(--sans,system-ui);background:rgba(30,26,22,.7);padding:6px 10px;border-radius:999px;pointer-events:none}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
.thumbs button{flex:0 0 64px;height:64px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:var(--mat);cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.crumbs a{text-decoration:none}
.item h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.15}
.item .by{color:var(--muted);margin:.35rem 0 1rem;font-size:1.02rem}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;border-top:1px solid var(--line);padding-top:14px}
dl.facts dt{color:var(--muted);font-size:.85rem;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.docs{display:grid;gap:8px;margin-top:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.doc .ic{font-size:1.3rem}
.doc .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:520px){.brand small{display:none} #privBtn .lbl{font-size:.85rem}}
.hidden-val{letter-spacing:.2em;color:var(--muted)}
/* forms */
form.edit{max-width:760px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.8rem;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;min-width:0;width:100%}
.f textarea{min-height:110px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 16px}
legend{font-family:var(--serif);font-weight:600;padding:0 6px}
.media-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.mtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:.78rem}
.mtile .im{aspect-ratio:1/1;background:var(--mat);display:flex;align-items:center;justify-content:center;font-size:2rem}
.mtile .im img{width:100%;height:100%;object-fit:cover}
.mtile .row{display:flex;gap:4px;padding:6px;align-items:center}
.mtile input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);font-size:.78rem}
.mtile{position:relative}.mtile .im{position:relative}.mtile .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:2px 8px;font-size:.72rem}
.mtile .row{gap:6px}
.mtile button{flex:1 1 0;min-width:40px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink,inherit);cursor:pointer;padding:0;font-size:1.25rem;display:inline-flex;align-items:center;justify-content:center}
.mtile button[data-rm]{color:#c0392b}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
/* overlay */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.96);display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox img.zoom{max-width:none;max-height:none;width:auto}
.lightbox .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2}
.scanner{position:fixed;inset:0;z-index:52;background:#000;display:flex;flex-direction:column;color:#fff}
.scanner video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.scanner .aim{position:absolute;left:8%;right:8%;top:calc(env(safe-area-inset-top) + 9%);height:20%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.scanner .bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;flex-direction:column;gap:10px}
.scanner .bar form{display:flex;gap:8px}
.scanner .bar input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;padding:0 12px}
.scanner .msg{font-size:.92rem;color:#ddd}
.found{border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.found img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:var(--mat)}
.found .grow{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.jobbar{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:54;max-width:min(440px,calc(100% - 150px));display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 6px 8px 12px;font-size:.85rem;overflow:hidden}

/* Pick for me */
.spin{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;color:#f3ead9}
.spin-h{font-family:var(--serif);font-size:1.3rem;text-align:center}

.reel{display:flex;gap:12px;padding:20px 0;will-change:transform}

.reelwin .mk{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-10px;border:10px solid transparent;border-top:14px solid #e9c46e;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}

.spin-out .pf{color:#a99f8f;font-size:.88rem;margin-top:4px}

/* Aquarium: caustic light, drifting shadows, light rays, kelp + coral reefs */
.wall.r-aquarium::before{display:none}
.fish .cz{position:absolute;inset:-30%;background:url(rooms/caustics2.png) 0 0/460px;mix-blend-mode:screen;opacity:.17;filter:blur(.6px);animation:cz1 38s linear infinite;will-change:transform}
.fish .cz.c2{background-size:330px;opacity:.12;animation:cz2 29s linear infinite}
@keyframes cz1{from{transform:translate(0,0) rotate(0)}50%{transform:translate(-230px,-60px) rotate(1.5deg) scale(1.03)}to{transform:translate(-460px,0) rotate(0)}}
@keyframes cz2{from{transform:translate(-330px,-330px)}50%{transform:translate(-160px,-190px) scale(1.04)}to{transform:translate(0,0)}}
.fish .shade{position:absolute;inset:-40%;background:radial-gradient(ellipse 18% 14% at 30% 40%,rgba(0,15,30,.45),transparent 70%),radial-gradient(ellipse 22% 12% at 70% 60%,rgba(0,15,30,.4),transparent 70%),radial-gradient(ellipse 14% 18% at 55% 25%,rgba(0,15,30,.35),transparent 70%),radial-gradient(ellipse 20% 16% at 15% 75%,rgba(0,15,30,.4),transparent 70%),radial-gradient(ellipse 16% 12% at 85% 30%,rgba(0,15,30,.35),transparent 70%);animation:shade 34s ease-in-out infinite alternate}
@keyframes shade{from{transform:translate(-8%,-3%) scale(1)}50%{transform:translate(5%,4%) scale(1.08)}to{transform:translate(9%,-4%) scale(.96)}}
.fish .rays{position:absolute;left:-20%;right:-20%;top:-10%;height:85%;background:repeating-linear-gradient(105deg,transparent 0 60px,rgba(190,240,255,.16) 90px,transparent 130px,transparent 210px,rgba(190,240,255,.11) 240px,transparent 300px);-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent);mix-blend-mode:screen;transform-origin:50% 0;animation:rays 14s ease-in-out infinite alternate}
@keyframes rays{from{transform:skewX(-4deg) translateX(-30px);opacity:.7}50%{opacity:1}to{transform:skewX(5deg) translateX(40px);opacity:.75}}
.reef{display:none}
.wall.r-aquarium .reef{display:block;position:absolute;z-index:0;left:-130px;width:260px;bottom:calc(11vh - 12px);height:44vh;pointer-events:none}
.wall.r-aquarium .reef.rr{display:none}
.wall.r-aquarium .bay:last-child .reef.rr{display:block;left:auto;right:-130px}
.reef::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56%;background:center bottom/contain no-repeat}

@keyframes sway{from{transform:rotate(-4deg) skewX(3deg)}to{transform:rotate(4deg) skewX(-4deg)}}
@media (max-width:899px){.wall.r-aquarium .reef{width:200px;left:-100px;height:34vh;bottom:calc(11vh - 10px)}.wall.r-aquarium .bay:last-child .reef.rr{right:-100px}.reef b{width:48px}}
@media (orientation:landscape) and (max-height:560px){.wall.r-aquarium .reef{height:48vh;bottom:calc(8vh - 8px)}}
.fish .cz,.fish .rays,.wall.r-aquarium::after{background-position-x:calc(var(--sx,0) * -1px)}
.fish .shade{background-size:1400px 100%;background-repeat:repeat-x;background-position-x:calc(var(--sx,0) * -1px)}
@media (prefers-reduced-motion:reduce){.fish .cz,.fish .shade,.fish .rays,.reef b{animation:none}}
/* Bottom sheets: grab handle, bigger close button, swipe down to dismiss */
.lightbox>.panel{position:relative;will-change:transform}
.lightbox>.panel::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--muted) 45%,transparent);margin:-6px auto 10px}
.lightbox>.panel [id$="X"][aria-label="Close"]{min-width:44px;height:44px;font-size:1.2rem}
/* On a computer, sheets pop up in the middle of the screen instead of hanging off the bottom; the search ones keep one steady size while results load */
@media (min-width:700px) and (min-height:520px){.lightbox[style*="flex-end"]{align-items:center!important;padding:4vh 24px}
  .lightbox[style*="flex-end"]>.panel{border-radius:16px!important;padding-bottom:18px!important;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:popIn .18s ease-out}
  .lightbox[style*="flex-end"]>.panel::before{display:none}
  #cc>.panel,#pk>.panel{height:min(700px,86vh)}}
/* Cover poster builder */
#po>.panel{width:100%;max-width:1100px;margin:0;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:94vh;display:flex;flex-direction:column}
#po .pobody{display:grid;gap:14px;min-height:0;flex:1;overflow:auto}
#po .poview{position:relative;height:36vh;min-height:200px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(color-mix(in srgb,var(--muted) 12%,transparent) 0 25%,transparent 0 50%) 0 0/18px 18px;border-radius:10px;overflow:hidden}
#po canvas{display:block;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#po #poMsg{position:absolute;bottom:8px;left:50%;translate:-50% 0;background:rgba(0,0,0,.65);color:#fff;font-size:.78rem;padding:3px 10px;border-radius:999px;white-space:nowrap}
#po #poMsg:empty{display:none}
#po .porow{display:grid;gap:5px;margin-bottom:10px}
#po .porow>span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#po .porow>div{display:flex;flex-wrap:wrap;gap:6px}
#po .chip{font-size:.85rem;padding:5px 12px;display:inline-flex;align-items:center;gap:6px;color:inherit}
#po .chip.on{color:var(--bg)}
#po .chip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.6);display:inline-block}
@media (min-width:700px) and (min-height:520px){#po .pobody{grid-template-columns:1fr 300px;overflow:visible}#po .poview{height:min(68vh,660px)}#po .poopts{overflow:auto;max-height:min(68vh,660px)}}
/* Full edit as a pop-up over the page */
#ed{align-items:center;padding:3vh 24px}
#ed>.panel{width:100%;max-width:820px;max-height:94vh;overflow:auto;margin:0;border-radius:16px;padding:22px 26px 0;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:popIn .18s ease-out;overscroll-behavior:contain}
#ed>.panel::before{display:none}
#ed #edX{position:sticky;top:0;float:right;z-index:3;margin:-6px -10px 0 0;background:var(--surface)}
#ed .crumbs,#ed .backbtn,#ed .fabs{display:none}
#ed>.panel:not(.editing){max-width:1080px;padding-bottom:22px}
#ed article.item{margin-top:0}
#ed form.edit{max-width:none;padding-bottom:0}
#ed .savebar{position:sticky;bottom:0;margin:18px -26px 0;padding:12px 26px;border-radius:0 0 16px 16px;background:var(--surface)}
#ed .savebar .wrap{padding:0;max-width:none}
@keyframes popIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
/* Bootleg banner across the corner of the artwork */
.frame.boot,.pframe.boot{position:relative;overflow:hidden}
.frame.boot::after,.pframe.boot::after{content:"BOOTLEG";position:absolute;z-index:3;top:16px;right:-38px;width:140px;transform:rotate(45deg);background:#b3261e;color:#fff;text-align:center;font:800 .62rem/1.9 var(--sans,system-ui);letter-spacing:.16em;box-shadow:0 2px 6px rgba(0,0,0,.45);border-top:1px dashed rgba(255,255,255,.55);border-bottom:1px dashed rgba(255,255,255,.55);pointer-events:none}
.item .frame.boot::after,.pframe.boot::after{top:26px;right:-50px;width:200px;font-size:.85rem;line-height:2.1}
.boottog{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.boottog input{width:22px;height:22px;accent-color:#b3261e}
.boottog:has(input:checked){border-color:#b3261e;background:color-mix(in srgb,#b3261e 10%,var(--bg))}
/* Field with a button beside it (Title + Look up, Barcode + Scan) */
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1 1 auto;min-width:0}
.inrow .iconbtn{flex:0 0 auto;height:auto;min-height:44px;padding:0 16px;gap:7px;white-space:nowrap;border-radius:10px}
/* Edge handles on the crop box: drag one side only */
.pe-crop i.ed{border:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.pe-crop i.ed::after{content:"";background:#fff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.pe-crop i.ed[data-h=n],.pe-crop i.ed[data-h=s]{left:50%;margin-left:-24px;cursor:ns-resize}
.pe-crop i.ed[data-h=n]{top:-24px}.pe-crop i.ed[data-h=s]{bottom:-24px}
.pe-crop i.ed[data-h=n]::after,.pe-crop i.ed[data-h=s]::after{width:30px;height:6px}
.pe-crop i.ed[data-h=w],.pe-crop i.ed[data-h=e]{top:50%;margin-top:-24px;cursor:ew-resize}
.pe-crop i.ed[data-h=w]{left:-24px}.pe-crop i.ed[data-h=e]{right:-24px}
.pe-crop i.ed[data-h=w]::after,.pe-crop i.ed[data-h=e]::after{width:6px;height:30px}
/* Big round drag handle for fast scrolling long pages (iPhone won't let pages restyle its own scroll bar) */
#fsc{position:fixed;right:max(4px,env(safe-area-inset-right));top:0;z-index:18;width:46px;height:62px;border-radius:23px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;opacity:0;pointer-events:none;transition:opacity .3s;user-select:none;-webkit-user-select:none}
#fsc.on{opacity:1;pointer-events:auto}
#fsc.drag{cursor:grabbing;background:var(--ink,#222);color:var(--bg)}
#fsc svg{width:22px;height:22px}
#fsc .bub{position:absolute;right:58px;top:50%;transform:translateY(-50%);background:var(--ink,#222);color:var(--bg);padding:8px 16px;min-width:52px;text-align:center;border-radius:999px;font:600 1.35rem/1.2 var(--serif,serif);white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none}
#fsc.drag .bub:not(:empty){display:block}
body.wallmode #fsc{display:none}
/* Back to the gallery from a piece */
.backbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px 0 12px;margin:0 0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink,inherit);text-decoration:none;font-weight:600;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.backbtn:active{transform:scale(.97)}
#app.swiping{transition:none}

  url(rooms/xmas-damask.svg) 0 0/150px auto,#4a0a10}

/* ============================================================
   Storage: on-device (IndexedDB) and Dropbox (App folder)
   ============================================================ */
class LocalStore {
  constructor(){ this.kind="local"; this.urls=new Map(); }
  db(){
    if(this._db) return this._db;
    this._db = new Promise((res,rej)=>{
      const r = indexedDB.open("collection-museum",1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("files"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  }
  async tx(store, mode, fn){
    const db = await this.db();
    return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); });
  }
  async load(){ return (await this.tx("kv","readonly",s=>s.get("catalog"))) || null; }
  async save(cat){ await this.tx("kv","readwrite",s=>s.put(cat,"catalog")); }
  async putFile(path, blob){ await this.tx("files","readwrite",s=>s.put(blob,path)); }
  async deleteFile(path){ this.urls.delete(path); await this.tx("files","readwrite",s=>s.delete(path)); }
  async getBlob(path){ return await this.tx("files","readonly",s=>s.get(path)); }
  forget(path){ const u = this.urls.get(path); if(u) URL.revokeObjectURL(u); this.urls.delete(path); }
  // Renames files (IndexedDB keys). Returns per pair: true, "missing" (nothing was there) or false.
  async moveMany(pairs){ const out = [];
    for(const [a, b] of pairs){ try{ const bl = await this.getBlob(a); if(!bl){ out.push("missing"); continue; } await this.putFile(b, bl); await this.deleteFile(a); this.forget(b); out.push(true); }catch(e){ out.push(false); } }
    return out; }
  async prune(){} // no folders in browser storage
  async url(path){
    if(this.urls.has(path)) return this.urls.get(path);
    const b = await this.getBlob(path); if(!b) return null;
    const u = URL.createObjectURL(b); this.urls.set(path,u); return u;
  }
}

class DropboxStore {
  constructor(appKey){ this.kind="dropbox"; this.appKey=appKey; this.rev=null; this.links=new Map(Object.entries(LS.get("cm.links",{}))); }
  static redirectUri(){ return location.origin + location.pathname; }
  static b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  static standalone(){ return navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }
  // Prepared ahead of the tap: iPhone home-screen apps ignore navigation that happens after an await.
  static async prepare(){
    const verifier = DropboxStore.b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = DropboxStore.b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    return {verifier, challenge, state:uid()};
  }
  static authUrl(appKey, pre, manual){
    const q = new URLSearchParams({client_id:appKey, response_type:"code", code_challenge:pre.challenge, code_challenge_method:"S256", token_access_type:"offline"});
    if(!manual){ q.set("redirect_uri", DropboxStore.redirectUri()); q.set("state", pre.state); }
    return "https://www.dropbox.com/oauth2/authorize?" + q;
  }
  static remember(appKey, pre, manual){ LS.set("cm.pkce", {verifier:pre.verifier, state:pre.state, appKey, manual:!!manual}); }
  static async exchange(code, saved, withRedirect){
    const body = {code, grant_type:"authorization_code", code_verifier:saved.verifier, client_id:saved.appKey};
    if(withRedirect) body.redirect_uri = DropboxStore.redirectUri();
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams(body)});
    if(!r.ok){ const t = await r.text().catch(()=> ""); authLog("sign-in exchange failed " + r.status + " " + t.slice(0,120)); throw new Error("Dropbox sign-in failed (" + r.status + "). Please try again."); }
    const j = await r.json();
    LS.set("cm.dropbox", {appKey:saved.appKey, refresh:j.refresh_token, access:j.access_token, exp:Date.now()+(j.expires_in-60)*1000, since:new Date().toISOString()});
    LS.set("cm.mode","dropbox"); LS.del("cm.pkce");
    authLog("connected" + (DropboxStore.standalone() ? " (home-screen app)" : " (browser)"));
  }
  static async finishManual(code){
    const saved = LS.get("cm.pkce", null);
    if(!saved) throw new Error("Please tap “Connect Dropbox” again first.");
    await DropboxStore.exchange(code.trim(), saved, false);
  }
  static async finishAuth(){
    const p = new URLSearchParams(location.search);
    if(!p.has("code") && !p.has("error")) return false;
    history.replaceState(null, "", location.pathname + location.hash);
    if(p.has("error")) throw new Error("Dropbox sign-in was cancelled.");
    const saved = LS.get("cm.pkce", null);
    if(!saved){ authLog("sign-in returned but no pending sign-in on this device"); throw new Error("Dropbox sign-in could not be finished here. Please tap Connect Dropbox again."); }
    // PKCE ties the code to this device's secret, so a code from another sign-in simply fails to exchange.
    if(saved.state !== p.get("state")) authLog("state differs (" + (p.get("state") ? "other" : "none") + ", " + (saved.manual ? "manual" : "redirect") + "); trying anyway");
    try{ await DropboxStore.exchange(p.get("code"), saved, true); }
    catch(e){ await DropboxStore.exchange(p.get("code"), saved, false); }
    return true;
  }
  async token(){
    const a = LS.get("cm.dropbox", null);
    if(!a) throw new Error("Not connected to Dropbox.");
    if(a.access && a.exp > Date.now()) return a.access;
    if(this._refreshing) return this._refreshing;
    this._refreshing = (async () => {
      let r;
      try{ r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams({grant_type:"refresh_token", refresh_token:a.refresh, client_id:a.appKey})}); }
      catch(e){ throw new Error("Couldn't reach Dropbox. Check your connection and try again."); }
      if(!r.ok){
        const j = await r.json().catch(()=>({}));
        authLog("refresh failed " + r.status + " " + (j.error || "") + " " + (j.error_description || ""));
        if(j.error === "invalid_grant"){ LS.del("cm.dropbox"); const e = new Error("Dropbox sign-in expired or was revoked. Please reconnect in Settings."); e.signedOut = true; throw e; }
        throw new Error("Dropbox is having trouble right now (" + r.status + "). Please try again in a minute.");
      }
      const j = await r.json(); a.access=j.access_token; a.exp=Date.now()+(j.expires_in-60)*1000; LS.set("cm.dropbox",a); return a.access;
    })();
    try{ return await this._refreshing; } finally{ this._refreshing = null; }
  }
  static arg(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0")); }
  async rpc(endpoint, body){
    const r = await fetch("https://api.dropboxapi.com/2/" + endpoint, {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary || "conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox error " + r.status);
    return r.json();
  }
  async upload(path, blob, mode){
    const r = await fetch("https://content.dropboxapi.com/2/files/upload", {method:"POST", headers:{Authorization:"Bearer " + await this.token(),
      "Content-Type":"application/octet-stream", "Dropbox-API-Arg":DropboxStore.arg({path, mode: mode || "overwrite", autorename:false, mute:true})}, body:blob});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary||"conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox upload failed (" + r.status + ")");
    return r.json();
  }
  async load(){
    let meta;
    try{ meta = await this.rpc("files/get_metadata", {path:"/catalog.json"}); }
    catch(e){ if((e.summary||"").includes("not_found")) { this.rev=null; return null; } throw e; }
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/catalog.json"})}});
    if(!r.ok) throw new Error("Could not read your catalog from Dropbox (" + r.status + ")");
    this.rev = meta.rev;
    const text = await r.text(), j = JSON.parse(text);
    this.base = text; // the catalog as last seen in Dropbox, for merging with changes made on another device
    return j;
  }
  async save(cat){
    await this.snapshot();
    for(let tries = 0; ; tries++){
      const text = JSON.stringify(cat, null, 1);
      try{
        const m = await this.upload("/catalog.json", new Blob([text], {type:"application/json"}), this.rev ? {".tag":"update", update:this.rev} : {".tag":"add"});
        this.rev = m.rev; this.base = text; return;
      }catch(e){
        if(!(e.summary||"").includes("conflict") || tries >= 3) {
          if((e.summary||"").includes("conflict")) throw new Error("Your catalog was changed on another device. Reload the page to get the latest, then redo this change.");
          throw e;
        }
        // Changed on another device since we loaded it: fold both sets of changes together and try again.
        const base = this.base ? JSON.parse(this.base) : {items:[]}, remote = await this.load();
        const merged = mergeCatalogs(base, cat, remote || {items:[]});
        Object.keys(cat).forEach(k => delete cat[k]); Object.assign(cat, merged);
        this.merged = true;
      }
    }
  }
  // Once a day, before the first change, keep a copy of catalog.json in backups/ (the newest 30 are kept).
  async snapshot(){
    const day = new Date().toISOString().slice(0,10);
    if(!this.rev || LS.get("cm.snapDay", "") === day || this._snapTried === day) return;
    this._snapTried = day;
    try{ await this.rpc("files/copy_v2", {from_path:"/catalog.json", to_path:"/backups/catalog-" + day + ".json", autorename:false}); }
    catch(e){ if(!/conflict|already_exists/.test(e.summary || "")) return; } // already made today (maybe on another device)
    LS.set("cm.snapDay", day);
    this.pruneSnapshots().catch(() => {});
  }
  async listSnapshots(){
    let j; try{ j = await this.rpc("files/list_folder", {path:"/backups"}); }catch(e){ if((e.summary||"").includes("not_found")) return []; throw e; }
    let all = j.entries; while(j.has_more){ j = await this.rpc("files/list_folder/continue", {cursor:j.cursor}); all = all.concat(j.entries); }
    return all.filter(e => e[".tag"] === "file" && /^catalog-.*\.json$/.test(e.name)).sort((a,b) => b.name.localeCompare(a.name));
  }
  async pruneSnapshots(){
    const daily = (await this.listSnapshots()).filter(e => /^catalog-\d{4}-\d\d-\d\d\.json$/.test(e.name));
    for(const e of daily.slice(30)) await this.rpc("files/delete_v2", {path:e.path_lower});
  }
  async putFile(path, blob){ await this.upload("/" + path, blob, "overwrite"); }
  async deleteFile(path){ this.links.delete(path); try{ await this.rpc("files/delete_v2", {path:"/" + path}); }catch(e){ if(!(e.summary||"").includes("not_found")) throw e; } }
  forget(path){ this.links.delete(path); clearTimeout(this._lt); this._lt = setTimeout(()=>LS.set("cm.links", Object.fromEntries(this.links)), 500); }
  // Dropbox batch jobs answer "working on it": ask again until done.
  async job(start, check, body){
    let j = await this.rpc(start, body), id = j.async_job_id;
    for(let w = 0; j[".tag"] === "async_job_id" || j[".tag"] === "in_progress"; w++){
      await new Promise(r => setTimeout(r, Math.min(400 * 1.5 ** w, 4000)));
      j = await this.rpc(check, {async_job_id:id});
    }
    if(j[".tag"] !== "complete") throw new Error("Dropbox couldn't finish moving files (" + (j[".tag"] || "unknown") + "). Nothing was lost; try again later.");
    return j.entries || [];
  }
  // Moves many files at once. Returns per pair: true, "missing" (nothing was there) or false.
  async moveMany(pairs, progress){
    const out = [];
    for(let s = 0; s < pairs.length; s += 900){
      const chunk = pairs.slice(s, s + 900);
      if(progress) progress(s, pairs.length);
      const ents = await this.job("files/move_batch_v2", "files/move_batch/check_v2", {entries:chunk.map(([a, b]) => ({from_path:"/" + a, to_path:"/" + b})), autorename:false});
      chunk.forEach(([a, b], k) => { const e = ents[k] || {}; this.links.delete(a); this.links.delete(b);
        out.push(e[".tag"] === "success" ? true : /from_lookup[^}]*not_found/.test(JSON.stringify(e.failure || {})) ? "missing" : false); });
    }
    this.forget("");
    return out;
  }
  // Has Dropbox itself download a picture from the web straight into the folder (no browser download,
  // so it works for sites that won't share their images with other web pages).
  async saveUrl(path, url){
    let j = await this.rpc("files/save_url", {path:"/" + path, url});
    const id = j.async_job_id;
    for(let w = 0; j[".tag"] === "async_job_id" || j[".tag"] === "in_progress"; w++){
      if(w > 30) throw new Error("Dropbox took too long");
      await new Promise(r => setTimeout(r, Math.min(500 * 1.4 ** w, 4000)));
      j = await this.rpc("files/save_url/check_job_status", {async_job_id:id});
    }
    if(j[".tag"] !== "complete"){ const f = ((j.failed || {})[".tag"] || j[".tag"] || "").replace(/_/g, " "); throw new Error(f ? "Dropbox said: " + f : "Dropbox couldn't fetch that picture"); }
    this.links.delete(path);
  }
  // Removes folders under (and including) dir that hold no files any more. Never removes media/ itself.
  async prune(dir){
    if(!dir) return;
    let j; try{ j = await this.rpc("files/list_folder", {path:"/" + dir, recursive:true}); }catch(e){ return; }
    const ents = [...j.entries]; while(j.has_more){ j = await this.rpc("files/list_folder/continue", {cursor:j.cursor}); ents.push(...j.entries); }
    const full = new Set();
    for(const e of ents) if(e[".tag"] === "file"){ let p = e.path_lower; while((p = p.slice(0, p.lastIndexOf("/")))) full.add(p); }
    const root = ("/" + dir).toLowerCase(), empty = ents.filter(e => e[".tag"] === "folder" && !full.has(e.path_lower)).map(e => e.path_lower);
    if(!full.has(root) && root !== "/media") empty.push(root);
    const top = empty.filter(p => !empty.some(q => q !== p && p.startsWith(q + "/")));
    if(!top.length) return;
    await this.job("files/delete_batch", "files/delete_batch/check", {entries:top.map(path => ({path}))}).catch(() => {});
    if(top.includes(root)){ const up = dir.slice(0, dir.lastIndexOf("/")); if(up && up.toLowerCase() !== "media") await this.prune(up); }
  }
  async getBlob(path){
    // Dropbox turns requests away ("429 too many") when lots of photos are asked for at once: wait and ask again.
    for(let a = 0; ; a++){
      const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/" + path})}});
      if(r.ok) return r.blob();
      if((r.status === 429 || r.status >= 500) && a < 4){
        const ra = parseFloat(r.headers.get("Retry-After")); await new Promise(res => setTimeout(res, (ra > 0 ? Math.min(ra, 10) * 1000 : 800 * 2 ** a) + Math.random() * 400)); continue; }
      return null;
    }
  }
  async url(path){
    const c = this.links.get(path);
    if(c && c.exp > Date.now()) return c.link;
    try{
      const j = await this.rpc("files/get_temporary_link", {path:"/" + path});
      this.links.set(path, {link:j.link, exp:Date.now() + 3.5*3600*1000});
      clearTimeout(this._lt); this._lt = setTimeout(()=>LS.set("cm.links", Object.fromEntries(this.links)), 500);
      return j.link;
    }catch{ return null; }
  }
}

/* Three-way merge for when two devices change the catalog at the same time.
   A piece changed on only one side keeps that change; changed on both, the newer edit wins.
   A piece deleted on one side stays deleted unless the other side changed it. */
function mergeCatalogs(base, local, remote){
  const J = x => JSON.stringify(x), byId = l => new Map((l || []).map(i => [i.id, i]));
  const B = byId(base.items), L = byId(local.items), R = byId(remote.items), out = [];
  const ids = [...R.keys(), ...[...L.keys()].filter(id => !R.has(id))];
  for(const id of ids){
    const b = B.get(id), l = L.get(id), r = R.get(id);
    if(l && r){ if(J(l) === J(b)) out.push(r); else if(J(r) === J(b)) out.push(l); else out.push(String(r.updated||"") > String(l.updated||"") ? r : l); }
    else if(l){ if(!b || J(l) !== J(b)) out.push(l); }   // remote deleted it: keep only if changed here
    else if(r){ if(!b || J(r) !== J(b)) out.push(r); }   // deleted here: keep only if changed there
  }
  const m = {};
  for(const k of new Set([...Object.keys(remote), ...Object.keys(local)])){
    if(k === "items" || k === "updated") continue;
    const v = J(local[k]) !== J(base[k]) ? local[k] : remote[k];
    if(v !== undefined) m[k] = v;
  }
  m.items = out; m.updated = new Date().toISOString();
  return m;
}
// Swap in a whole catalog (restore from a backup); put the old one back if it can't be saved.
async function replaceCatalog(j){
  const old = cat; cat = j;
  try{ await persist(); }catch(e){ cat = old; throw e; }
}

/* ============================================================
   App state
   ============================================================ */
function authLog(msg){ const l = LS.get("cm.authlog", []); l.unshift(new Date().toLocaleString() + ": " + msg); LS.set("cm.authlog", l.slice(0,8)); }
let store, cat, priv = LS.get("cm.private", true);
const coll = id => cat.collections.find(c => c.id === id) || {id, name:"Uncategorized", icon:"📦", maker:"Maker", fields:[]};
const item = id => cat.items.find(i => i.id === id);
const cover = it => (it.media||[]).find(m => m.kind === "photo");

function toast(msg, ms=2600){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function busy(msg){ const b=document.createElement("div"); b.className="busy"; b.innerHTML="<div>"+esc(msg||"Saving…")+"</div>"; document.body.appendChild(b); return ()=>b.remove(); }
let saveChain = Promise.resolve();   // one save at a time, so a background job and an edit never race each other
function persist(){ const run = saveChain.catch(() => {}).then(async () => { cat.updated = new Date().toISOString(); await store.save(cat);
  if(store.merged){ store.merged = false; toast("Also brought in changes from your other device"); } }); saveChain = run; return run; }

/* ============================================================
   Readable media folders: media/<Gallery>/<Maker – Title (Year)>/<Cover.jpg, Photo 1.jpg, COA.pdf>
   Small previews live in a .thumbs folder beside them. The catalog stores each file's path,
   so names are only for people browsing Dropbox; the app never has to work them out again.
   ============================================================ */
const cleanName = (s, max) => { s = String(s || "").normalize("NFC").replace(/[\/\\<>:"|?*\u0000-\u001f\u007f]+/g, " ").replace(/\s+/g, " ").trim();
  if(s.length > (max || 70)) s = s.slice(0, max || 70).trim(); return s.replace(/^[. ]+|[. ]+$/g, ""); };
const dirOf = p => p.slice(0, p.lastIndexOf("/")).replace(/\/\.thumbs$/, "");
const baseOf = p => p.slice(p.lastIndexOf("/") + 1);
const extOf = p => ((baseOf(p).match(/\.[A-Za-z0-9]{1,5}$/) || [".jpg"])[0]).toLowerCase();
const looksRandom = b => /^[0-9a-z]{12,16}(_t)?\.[a-z0-9]+$/.test(b) && /\d/.test(b);
function itemFolderName(it){
  const t = cleanName(it.title, 60) || "Untitled", mk = cleanName(it.maker, 40), y = cleanName(it.year, 10);
  return (mk && mk.toLowerCase() !== t.toLowerCase() ? mk + " – " : "") + t + (y ? " (" + y + ")" : "");
}
function fileBase(m){
  const nm = String(m.name || "").replace(/\.[A-Za-z0-9]{1,5}$/, "");
  if(m.kind === "document") return cleanName(m.label || nm, 60) || "Document";
  if(/^cover$/i.test(nm)) return "Cover";
  if(!nm || /^(img|dsc|dscn|pxl|image|photo|picture|screenshot|file|mvimg|boardgamegeek)\b|^(img|dsc|pxl|mvimg)_|^\d|^[\w-]{20,}$/i.test(nm)) return "Photo";
  return cleanName(nm, 60) || "Photo";
}
// Which item uses each folder (lower case: Dropbox ignores case), so two pieces never share one.
function folderOwners(items){
  const own = new Map();
  for(const i of items) for(const m of i.media || []) if(!m.remote && m.path) own.set(dirOf(m.path).toLowerCase(), i.id);
  return own;
}
function wantFolder(it, own){
  const base = "media/" + (cleanName(coll(it.collectionId).name, 50) || "Uncategorized") + "/" + itemFolderName(it), bl = base.toLowerCase();
  const mine = (it.media || []).filter(m => !m.remote && m.path).map(m => dirOf(m.path));
  const cur = mine.find(d => d.toLowerCase() === bl) || mine.find(d => d.toLowerCase().startsWith(bl + " (") && /^ \(\d+\)$/.test(d.slice(base.length)) && own.get(d.toLowerCase()) === it.id);
  if(cur) return cur;
  for(let n = 1; ; n++){ const c = n === 1 ? base : base + " (" + n + ")", o = own.get(c.toLowerCase()); if(!o || o === it.id) return c; }
}
/* Works out where each of a piece's files should live. fresh = media not uploaded yet (just get paths).
   Returns {folder, moves:[{m, key, from, to}]} for files already stored. Also claims the folder in own. */
function planItem(it, own, fresh){
  fresh = fresh || new Set();
  const folder = wantFolder(it, own), local = (it.media || []).filter(m => !m.remote && m.path), taken = new Set(), want = new Map();
  own.set(folder.toLowerCase(), it.id);
  // Files already sitting in the right folder with a proper name keep it.
  for(const m of local){ const b = baseOf(m.path); if(!fresh.has(m) && dirOf(m.path) === folder && !looksRandom(b) && !taken.has(b.toLowerCase())){ taken.add(b.toLowerCase()); want.set(m, b); } }
  for(const m of local){
    if(want.has(m)) continue;
    const b = baseOf(m.path), ext = extOf(m.path);
    if(!looksRandom(b) && !fresh.has(m) && !taken.has(b.toLowerCase()) && !/\/media\/tmp\//.test("/" + m.path)){ taken.add(b.toLowerCase()); want.set(m, b); continue; }
    const fb = fileBase(m);
    for(let n = 1; ; n++){
      const c = (fb === "Photo" ? "Photo " + n : n === 1 ? fb : fb + " (" + n + ")") + ext;
      if(!taken.has(c.toLowerCase())){ taken.add(c.toLowerCase()); want.set(m, c); break; }
    }
  }
  const moves = [];
  for(const m of local){
    const b = want.get(m), path = folder + "/" + b, thumb = m.thumb ? folder + "/.thumbs/" + b.replace(/\.[a-z0-9]+$/i, ".jpg") : null;
    if(fresh.has(m)){ m.path = path; if(thumb) m.thumb = thumb; continue; }
    if(m.path !== path) moves.push({m, key:"path", from:m.path, to:path});
    if(thumb && m.thumb !== thumb) moves.push({m, key:"thumb", from:m.thumb, to:thumb});
  }
  return {folder, moves};
}
// Gives brand-new media (not in it.media yet, or not uploaded yet) their readable paths.
function placeNew(it, ms){
  const was = it.media || [], tmp = {...it, media:was.concat(ms.filter(m => !was.includes(m)))};
  planItem(tmp, folderOwners(cat.items.filter(i => i.id !== it.id)), new Set(ms));
}
const tmpMedia = (it, m, ext) => { m.path = "media/tmp/" + m.id + (ext || ".jpg"); if(m.kind === "photo") m.thumb = "media/tmp/" + m.id + "_t.jpg"; return m; };

/* Moves the given pieces' files into their readable folders, then saves the catalog.
   If a move fails (offline, Dropbox busy) that file just stays where it is and keeps working. */
async function tidyItems(items, opts){
  opts = opts || {};
  const own = folderOwners(cat.items), all = [];
  for(const it of items) for(const mv of planItem(it, own).moves) all.push(mv);
  if(!all.length) return {moved:0, failed:0};
  const oldDirs = [...new Set(all.map(mv => dirOf(mv.from)))];
  const res = await store.moveMany(all.map(mv => [mv.from, mv.to]), opts.progress);
  let moved = 0, failed = 0;
  all.forEach((mv, k) => { if(res[k]){ mv.m[mv.key] = mv.to; moved++; } else failed++; });
  if(moved){
    try{ await persist(); }
    catch(e){ // catalog couldn't be saved (changed on another device?): put the files back so it still matches
      const back = all.filter((mv, k) => res[k] === true);
      all.forEach((mv, k) => { if(res[k]) mv.m[mv.key] = mv.from; });
      await store.moveMany(back.map(mv => [mv.to, mv.from])).catch(() => {});
      throw e;
    }
  }
  if(store.prune){
    if(opts.all) await store.prune("media").catch(() => {});
    else for(const d of oldDirs) await store.prune(d).catch(() => {});
  }
  return {moved, failed};
}
// A renamed gallery: move its pieces' folders along with it.
async function tidyGallery(items){
  const pb = items.length > 3 ? progressBox("Renaming the collection's folders…") : null;
  try{ await tidyItems(items, {progress:(n, t) => pb && pb.set(`Moving files… ${n} of ${t}`)}); }
  catch(e){ /* files stay where they are; Settings > Tidy up retries */ }
  finally{ if(pb) pb.done(); }
}
// The Settings button: every piece, with a copy of the catalog saved first.
async function tidyAll(){
  const own = folderOwners(cat.items); let n = 0;
  for(const it of cat.items) n += planItem(it, own).moves.length;
  if(!n) return alert("Everything is already in tidy, readable folders.");
  if(!confirm(`Move ${n} file${n===1?"":"s"} into folders named after each collection and piece (media › Collection › Piece)? A copy of your catalog is saved first, and nothing is deleted except folders left empty.`)) return;
  const pb = progressBox("Saving a copy of your catalog…");
  try{
    if(store.kind === "dropbox") await store.putFile("backups/catalog-before-tidy-" + new Date().toISOString().slice(0,19).replace(/:/g,"-") + ".json", new Blob([JSON.stringify(cat, null, 1)], {type:"application/json"}));
    pb.set("Moving files…");
    const r = await tidyItems(cat.items, {all:true, progress:(k, t) => pb.set(`Moving files… ${k} of ${t}`)});
    pb.done();
    alert(`Done: ${r.moved} file${r.moved===1?"":"s"} moved.` + (r.failed ? `\n\n${r.failed} couldn't be moved right now and still work where they are. Tap Tidy up again later to finish.` : ""));
    route();
  }catch(e){ pb.done(); alert("Couldn't finish tidying: " + e.message); }
}
// Background tidy after a save: never interrupts, just quietly retries on the next edit or the Settings button.
function tidyLater(items){ keepOnlineCovers(items).catch(() => {}).then(() => tidyItems(items)).then(r => { if(r.moved && /^#\/i\//.test(location.hash) && !document.querySelector("#ef, .busy") && !document.getElementById("layer").children.length) refreshView(); }).catch(() => {}); }

/* Covers found by a lookup (Discogs, MusicBrainz, BoardGameGeek…) start as links to that website.
   Dropbox can fetch a copy into the piece's folder, so the photo is really yours: it shows up in
   the cover poster and backups, and keeps working if the website changes or blocks other pages. */
const onlineCovers = it => (it.media || []).filter(m => m.remote && m.kind === "photo" && /^https:\/\//.test(m.path || ""));
async function keepOnlineCovers(items, progress){
  if(store.kind !== "dropbox" || !store.saveUrl) return {saved:0, failed:0, total:0};
  const own = folderOwners(cat.items), jobs = [];
  for(const it of items){
    const rs = onlineCovers(it); if(!rs.length) continue;
    const fresh = rs.map(m => { const e = (String(m.path).split(/[?#]/)[0].match(/\.(jpe?g|png|webp|gif)$/i) || [".jpg"])[0].toLowerCase().replace(".jpeg", ".jpg");
      return {m, nm:{id:m.id, kind:"photo", name:(/^cover/i.test(m.name || "") ? "cover" : m.name || "photo") + e, path:"media/tmp/" + m.id + e}}; });

function arrangeHalls(){
  const grid = document.getElementById("halls"), link = document.getElementById("arrange");
  if(grid.classList.contains("arranging")){
    const order = [...grid.querySelectorAll(".hall")].map(h => h.dataset.id);
    const before = cat.collections.slice(), was = cat.arranged;
    cat.collections.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id)); cat.arranged = true;
    persist().then(()=>toast("Order saved")).catch(e => { cat.collections = before; cat.arranged = was; alert(e.message); });
    grid.classList.remove("arranging"); link.textContent = "Arrange";
    document.querySelector(".fabs")?.style.removeProperty("display");
    return;
  }
  grid.classList.add("arranging"); link.textContent = "Done";
  const fabs = document.querySelector(".fabs"); if(fabs) fabs.style.display = "none";
  toast("Drag collections into the order you like, then tap Done", 3500);
  // Drag state lives on the grid: the window listeners are wired once, so a second Arrange on the same page must share it.
  const st = grid._st || (grid._st = {drag:null});
  const move = e => {
    const drag = st.drag; if(!drag) return;
    e.preventDefault();
    const over = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains("hall") && el !== drag);
    if(over){ const r = over.getBoundingClientRect(), y = (e.clientY - r.top) / r.height, x = (e.clientX - r.left) / r.width;
      grid.insertBefore(drag, (y > .5 || (y > .2 && x > .5)) ? over.nextSibling : over); }
    if(e.clientY < 70) window.scrollBy(0, -14); else if(e.clientY > innerHeight - 70) window.scrollBy(0, 14);
  };
  const up = () => { if(st.drag){ st.drag.classList.remove("dragging"); st.drag = null; } };
  if(!grid._wired){ grid._wired = true;
    window.addEventListener("pointermove", move, {passive:false});
    window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  }
  grid.querySelectorAll(".hall").forEach(h => {
    if(h._wired) return; h._wired = true;
    h.addEventListener("click", e => { if(grid.classList.contains("arranging")) e.preventDefault(); });
    h.addEventListener("dragstart", e => e.preventDefault());
    h.addEventListener("pointerdown", e => {
      if(!grid.classList.contains("arranging")) return;

  });
}

    if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1); } return d[a.length][b.length]; }

    maker:(a,b)=> (!a.maker - !b.maker) || makerKey(a.maker).localeCompare(makerKey(b.maker), undefined, {sensitivity:"base", numeric:true}) || sortKey(a.title).localeCompare(sortKey(b.title), undefined, {numeric:true}),
    year:(a,b)=> (parseInt(a.year)||9999) - (parseInt(b.year)||9999) || (a.title||"").localeCompare(b.title||""),
    yeard:(a,b)=> (parseInt(b.year)||0) - (parseInt(a.year)||0) || (a.title||"").localeCompare(b.title||""),
    condition:(a,b)=> condRank(a.condition) - condRank(b.condition) || (a.title||"").localeCompare(b.title||""),
    updated:(a,b)=> (b.updated||"").localeCompare(a.updated||""),
    value:(a,b)=> (+b.value||0) - (+a.value||0),
  }[how] || (()=>0);
  return [...list].sort(by);
}

/* Search boxes filter as you type. While a live search redraws the page, the box itself is kept
   (not rebuilt), so the phone keyboard stays up and the cursor stays put. */
let liveKeep = null, liveTimer = 0;
const searchBox = (ph, q) => `<span class="sbox"><input type="search" name="q" placeholder="${esc(ph)}" value="${esc(q)}" aria-label="Search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button type="button" class="sx" aria-label="Clear search" title="Clear">×</button></span>`;
function paint(html){
  const keep = liveKeep && liveKeep.isConnected && app.contains(liveKeep) ? liveKeep : null;
  if(!keep){ app.innerHTML = html; return; }
  const t = document.createElement("div"); t.innerHTML = html;
  const fresh = t.querySelector("#sf input[name=q]");
  const pairs = []; let a = keep, b = fresh;
  while(b && b !== t && a && a !== app){ pairs.push([a, b]); a = a.parentNode; b = b.parentNode; }
  if(b !== t || a !== app){ app.innerHTML = html; return; }
  for(const [a, b] of pairs){
    const P = a.parentNode, NP = b.parentNode;
    if(P !== app){ [...P.attributes].forEach(x => NP.hasAttribute(x.name) || P.removeAttribute(x.name)); [...NP.attributes].forEach(x => P.setAttribute(x.name, x.value)); }
    [...P.childNodes].forEach(n => { if(n !== a) n.remove(); });
    let before = true;
    [...NP.childNodes].forEach(n => { if(n === b){ before = false; return; } if(before) P.insertBefore(n, a); else P.appendChild(n); });
  }
}
function liveSearch(hashFor){
  const f = document.getElementById("sf"), inp = f && f.q; if(!inp) return;
  const apply = () => {
    clearTimeout(liveTimer);
    if(!inp.isConnected) return;
    const h = hashFor(inp.value.trim());
    if(h === (location.hash || "#/")) return;
    history.replaceState(history.state, "", h);
    navCur = h;
    const y = scrollY; liveKeep = inp;
    try{ route(); } finally{ liveKeep = null; }
    scrollTo(0, y);
  };
  inp.oninput = () => { clearTimeout(liveTimer); liveTimer = setTimeout(apply, 250); };
  // Enter / the keyboard's Search or Go key: show results now and put the keyboard away.
  inp.onkeydown = e => { if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); apply(); inp.blur(); } };
  f.onsubmit = e => { e.preventDefault(); apply(); inp.blur(); };
  const x = f.querySelector(".sx");
  if(x) x.onclick = () => { inp.value = ""; apply(); inp.focus(); };
}

    <div class="spin-out" id="spinOut"></div>

  hydrate(L);

  document.getElementById("spin").onclick = e => { if(e.target.id === "spin") close(); };

async function openDoc(path, name){
  const w = store.kind === "local" ? null : window.open("", "_blank");
  const u = await mediaUrl(path);
  if(!u){ w && w.close(); return toast("Couldn't open that document."); }
  if(w) w.location = u;
  else if(/\.pdf$/i.test(name||"")) window.open(u, "_blank");
  else lightbox(u);
}

// nav (optional): {n, count, url:k => Promise<url>, moved:k => void} lets the full-size view step through a piece's photos.
function lightbox(src, nav){
  if(!src) return;
  const L = document.getElementById("layer"), multi = nav && nav.count > 1;
  const ar = d => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  L.innerHTML = `<div class="lightbox" id="lb"><button class="iconbtn x" aria-label="Close">✕</button><img src="${esc(src)}" alt="">${multi ? `<button type="button" class="lbnav prev" aria-label="Previous photo">${ar("M15 5l-7 7 7 7")}</button><button type="button" class="lbnav next" aria-label="Next photo">${ar("M9 5l7 7-7 7")}</button><span class="lbcount">${nav.n + 1} / ${nav.count}</span>` : ""}</div>`;
  const lb = document.getElementById("lb"), img = lb.querySelector("img");
  const close = () => { L.innerHTML = ""; document.removeEventListener("keydown", k); };
  let n = multi ? nav.n : 0;
  const go = async d => {
    n = (n + d + nav.count) % nav.count; const want = n;
    lb.querySelector(".lbcount").textContent = (n + 1) + " / " + nav.count; nav.moved && nav.moved(n);
    const u = await nav.url(n).catch(() => null); if(want !== n || !u || !img.isConnected) return;
    img.classList.remove("zoom", "slidel", "slider"); void img.offsetWidth; img.src = u; img.classList.add(d > 0 ? "slidel" : "slider");
  };
  img.onclick = e => { e.stopPropagation(); img.classList.toggle("zoom"); };
  lb.querySelector(".x").onclick = close;
  lb.onclick = e => { if(e.target === lb) close(); };
  if(multi){
    lb.querySelectorAll(".lbnav").forEach(b => b.onclick = e => { e.stopPropagation(); go(b.classList.contains("next") ? 1 : -1); });
    let sx = null, sy = 0;
    lb.addEventListener("touchstart", e => { if(e.touches.length !== 1 || img.classList.contains("zoom")){ sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
    lb.addEventListener("touchend", e => { if(sx == null) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
      if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && (!window.visualViewport || visualViewport.scale <= 1.01)) go(dx < 0 ? 1 : -1); }, {passive:true});
  }

    if(!lb.isConnected) return document.removeEventListener("keydown", k);
    if(e.key === "Escape") close();
    else if(multi && e.key === "ArrowRight") go(1); else if(multi && e.key === "ArrowLeft") go(-1);
  }
  document.addEventListener("keydown", k);
}

async function searchCandidates(kind, q, maker){
  q = (q||"").trim(); if(!q) return [];
  if(kind === "music"){
    // Discogs (when a token is set) and MusicBrainz are searched together; Discogs first, vinyl ahead of CDs.
    const tok = (cat.settings||{}).discogsToken;
    let [dg, mb] = await Promise.allSettled([tok ? discogsSearch(q, maker, tok) : Promise.resolve([]), musicBrainzSearch(q, maker)]);
    // Forgiving: if Discogs found little, try again with the spelling MusicBrainz found ("Beat Down" → "Beatdown", typos),
    // with neighbouring words joined, and without the artist (in case that's the part with the typo).
    if(tok && (dg.value || []).length < 3){
      const norm = x => String(x||"").toLowerCase().replace(/[^a-z0-9]/g, ""), seen = new Set((dg.value || []).map(c => c.ref && c.ref.discogs));
      const tries = [], top = (mb.value || [])[0];
      if(top && (norm(top.title) !== norm(q) || (maker && norm(top.maker) !== norm(maker)))) tries.push([top.title, top.maker]);
      const ws = q.split(/\s+/); ws.slice(1).forEach((w, n) => tries.push([ws.slice(0, n).concat([ws[n] + w], ws.slice(n + 2)).join(" "), maker]));
      if(maker) tries.push([q, ""]);
      let extra = [];
      for(const [tq, tm] of tries.slice(0, 4)){
        if(extra.length + (dg.value || []).length >= 8) break;
        try{ (await discogsSearch(tq, tm, tok)).forEach(c => { const k = c.ref && c.ref.discogs; if(!seen.has(k)){ seen.add(k); extra.push(c); } }); }catch(e){ break; }
      }
      if(extra.length) dg = {status:"fulfilled", value:(dg.value || []).concat(extra)};
    }
    const vinylFirst = list => list.map((c,n) => [c,n]).sort((a,b) => (/vinyl|lp|12"|7"|10"/i.test(b[0].sub) - /vinyl|lp|12"|7"|10"/i.test(a[0].sub)) || a[1]-b[1]).map(x => x[0]);
    const all = vinylFirst(dg.value || []).concat(vinylFirst(mb.value || []));
    if(!all.length && (dg.status === "rejected" || mb.status === "rejected")) throw (dg.reason || mb.reason);
    return all;
  }
  let res = await searchOther(kind, q, maker);
  // Nothing found: try again with neighbouring words joined ("beat down" → "beatdown"), then without the second box.
  if(!res.length && kind !== "comic"){ const ws = q.split(/\s+/);
    for(const v of ws.slice(1).map((w, n) => ws.slice(0, n).concat([ws[n] + w], ws.slice(n + 2)).join(" ")).slice(0, 3)){ res = await searchOther(kind, v, maker).catch(() => []); if(res.length) break; }
    if(!res.length && maker) res = await searchOther(kind, q, "").catch(() => []); }
  return res;
}
// Vinyl colour from Discogs: the free-text format note ("Red Translucent") or a colour word in the format list.
const COLOR_WORDS = /\b(black|clear|transparent|translucent|white|red|orange|yellow|green|blue|purple|violet|pink|gold|silver|grey|gray|smoke|brown|splatter|marble|marbled|swirl|swirled|glow|coloured|colored|picture)\b/i;
function vinylColor(r){
  const txt = (r.formats||[]).map(f => f.text || "").find(t => COLOR_WORDS.test(t));
  if(txt) return txt.trim();
  const w = (r.format||[]).find(f => COLOR_WORDS.test(f) && !/^(vinyl|lp|album)$/i.test(f));
  return w && !/^(coloured|colored)$/i.test(w) ? w : "";
}

/* Copy looked-up details into a piece. overwrite=false only fills blanks, so your own entries win. */
function mergeResult(it, r, overwrite){
  ["title","maker","year"].forEach(k => { if(r[k] && (overwrite || !it[k])) it[k] = r[k]; });
  it.fields = it.fields || {}; it.extra = it.extra || []; it.media = it.media || [];
  const gf = coll(it.collectionId).fields, norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g,"");
  Object.entries(r.fields||{}).forEach(([k,v]) => { if(v && (overwrite || !it.fields[k]) && gf.some(f=>f.k===k)) it.fields[k] = v; });
  if(r.barcode && !it.barcode) it.barcode = r.barcode;
  if((r.tracks||[]).length && (overwrite || !(it.tracks||[]).length)) it.tracks = r.tracks;
  const keyed = new Set(Object.entries(r.fields||{}).filter(([k,v]) => v && gf.some(f=>f.k===k)).map(([k]) => k));

    if(f){ if(keyed.has(f.k)) return; if(overwrite || !it.fields[f.k]) it.fields[f.k] = v; return; }
    if(gf.some(f => keyed.has(f.k) && norm(f.l).includes(norm(label)))) return;

  if(releaseCache[key]) return releaseCache[key];
  let out = null;
  if(ref.discogs){
    const tok = (cat.settings||{}).discogsToken; if(!tok) return null;
    const j = await getJSON("https://api.discogs.com/releases/" + ref.discogs + "?token=" + encodeURIComponent(tok));
    const tracks = [];

      if(t.type_ === "heading"){ if(t.title) tracks.push({h:t.title}); return; }
      if(t.type_ === "index" && (t.sub_tracks||[]).length){ t.sub_tracks.forEach(s => tracks.push({p:s.position||"", t:[t.title, s.title].filter(Boolean).join(": "), d:s.duration||""})); return; }

    });

/* Find the release a saved piece belongs to: its match, or (for older matches) its barcode. */

/* Fill track listings (and blank genre/style details) for every piece in music galleries that doesn't have one yet.

let trackJob = null;
const TRACKJOB_KEY = "cm.trackJob";
function trackTodo(){ return cat.items.filter(i => hasTrackList(coll(i.collectionId)) && !(i.tracks||[]).length && (((i.matched||{}).ref) || i.barcode)); }
async function keepAwake(job){
  try{ if(!job.done && navigator.wakeLock && document.visibilityState === "visible" && !(job.lock && !job.lock.released)) job.lock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(trackJob && document.visibilityState === "visible") keepAwake(trackJob); });
async function fillAllTracks(resume){
  if(trackJob) return toast("Track listings are already being filled in. Watch the bar at the bottom.");
  const todo = trackTodo();
  if(!todo.length){ LS.del(TRACKJOB_KEY); if(resume !== true) alert("Every matched record already has a track listing. For others, open the piece and use 🔎 Match (or type the tracks in ✎ Edit)."); return; }
  if(resume !== true && !confirm(`Look up track listings for ${todo.length} piece${todo.length===1?"":"s"}? This takes about ${Math.max(1, Math.round(todo.length * 2 / 60))} minute${todo.length * 2 > 90 ? "s" : ""} (the music sites ask for a slow pace).\n\nYou can keep using the app while it works. Leave the app open: if you switch away or it closes, it picks up where it left off next time.`)) return;
  const job = trackJob = {stop:false, done:false};
  LS.set(TRACKJOB_KEY, {at:new Date().toISOString()});
  keepAwake(job);
  const b = document.createElement("div"); b.className = "jobbar noprint"; b.setAttribute("role", "status");
  b.innerHTML = `<span class="jt" id="ftMsg">Starting…</span><button type="button" class="iconbtn" id="ftStop">Stop</button><i class="jp" id="ftBar"></i>`;
  document.body.appendChild(b);
  const say = t => { b.querySelector("#ftMsg").textContent = t; };
  b.querySelector("#ftStop").onclick = () => { job.stop = true; say("Stopping after this one…"); };
  let filled = 0, none = 0, failed = 0, n = 0;
  try{
    for(const it of todo){
      if(job.stop) break;

      // Discogs allows 60 requests a minute and MusicBrainz about one a second. When either says "slow down",

        try{

          // fresh copies of pieces, and writing to the old copy would be silently lost.

          const cur = item(it.id); if(!cur) break;

            for(let w = 60; w > 0 && !job.stop; w--){ say(`🎶 ${n} of ${todo.length}: the music sites asked for a short break. Carrying on in ${w}s…`); await new Promise(r => setTimeout(r, 1000)); }
            say(`🎶 ${n} of ${todo.length}: ${it.title}`); continue; }

    }
    if(filled) await persist();
    if(!job.stop && !failed) LS.del(TRACKJOB_KEY);   // finished: nothing to resume (stopping on purpose also clears it below)

    + (failed ? `\n\n${failed} couldn't be reached right now (the music sites were busy). Tap Fill in track listings again later to finish them.` : "");

  if(/^#\/(new|edit)/.test(location.hash) || document.querySelector("#layer > *, #edlayer > *, .busy") || document.body.classList.contains("wallmode")) toast(`🎶 Track listings done: ${filled} added`, 4000);
  else { alert(msg); refreshView(); }
}
