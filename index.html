<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Collection</title>
<meta name="description" content="A private museum for personal collections.">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Museum">
<style>
:root{
  --bg:#f6f2ea; --surface:#fffdf8; --ink:#1d1a16; --muted:#6f665b; --line:#e2d9c9;
  --accent:#8a2b1d; --accent-ink:#fff; --frame:#2a241d; --mat:#efe7d8; --chip:#ece4d4;
  --danger:#a1271b; --ok:#2f6b3a; --shadow:0 1px 2px rgba(40,30,20,.08),0 6px 20px rgba(40,30,20,.08);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15130f; --surface:#1f1c17; --ink:#f1ebe0; --muted:#a69c8e; --line:#38322a; --accent:#d9846f; --accent-ink:#1a1210;
    --frame:#0c0b09; --mat:#2a261f; --chip:#2e2922; --danger:#ef7d6e; --ok:#86c493; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-family:var(--serif);font-size:1.25rem;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand small{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-size:.9rem}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:20px 0 80px}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.hero{padding:18px 0 22px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.hero p{color:var(--muted);margin:.4rem 0 0}
.search{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.search input,.search select{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px}
.search select{flex:0 0 auto;max-width:48%}
@media (max-width:520px){#sf input[type=search]{flex-basis:100%} #sf select{flex:1 1 0;max-width:none}}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-top:8px}
.stats b{color:var(--ink);font-family:var(--serif);font-size:1.1rem;font-weight:600;margin-right:4px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;gap:10px}
.section-title h2{font-size:1.35rem}
.section-title span{color:var(--muted);font-size:.85rem}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.hall{position:relative;display:block;text-decoration:none;border-radius:14px;overflow:hidden;background:var(--frame);aspect-ratio:4/3;box-shadow:var(--shadow)}
.hall img{width:100%;height:100%;object-fit:cover;opacity:.72;transition:transform .5s,opacity .3s}
.hall:hover img{transform:scale(1.04);opacity:.6}
.hall .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4rem;opacity:.35}
.hall .label{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hall .label h3{font-size:1.3rem}
.hall .label span{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:block;text-decoration:none;min-width:0}
.frame{background:var(--frame);padding:7px;border-radius:4px;box-shadow:var(--shadow)}
.matte{background:var(--mat);padding:8px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.matte img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px;padding:8px}
.placeholder .em{font-size:2.4rem;opacity:.7}
.placeholder .t{font-family:var(--serif);font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plaque{padding:9px 2px 0}
.plaque .t{font-family:var(--serif);font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plaque .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#c8962c}
.halls.arranging .hall{touch-action:none;cursor:grab;outline:2px dashed var(--accent);outline-offset:3px;animation:wob .35s ease-in-out infinite alternate}
.halls.arranging .hall:nth-child(2n){animation-delay:.15s}
.halls.arranging .hall.dragging{opacity:.75;transform:scale(1.04);animation:none;z-index:2;cursor:grabbing}
@keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
@media (prefers-reduced-motion: reduce){.halls.arranging .hall{animation:none}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.savebar .wrap{display:flex;gap:8px;align-items:center}
form.edit{padding-bottom:84px}
/* compact view */
.sizer{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.sizer button{border:none;background:none;padding:5px 11px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.sizer button.on{background:var(--ink);color:var(--bg)}
.dense .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.dense .frame{padding:3px;border-radius:3px}
.dense .matte{padding:3px}
.dense .plaque{padding-top:5px}
.dense .plaque .t{font-size:.78rem;-webkit-line-clamp:1}
.dense .plaque .s{font-size:.68rem}
.dense .placeholder .em{font-size:1.5rem}
.dense .placeholder .t{display:none}
.dense .halls,.listview .halls{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dense .hall,.listview .hall{aspect-ratio:16/9;border-radius:10px}
.dense .hall .label,.listview .hall .label{padding:8px 10px}
.dense .hall .label h3,.listview .hall .label h3{font-size:.95rem}
.dense .hall .label span,.listview .hall .label span{font-size:.62rem}
.dense .hall .ph,.listview .hall .ph{font-size:2.2rem}
@media (max-width:520px){
  .dense .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .dense .plaque .s{display:none}
  .dense .halls,.listview .halls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
/* list view */
.card .meta{display:none}
.listview .grid{display:flex;flex-direction:column;gap:0}
.listview .card{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.listview .card:hover{background:var(--surface)}
.listview .frame{flex:0 0 52px;padding:2px;border-radius:3px;box-shadow:none}
.listview .matte{padding:2px}
.listview .placeholder .t{display:none}
.listview .placeholder .em{font-size:1.3rem}
.listview .plaque{padding:0;flex:1;min-width:0}
.listview .plaque .t{-webkit-line-clamp:1;font-size:.95rem}
.listview .card .meta{display:block;flex:0 1 40%;min-width:0;text-align:right;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.listview .card .meta{flex-basis:34%}}
.grouphead{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink);scroll-margin-top:70px}
.groupbar{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}
.groupbar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:30px;height:28px;padding:0 6px;font-size:.78rem;cursor:pointer}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.filters label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;min-width:0}
.filters .check{flex-direction:row;font-size:.85rem;color:var(--ink);align-self:end;height:36px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* item */
.item{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:820px){.item{grid-template-columns:minmax(0,1fr);gap:18px}}
.viewer .frame{padding:10px}
.viewer .matte{aspect-ratio:auto;min-height:260px;max-height:70vh;padding:14px;cursor:zoom-in}
.viewer .matte img{max-height:calc(70vh - 28px)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}
.thumbs button{flex:0 0 64px;height:64px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:var(--mat);cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.crumbs a{text-decoration:none}
.item h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.15}
.item .by{color:var(--muted);margin:.35rem 0 1rem;font-size:1.02rem}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;border-top:1px solid var(--line);padding-top:14px}
dl.facts dt{color:var(--muted);font-size:.85rem;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.docs{display:grid;gap:8px;margin-top:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-decoration:none;cursor:pointer;text-align:left;width:100%}
.doc .ic{font-size:1.3rem}
.doc .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:520px){.brand small{display:none} #privBtn .lbl{font-size:.85rem}}
.hidden-val{letter-spacing:.2em;color:var(--muted)}
/* forms */
form.edit{max-width:760px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.8rem;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 11px;min-width:0;width:100%}
.f textarea{min-height:110px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 16px}
legend{font-family:var(--serif);font-weight:600;padding:0 6px}
.media-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.mtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);font-size:.78rem}
.mtile .im{aspect-ratio:1/1;background:var(--mat);display:flex;align-items:center;justify-content:center;font-size:2rem}
.mtile .im img{width:100%;height:100%;object-fit:cover}
.mtile .row{display:flex;gap:4px;padding:6px;align-items:center}
.mtile input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);font-size:.78rem}
.mtile button{border:none;background:none;cursor:pointer;padding:2px 4px;font-size:.95rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
/* overlay */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.96);display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox img.zoom{max-width:none;max-height:none;width:auto}
.lightbox .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:2}
.scanner{position:fixed;inset:0;z-index:52;background:#000;display:flex;flex-direction:column;color:#fff}
.scanner video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.scanner .aim{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.scanner .bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;flex-direction:column;gap:10px}
.scanner .bar form{display:flex;gap:8px}
.scanner .bar input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;padding:0 12px}
.scanner .msg{font-size:.92rem;color:#ddd}
.found{border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.found img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:var(--mat)}
.found .grow{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--surface);padding:14px 18px;border-radius:12px;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:6px}
.panel p{margin:.4rem 0;color:var(--muted);font-size:.92rem}
.panel code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:.85rem;overflow-wrap:anywhere}
ol.steps{padding-left:20px;margin:.5rem 0;font-size:.92rem}
ol.steps li{margin:.3rem 0}
.fabs{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:10px}
.fab.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fab{height:54px;padding:0 20px;border-radius:999px;border:none;background:var(--accent);color:var(--accent-ink);font-size:1rem;box-shadow:var(--shadow);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
/* report */
table.report{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:20px}
table.report th,table.report td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.report td.n,table.report th.n{text-align:right;white-space:nowrap}
.report-wrap{overflow-x:auto}
@media print{header.top,.fabs,.noprint{display:none!important} body{background:#fff;color:#000} main{padding:0}}
/* Gallery mode: framed pieces on a dark, spotlit wall */
body.wallmode{overflow:hidden}
body.wallmode header.top,body.wallmode .fabs{display:none}
.wall{position:fixed;inset:0;z-index:30;background:#24201b linear-gradient(180deg,#1b1815 0%,#2b2620 55%,#1f1b17 100%);color:#efe6d6;overflow:hidden;font-family:var(--serif)}
.wall .floor{position:absolute;left:0;right:0;bottom:0;height:11vh;background:linear-gradient(180deg,#120f0c 0,#120f0c 6px,#3a2a1c 6px,#2a1e14 40%,#1a130d 100%);pointer-events:none}
.wall .floor::before{content:"";position:absolute;left:0;right:0;top:-3px;height:3px;background:#0c0a08}
.wbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));font-family:var(--sans);font-size:.9rem;transition:opacity .4s}
.wall.quiet .wbar,.wall.quiet .wnav{opacity:0;pointer-events:none}
.wbar .wtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);font-size:1.05rem;letter-spacing:.04em}
.wbtn,.wbar select{height:36px;min-width:36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(20,17,14,.6);color:#f3ead9;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;font-size:.88rem}
.wbar select{appearance:none;-webkit-appearance:none;padding-right:12px}
.wbtn{white-space:nowrap}

@media (max-width:420px){.wbar{gap:5px;padding-left:8px;padding-right:8px}.wbtn,.wbar select{padding:0 8px;font-size:.8rem;min-width:32px}.wbar .wcount{font-size:.8rem}}
.wbtn.on{background:rgba(201,162,74,.28);border-color:rgba(233,196,110,.6)}
.wbar .wcount{color:#bfb4a2;font-variant-numeric:tabular-nums;white-space:nowrap}
.wtrack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wtrack::-webkit-scrollbar{display:none}
.bay{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.5vh,34px);padding:calc(64px + env(safe-area-inset-top)) 18px calc(13vh + env(safe-area-inset-bottom));position:relative;
  background:radial-gradient(ellipse 42% 58% at 50% 34%,rgba(255,226,170,.17),rgba(255,226,170,.05) 55%,transparent 75%)}
@media (min-width:900px){.bay{flex-basis:50%}}
.pframe{display:inline-block;padding:clamp(10px,1.6vw,18px);border:none;cursor:zoom-in;border-radius:2px;line-height:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.08),inset 0 0 10px rgba(0,0,0,.55),0 24px 50px rgba(0,0,0,.7),0 6px 14px rgba(0,0,0,.5)}
.pmat{display:inline-block;padding:clamp(14px,3.2vw,40px);background:#f2ecdf;box-shadow:inset 0 2px 6px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.12)}
.pmat img{display:block;max-width:min(78vw,640px);max-height:calc(100svh - 64px - 13vh - 210px);min-width:60px;min-height:60px;object-fit:contain;box-shadow:0 0 0 2px #fbf8f1,0 0 0 3px rgba(0,0,0,.18),1px 2px 5px rgba(0,0,0,.25)}
@supports not (height:100svh){.pmat img{max-height:calc(100vh - 64px - 13vh - 210px)}}
@media (min-width:900px){.pmat img{max-width:min(36vw,560px)}}
.pmat img:not([src]){width:min(52vw,300px);height:min(40vh,360px);background:#ddd4c3}
.placard{display:block;max-width:min(86vw,340px);background:#f5f0e6;color:#231e18;text-decoration:none;padding:10px 14px 11px;border-radius:2px;box-shadow:0 6px 16px rgba(0,0,0,.55);text-align:left}
.placard .pt{font-weight:600;font-size:1rem;line-height:1.25}
.placard .pm{font-style:italic;color:#4a4136;font-size:.88rem;margin-top:2px}
.placard .pf{font-family:var(--sans);font-size:.74rem;color:#62584b;margin-top:6px;letter-spacing:.01em}
.placard .pmore{font-family:var(--sans);font-size:.7rem;color:#8a2b1d;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.wnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(20,17,14,.55);color:#f3ead9;font-size:1.6rem;line-height:1;cursor:pointer;transition:opacity .4s}
.wbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:4;width:84px;height:84px;border-radius:999px;border:none;background:rgba(10,8,6,.62);color:#fff;font-size:1.9rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.wall.peek .wbig{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.wnav.prev{left:12px}.wnav.next{right:12px}
@media (hover:none){.wnav{display:none}}
.wempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-size:1.1rem}
.wallbtn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.88rem;white-space:nowrap}
.copyrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.copyrow:first-of-type{border-top:none}
.copyrow b{font-family:var(--serif);font-size:.92rem;white-space:nowrap}
.copyrow input{min-width:0;width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface)}
.copyrow input.cn{grid-column:2 / span 2}
.copylist{list-style:none;margin:8px 0 0;padding:0}
.copylist li{padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.copylist li .cm{color:var(--muted);font-size:.85rem}
.pedit{position:fixed;inset:0;z-index:52;background:#111;color:#f3ede2;display:flex;flex-direction:column}
.pe-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.pe-top .iconbtn:not(.primary){background:#222;color:#fff;border-color:#444}
.pe-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.pe-wrap{position:relative}
.pe-wrap canvas{width:100%;height:100%;display:block}
.pe-crop{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:2px solid #fff;cursor:move;touch-action:none;
  background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35));
  background-size:100% 1px,100% 1px,1px 100%,1px 100%;background-position:0 33.3%,0 66.6%,33.3% 0,66.6% 0;background-repeat:no-repeat}
.pe-crop i{position:absolute;width:28px;height:28px;border:4px solid #fff;touch-action:none}
.pe-crop i[data-h=nw]{left:-6px;top:-6px;border-right:none;border-bottom:none;cursor:nwse-resize}
.pe-crop i[data-h=ne]{right:-6px;top:-6px;border-left:none;border-bottom:none;cursor:nesw-resize}
.pe-crop i[data-h=sw]{left:-6px;bottom:-6px;border-right:none;border-top:none;cursor:nesw-resize}
.pe-crop i[data-h=se]{right:-6px;bottom:-6px;border-left:none;border-top:none;cursor:nwse-resize}
.pe-tools{padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:#1a1a1a;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.pe-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pe-tools .iconbtn{background:#262626;color:#fff;border-color:#444}
.pe-hint{color:#9a958c;font-size:.8rem}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ccgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left}
.ccgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--mat)}
.ccgrid span{font-size:.72rem;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Phone on its side: picture on the left, placard on the right, using the full height. */
@media (orientation:landscape) and (max-height:560px){
  .wbar{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
  .wbtn,.wbar select{height:32px}
  .bay{flex-basis:100%;flex-direction:row;gap:clamp(18px,4vw,40px);padding:46px calc(64px + env(safe-area-inset-right)) calc(8vh + 6px) calc(64px + env(safe-area-inset-left));
    background:radial-gradient(ellipse 40% 75% at 42% 40%,rgba(255,226,170,.17),rgba(255,226,170,.05) 55%,transparent 75%)}
  .wall .floor{height:8vh}
  .pframe{padding:clamp(8px,1.4vw,14px)}
  .pmat{padding:clamp(10px,2vw,22px)}
  .pmat img{max-height:calc(100svh - 46px - 8vh - 14px - 2*clamp(8px,1.4vw,14px) - 2*clamp(10px,2vw,22px));max-width:calc(100vw - 128px - 220px - 4vw)}
  .pmat img:not([src]){height:calc(100svh - 46px - 8vh - 80px);width:calc((100svh - 140px) * .8)}
  .placard{flex:0 0 auto;width:clamp(150px,24vw,240px)}
  .wnav{width:40px;height:40px}
}

/* ---- Gallery mode rooms ---- */

.bay>*{position:relative;z-index:1}

@keyframes hum{0%,100%{opacity:.75}50%{opacity:1}}
/* Museum (default) */
.wall.r-museum .pframe{background:linear-gradient(135deg,#7d5716 0%,#e9c46e 18%,#a87a26 36%,#f6dc93 52%,#9c6f20 70%,#dcb45d 86%,#6f4c12 100%)}

/* ============================================================
   Storage: on-device (IndexedDB) and Dropbox (App folder)
   ============================================================ */
class LocalStore {
  constructor(){ this.kind="local"; this.urls=new Map(); }
  db(){
    if(this._db) return this._db;
    this._db = new Promise((res,rej)=>{
      const r = indexedDB.open("collection-museum",1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("files"); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  }
  async tx(store, mode, fn){
    const db = await this.db();
    return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); });
  }
  async load(){ return (await this.tx("kv","readonly",s=>s.get("catalog"))) || null; }
  async save(cat){ await this.tx("kv","readwrite",s=>s.put(cat,"catalog")); }
  async putFile(path, blob){ await this.tx("files","readwrite",s=>s.put(blob,path)); }
  async deleteFile(path){ this.urls.delete(path); await this.tx("files","readwrite",s=>s.delete(path)); }
  async getBlob(path){ return await this.tx("files","readonly",s=>s.get(path)); }
  async url(path){
    if(this.urls.has(path)) return this.urls.get(path);
    const b = await this.getBlob(path); if(!b) return null;
    const u = URL.createObjectURL(b); this.urls.set(path,u); return u;
  }
}

class DropboxStore {
  constructor(appKey){ this.kind="dropbox"; this.appKey=appKey; this.rev=null; this.links=new Map(Object.entries(LS.get("cm.links",{}))); }
  static redirectUri(){ return location.origin + location.pathname; }
  static b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  static standalone(){ return navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }
  // Prepared ahead of the tap: iPhone home-screen apps ignore navigation that happens after an await.
  static async prepare(){
    const verifier = DropboxStore.b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = DropboxStore.b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    return {verifier, challenge, state:uid()};
  }
  static authUrl(appKey, pre, manual){
    const q = new URLSearchParams({client_id:appKey, response_type:"code", code_challenge:pre.challenge, code_challenge_method:"S256", token_access_type:"offline"});
    if(!manual){ q.set("redirect_uri", DropboxStore.redirectUri()); q.set("state", pre.state); }
    return "https://www.dropbox.com/oauth2/authorize?" + q;
  }
  static remember(appKey, pre, manual){ LS.set("cm.pkce", {verifier:pre.verifier, state:pre.state, appKey, manual:!!manual}); }
  static async exchange(code, saved, withRedirect){
    const body = {code, grant_type:"authorization_code", code_verifier:saved.verifier, client_id:saved.appKey};
    if(withRedirect) body.redirect_uri = DropboxStore.redirectUri();
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams(body)});
    if(!r.ok){ const t = await r.text().catch(()=> ""); authLog("sign-in exchange failed " + r.status + " " + t.slice(0,120)); throw new Error("Dropbox sign-in failed (" + r.status + "). Please try again."); }
    const j = await r.json();
    LS.set("cm.dropbox", {appKey:saved.appKey, refresh:j.refresh_token, access:j.access_token, exp:Date.now()+(j.expires_in-60)*1000, since:new Date().toISOString()});
    LS.set("cm.mode","dropbox"); LS.del("cm.pkce");
    authLog("connected" + (DropboxStore.standalone() ? " (home-screen app)" : " (browser)"));
  }
  static async finishManual(code){
    const saved = LS.get("cm.pkce", null);
    if(!saved) throw new Error("Please tap “Connect Dropbox” again first.");
    await DropboxStore.exchange(code.trim(), saved, false);
  }
  static async finishAuth(){
    const p = new URLSearchParams(location.search);
    if(!p.has("code") && !p.has("error")) return false;
    history.replaceState(null, "", location.pathname + location.hash);
    if(p.has("error")) throw new Error("Dropbox sign-in was cancelled.");
    const saved = LS.get("cm.pkce", null);
    if(!saved){ authLog("sign-in returned but no pending sign-in on this device"); throw new Error("Dropbox sign-in could not be finished here. Please tap Connect Dropbox again."); }
    // PKCE ties the code to this device's secret, so a code from another sign-in simply fails to exchange.
    if(saved.state !== p.get("state")) authLog("state differs (" + (p.get("state") ? "other" : "none") + ", " + (saved.manual ? "manual" : "redirect") + "); trying anyway");
    try{ await DropboxStore.exchange(p.get("code"), saved, true); }
    catch(e){ await DropboxStore.exchange(p.get("code"), saved, false); }
    return true;
  }
  async token(){
    const a = LS.get("cm.dropbox", null);
    if(!a) throw new Error("Not connected to Dropbox.");
    if(a.access && a.exp > Date.now()) return a.access;
    if(this._refreshing) return this._refreshing;
    this._refreshing = (async () => {
      let r;
      try{ r = await fetch("https://api.dropboxapi.com/oauth2/token", {method:"POST", body:new URLSearchParams({grant_type:"refresh_token", refresh_token:a.refresh, client_id:a.appKey})}); }
      catch(e){ throw new Error("Couldn't reach Dropbox. Check your connection and try again."); }
      if(!r.ok){
        const j = await r.json().catch(()=>({}));
        authLog("refresh failed " + r.status + " " + (j.error || "") + " " + (j.error_description || ""));
        if(j.error === "invalid_grant"){ LS.del("cm.dropbox"); const e = new Error("Dropbox sign-in expired or was revoked. Please reconnect in Settings."); e.signedOut = true; throw e; }
        throw new Error("Dropbox is having trouble right now (" + r.status + "). Please try again in a minute.");
      }
      const j = await r.json(); a.access=j.access_token; a.exp=Date.now()+(j.expires_in-60)*1000; LS.set("cm.dropbox",a); return a.access;
    })();
    try{ return await this._refreshing; } finally{ this._refreshing = null; }
  }
  static arg(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0")); }
  async rpc(endpoint, body){
    const r = await fetch("https://api.dropboxapi.com/2/" + endpoint, {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary || "conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox error " + r.status);
    return r.json();
  }
  async upload(path, blob, mode){
    const r = await fetch("https://content.dropboxapi.com/2/files/upload", {method:"POST", headers:{Authorization:"Bearer " + await this.token(),
      "Content-Type":"application/octet-stream", "Dropbox-API-Arg":DropboxStore.arg({path, mode: mode || "overwrite", autorename:false, mute:true})}, body:blob});
    if(r.status===409){ const e = await r.json().catch(()=>({})); const err = new Error(e.error_summary||"conflict"); err.summary = e.error_summary||""; throw err; }
    if(!r.ok) throw new Error("Dropbox upload failed (" + r.status + ")");
    return r.json();
  }
  async load(){
    let meta;
    try{ meta = await this.rpc("files/get_metadata", {path:"/catalog.json"}); }
    catch(e){ if((e.summary||"").includes("not_found")) { this.rev=null; return null; } throw e; }
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/catalog.json"})}});
    if(!r.ok) throw new Error("Could not read your catalog from Dropbox (" + r.status + ")");
    this.rev = meta.rev;
    return JSON.parse(await r.text());
  }
  async save(cat){
    const blob = new Blob([JSON.stringify(cat, null, 1)], {type:"application/json"});
    try{
      const m = await this.upload("/catalog.json", blob, this.rev ? {".tag":"update", update:this.rev} : {".tag":"add"});
      this.rev = m.rev;
    }catch(e){
      if((e.summary||"").includes("conflict")) throw new Error("Your catalog was changed on another device. Reload the page to get the latest, then redo this change.");
      throw e;
    }
  }
  async putFile(path, blob){ await this.upload("/" + path, blob, "overwrite"); }
  async deleteFile(path){ this.links.delete(path); try{ await this.rpc("files/delete_v2", {path:"/" + path}); }catch(e){ if(!(e.summary||"").includes("not_found")) throw e; } }
  async getBlob(path){
    const r = await fetch("https://content.dropboxapi.com/2/files/download", {method:"POST", headers:{Authorization:"Bearer " + await this.token(), "Dropbox-API-Arg":DropboxStore.arg({path:"/" + path})}});
    return r.ok ? r.blob() : null;
  }
  async url(path){
    const c = this.links.get(path);
    if(c && c.exp > Date.now()) return c.link;
    try{
      const j = await this.rpc("files/get_temporary_link", {path:"/" + path});
      this.links.set(path, {link:j.link, exp:Date.now() + 3.5*3600*1000});
      clearTimeout(this._lt); this._lt = setTimeout(()=>LS.set("cm.links", Object.fromEntries(this.links)), 500);
      return j.link;
    }catch{ return null; }
  }
}

/* Drag to reorder galleries on the front page */
function arrangeHalls(){
  const grid = document.getElementById("halls"), link = document.getElementById("arrange");
  if(grid.classList.contains("arranging")){
    const order = [...grid.querySelectorAll(".hall")].map(h => h.dataset.id);
    const before = cat.collections.slice(), was = cat.arranged;
    cat.collections.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id)); cat.arranged = true;
    persist().then(()=>toast("Order saved")).catch(e => { cat.collections = before; cat.arranged = was; alert(e.message); });
    grid.classList.remove("arranging"); link.textContent = "Arrange";
    document.querySelector(".fabs")?.style.removeProperty("display");
    return;
  }
  grid.classList.add("arranging"); link.textContent = "Done";
  const fabs = document.querySelector(".fabs"); if(fabs) fabs.style.display = "none";
  toast("Drag galleries into the order you like, then tap Done", 3500);
  let drag = null;
  const move = e => {
    if(!drag) return;
    e.preventDefault();
    const over = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList && el.classList.contains("hall") && el !== drag);
    if(over){ const r = over.getBoundingClientRect(), y = (e.clientY - r.top) / r.height, x = (e.clientX - r.left) / r.width;
      grid.insertBefore(drag, (y > .5 || (y > .2 && x > .5)) ? over.nextSibling : over); }
    if(e.clientY < 70) window.scrollBy(0, -14); else if(e.clientY > innerHeight - 70) window.scrollBy(0, 14);
  };
  const up = () => { if(drag){ drag.classList.remove("dragging"); drag = null; } };
  if(!grid._wired){ grid._wired = true;
    window.addEventListener("pointermove", move, {passive:false});
    window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  }
  grid.querySelectorAll(".hall").forEach(h => {
    h.addEventListener("click", e => { if(grid.classList.contains("arranging")) e.preventDefault(); });
    h.addEventListener("dragstart", e => e.preventDefault());
    h.addEventListener("pointerdown", e => {
      if(!grid.classList.contains("arranging")) return;
      e.preventDefault(); drag = h; h.classList.add("dragging");
    });
  });
}

const mediaUrl = path => /^https?:\/\//.test(path) ? Promise.resolve(path) : store.url(path);
/* Resolve <img data-path> after rendering */
/* Images load as they scroll near the screen, so big galleries stay quick. */
const imgQueue = []; let imgActive = 0;
function pumpImages(){
  while(imgActive < 6 && imgQueue.length){
    const el = imgQueue.shift(); if(!el.isConnected) continue; imgActive++;
    mediaUrl(el.dataset.path).then(u => { if(u) el.src = u; else el.replaceWith(Object.assign(document.createElement("span"),{textContent:"🖼️"})); })
      .catch(()=>{}).finally(() => { imgActive--; pumpImages(); });
  }
}
const imgObserver = "IntersectionObserver" in window ? new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting){ imgObserver.unobserve(e.target); imgQueue.push(e.target); pumpImages(); } }), {rootMargin:"800px 0px"}) : null;
async function hydrate(root){
  root.querySelectorAll("img[data-path]").forEach(el => { if(imgObserver) imgObserver.observe(el); else { imgQueue.push(el); } });
  pumpImages();
}

function plate(it){
  const c = coll(it.collectionId), m = cover(it);
  const inner = m ? `<img alt="${esc(it.title)}" data-path="${esc(m.thumb||m.path)}" loading="lazy">`
    : `<div class="placeholder"><div class="em">${c.icon}</div><div class="t">${esc(it.title)}</div></div>`;
  const isf = issueField(c), iss = isf && (it.fields||{})[isf.k];
  const shown = iss && !/#/.test(it.title||"") ? it.title + " #" + iss : it.title;
  const sub = [it.maker, it.year].filter(Boolean).join(" · ");
  const meta = c.fields.filter(f => !(priv && f.priv) && (it.fields||{})[f.k]).slice(0,2).map(f => it.fields[f.k]).concat(it.qty > 1 ? ["×" + it.qty] : [], it.condition ? [it.condition] : [], !priv && it.value ? [money(it.value)] : []);
  return `<a class="card" href="#/i/${it.id}"><div class="frame"><div class="matte">${inner}</div></div>
    <div class="plaque"><div class="t">${it.favorite?'<span class="star">★</span> ':""}${esc(shown)}</div><div class="s">${esc(sub)||"&nbsp;"}</div></div><div class="meta">${esc(meta.join(" · "))}</div></a>`;
}

function matches(it, q){
  if(!q) return true;
  const c = coll(it.collectionId);
  const hay = [it.title, it.maker, it.year, it.barcode, it.location, it.notes, it.condition, it.source, c.name, ...(it.tags||[]), ...(it.extra||[]).map(x=>x.v), ...(it.copies||[]).flatMap(x=>[x.condition, x.location, x.note]),
    ...Object.entries(it.fields||{}).filter(([k])=>!priv || !(c.fields.find(f=>f.k===k)||{}).priv).map(([,v])=>v)].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
const conditionList = () => CONDITIONS.concat(((cat && cat.settings)||{}).conditions || []);
const condRank = c => { const i = conditionList().findIndex(x => x.toLowerCase() === String(c||"").toLowerCase()); return i < 0 ? (c ? 50 : 99) : i; };
const sortKey = t => String(t||"").replace(/^(the|a|an)\s+/i, "").trim();
function sortItems(list, how){
  const by = {
    recent:(a,b)=> (b.created||"").localeCompare(a.created||""),
    title:(a,b)=> sortKey(a.title).localeCompare(sortKey(b.title), undefined, {numeric:true, sensitivity:"base"}),
    maker:(a,b)=> (!a.maker - !b.maker) || sortKey(a.maker).localeCompare(sortKey(b.maker), undefined, {sensitivity:"base"}) || sortKey(a.title).localeCompare(sortKey(b.title), undefined, {numeric:true}),
    year:(a,b)=> (parseInt(a.year)||9999) - (parseInt(b.year)||9999) || (a.title||"").localeCompare(b.title||""),
    yeard:(a,b)=> (parseInt(b.year)||0) - (parseInt(a.year)||0) || (a.title||"").localeCompare(b.title||""),
    condition:(a,b)=> condRank(a.condition) - condRank(b.condition) || (a.title||"").localeCompare(b.title||""),
    updated:(a,b)=> (b.updated||"").localeCompare(a.updated||""),
    value:(a,b)=> (+b.value||0) - (+a.value||0),
  }[how] || (()=>0);
  return [...list].sort(by);
}

  const fsel = {}; c.fields.forEach(f => { const v = params.get("f." + f.k); if(v && !(priv && f.priv)) fsel[f.k] = v; });

  const link = (o) => { const p = new URLSearchParams({...state, ...o}); [...p.keys()].forEach(k=>{ if(!p.get(k)) p.delete(k); }); return "#/c/"+id+(p.toString()?"?"+p:""); };
  // Filter choices come from what's actually in this gallery.

  const conds = distinct(i => i.condition).sort((a,b) => condRank(a) - condRank(b));

  const active = [fav && ["★ Highlights", {fav:""}], nophoto && ["Missing photos", {nophoto:""}], unmatched && ["Not matched yet", {unmatched:""}], cond && ["Condition: " + cond, {cond:""}],
    ...Object.entries(fsel).map(([k,v]) => [(c.fields.find(f=>f.k===k)||{}).l + ": " + v, {["f." + k]:""}]), tag && ["Tag: " + tag, {tag:""}]].filter(Boolean);
  const showFilters = params.get("filters") === "1";
  // Group headers: letters for names, decades for years, grades for condition.

  const grouped = groups.length > 1 && list.length >= 12 && groups[0].g !== null;
  const sorts = [["title","Title (A–Z)"],["maker",c.maker||"Maker"],["year","Year (oldest)"],["yeard","Year (newest)"],["recent","Recently added"],["updated","Recently edited"],["condition","Condition"]].concat(priv?[]:[["value","Value (highest)"]]);
  app.innerHTML = `<div class="crumbs" style="display:flex;justify-content:space-between;gap:8px"><span><a href="#/">Museum</a> › ${esc(c.name)}</span><a href="#/gallery/${c.id}">✎ Edit gallery</a></div>
  <section class="hero" style="padding-top:4px;padding-bottom:10px"><h1>${c.icon} ${esc(c.name)}</h1>

    <form class="search" id="sf"><input type="search" name="q" placeholder="Search ${esc(c.name.toLowerCase())}…" value="${esc(q)}" aria-label="Search">
      <select name="sort" aria-label="Sort">${sorts.map(([v,l])=>`<option value="${v}" ${v===sort?"selected":""}>Sort: ${esc(l)}</option>`).join("")}</select>
      <a class="iconbtn" href="${link({filters:showFilters?"":"1"})}" style="height:42px" aria-expanded="${showFilters}">⚲ Filter${active.length ? " (" + active.length + ")" : ""}</a></form>
    ${showFilters ? `<div class="filters" id="filt">
      ${conds.length ? `<label>Condition<select data-p="cond"><option value="">Any</option>${conds.map(v=>`<option ${v===cond?"selected":""}>${esc(v)}</option>`).join("")}</select></label>` : ""}
      ${ffields.map(({f,vals}) => `<label>${esc(f.l)}<select data-p="f.${f.k}"><option value="">Any</option>${vals.map(v=>`<option ${v===fsel[f.k]?"selected":""}>${esc(v)}</option>`).join("")}</select></label>`).join("")}
      ${tags.length ? `<label>Tag<select data-p="tag"><option value="">Any</option>${tags.map(v=>`<option ${v===tag?"selected":""}>${esc(v)}</option>`).join("")}</select></label>` : ""}
      <label class="check"><input type="checkbox" data-c="fav" ${fav?"checked":""}> ★ Highlights only</label>
      <label class="check"><input type="checkbox" data-c="nophoto" ${nophoto?"checked":""}> Missing photos</label>
      ${lookupKind(c) !== "none" ? `<label class="check"><input type="checkbox" data-c="unmatched" ${unmatched?"checked":""}> Not matched yet</label>` : ""}
    </div>` : ""}
    ${active.length ? `<div class="chips" style="margin-top:10px">${active.map(([l,o]) => `<a class="chip on" href="${link(o)}">${esc(l)} ✕</a>`).join("")}${active.length > 1 ? `<a class="chip" href="#/c/${id}?sort=${sort}${showFilters?"&filters=1":""}">Clear all</a>` : ""}</div>`
      : (!showFilters && tags.length ? `<div class="chips" style="margin-top:8px">${tags.slice(0,12).map(t=>`<a class="chip" href="${link({tag:t})}">${esc(t)}</a>`).join("")}</div>` : "")}
    ${grouped && groups.length > 3 ? `<div class="groupbar" aria-label="Jump to">${groups.map((g,n) => `<button type="button" data-jump="${n}">${esc(g.g)}</button>`).join("")}</div>` : ""}
  </section>
  ${lookupKind(c) !== "none" && list.some(i => !isMatched(i)) && (unmatched || showFilters) ? `<div class="banner noprint"><span>🔎</span><div class="grow">${list.filter(i => !isMatched(i)).length} piece${list.filter(i => !isMatched(i)).length===1?"":"s"} here not matched to ${esc(lookupName(lookupKind(c)))} yet. Go through them one by one; anything you've already typed is kept.</div><button class="iconbtn primary" id="bulkMatch">Match them</button></div>` : ""}
  ${!list.length ? `<div class="empty">${all.length ? "Nothing matches these filters." : "This gallery is empty. Add the first piece!"}</div>`
    : grouped ? groups.map((g,n) => `<h3 class="grouphead" id="grp${n}">${esc(g.g)} <span style="color:var(--muted);font-family:var(--sans);font-size:.75rem;font-weight:400">${g.items.length}</span></h3><div class="grid">${g.items.map(plate).join("")}</div>`).join("")
    : `<div class="grid">${list.map(plate).join("")}</div>`}
  <div class="fabs"><a class="fab ghost" href="#/new?scan=1&c=${id}">▦ Scan</a><a class="fab" href="#/new?c=${id}">＋ Add</a></div>`;
  const f = document.getElementById("sf");
  f.onsubmit = e => { e.preventDefault(); location.hash = link({q:new FormData(f).get("q").trim(), filters:showFilters?"1":""}); };
  f.sort.onchange = () => { LS.set("cm.sort."+id, f.sort.value); location.hash = link({sort:f.sort.value, q:new FormData(f).get("q").trim(), filters:showFilters?"1":""}); };
  app.querySelectorAll("#filt [data-p]").forEach(sel => sel.onchange = () => { location.hash = link({[sel.dataset.p]:sel.value, filters:"1"}); });
  app.querySelectorAll("#filt [data-c]").forEach(cb => cb.onchange = () => { location.hash = link({[cb.dataset.c]:cb.checked?"1":"", filters:"1"}); });
  if(document.getElementById("bulkMatch")) document.getElementById("bulkMatch").onclick = () => {
    const queue = list.filter(i => !isMatched(i)); let n = 0, done = 0;
    const next = () => {
      if(n >= queue.length){ toast("Matched " + done + " of " + queue.length); route(); return; }
      const it = queue[n++];
      matchSaved(it, {label:"Match " + n + " of " + queue.length + ": " + it.title, after:() => { done++; next(); }, onSkip:next});
    };
    next();
  };
  app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => document.getElementById("grp" + b.dataset.jump).scrollIntoView({behavior:"smooth"}));
  hydrate(app);

/* ---------- Gallery mode: the pieces hung on a dark, spotlit wall ---------- */
const hallOrder = {};
const tourSecs = () => { const v = +LS.get("cm.tourSecs", 8); return [3,5,8,12,20,30,60].includes(v) ? v : 8; };
const ROOMS = [["museum","🏛 Museum"],["modern","⬜ Modern gallery"],["library","📚 Library"],["castle","🏰 Castle"],["haunted","👻 Haunted mansion"],["cabin","🪵 Cabin"],["greenhouse","🌿 Greenhouse"],["aquarium","🐠 Aquarium"],["diner","🍒 50s diner"],["ship","🚀 Starship"],["neon","🌃 Neon arcade"]];
function viewWall(id, params){
  const c = coll(id); if(!c) return notFound();
  document.title = c.name + " · Gallery mode";
  document.body.classList.add("wallmode");
  const byId = new Map(cat.items.map(i => [i.id, i]));
  let pieces = (hallOrder[id] || []).map(x => byId.get(x)).filter(i => i && i.collectionId === id && cover(i));
  if(!pieces.length) pieces = sortItems(cat.items.filter(i => i.collectionId === id && cover(i)), LS.get("cm.sort."+id, "title"));
  // Shuffle: a seeded order kept in the address, so coming back from a piece keeps the same shuffle.
  const shuffle = LS.get("cm.wallShuffle", false);
  let seed = shuffle ? (parseInt(params.get("s"), 10) || Math.floor(Math.random() * 1e9) + 1) : 0;
  if(seed){ let x = seed; const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
    pieces = pieces.slice(); for(let i = pieces.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; } }
  const room = ROOMS.some(r => r[0] === c.room) ? c.room : "museum";
  const isf = issueField(c);
  const placard = it => {
    const iss = isf && (it.fields||{})[isf.k];
    const t = iss && !/#/.test(it.title||"") ? it.title + " #" + iss : it.title;
    const facts = c.fields.filter(f => f !== isf && !(priv && f.priv) && (it.fields||{})[f.k]).slice(0,3).map(f => it.fields[f.k]);
    return `<a class="placard" href="#/i/${it.id}"><div class="pt">${it.favorite?"★ ":""}${esc(t||"Untitled")}</div>
      ${[it.maker, it.year].filter(Boolean).length ? `<div class="pm">${esc([it.maker, it.year].filter(Boolean).join(", "))}</div>` : ""}
      ${facts.length ? `<div class="pf">${esc(facts.join(" · "))}</div>` : ""}<div class="pmore">Details ›</div></a>`;
  };
  app.innerHTML = `<div class="wall r-${room}" id="wall">
    <div class="floor"></div>
    <div class="wtrack" id="wtrack">${pieces.map((it,n) => `<section class="bay" data-n="${n}" aria-label="${esc(it.title||"")}">
      <button type="button" class="pframe" data-open="${it.id}" aria-label="View ${esc(it.title||"piece")} full size"><span class="pmat"><img alt="${esc(it.title||"")}" data-wpath="${esc(cover(it).path)}" data-wthumb="${esc(cover(it).thumb||"")}"></span></button>
      ${placard(it)}</section>`).join("")}</div>
    ${pieces.length ? "" : `<div class="wempty"><div>Nothing to hang yet. Gallery mode shows pieces that have a photo.</div><a class="wbtn" href="#/c/${id}">Back to ${esc(c.name)}</a></div>`}
    <div class="wbar"><a class="wbtn" href="#/c/${id}" aria-label="Leave gallery mode" title="Leave gallery mode">✕</a>
      <div class="wtitle">${c.icon} ${esc(c.name)}</div>
      ${pieces.length ? `<select id="wroom" aria-label="Room">${ROOMS.map(([k,l]) => `<option value="${k}" ${k===room?"selected":""}>${l}</option>`).join("")}</select>
      ${pieces.length > 1 ? `<button type="button" class="wbtn${shuffle ? " on" : ""}" id="wshuf" title="${shuffle ? "Shuffle again" : "Shuffle the order"}">🔀</button>${shuffle ? `<button type="button" class="wbtn" id="worder" title="Back to your gallery's order">In order</button>` : ""}` : ""}
      ${pieces.length > 1 ? `<select id="wspeed" aria-label="Tour speed" title="How long the Tour stays on each piece">${[3,5,8,12,20,30,60].map(n => `<option value="${n}" ${n===tourSecs()?"selected":""}>⏱ ${n<60 ? n + "s" : "1 min"}</option>`).join("")}</select>` : ""}
      ${pieces.length > 1 ? `<button type="button" class="wbtn" id="wtour" title="Walk through the gallery on its own">▶ Tour</button>` : ""}
      <span class="wcount" id="wcount"></span>` : ""}</div>
    ${pieces.length > 1 ? `<button type="button" class="wbig" id="wbig" aria-label="Pause">❚❚</button>` : ""}
    ${pieces.length > 1 ? `<button type="button" class="wnav prev" id="wprev" aria-label="Previous piece">‹</button><button type="button" class="wnav next" id="wnext" aria-label="Next piece">›</button>` : ""}
  </div>`;
  if(!pieces.length) return;
  const wall = document.getElementById("wall"), track = document.getElementById("wtrack"), bays = [...track.children];
  const perView = () => Math.max(1, Math.round(track.clientWidth / (bays[0].clientWidth || 1)));
  const current = () => Math.round(track.scrollLeft / (bays[0].clientWidth || 1));
  const loadNear = n => bays.slice(Math.max(0, n - 1), n + perView() + 2).forEach(b => {
    const img = b.querySelector("img"); if(img.dataset.q) return; img.dataset.q = "1";
    const full = () => mediaUrl(img.dataset.wpath).then(u => { if(u) img.src = u; }).catch(()=>{});
    if(img.dataset.wthumb && img.dataset.wthumb !== img.dataset.wpath) mediaUrl(img.dataset.wthumb).then(u => { if(u && !img.src) img.src = u; }).catch(()=>{}).finally(full); else full();
  });
  const show = () => {
    const n = Math.min(current(), bays.length - 1), pv = perView();
    document.getElementById("wcount").textContent = (pv > 1 && n + 1 < bays.length ? (n+1) + "–" + Math.min(n+pv, bays.length) : (n+1)) + " / " + bays.length;
    loadNear(n);
    const q = new URLSearchParams(); if(seed) q.set("s", seed); if(n) q.set("i", n);
    history.replaceState(null, "", "#/wall/" + id + (q.toString() ? "?" + q : ""));
  };
  const go = n => { const w = bays[0].clientWidth; n = Math.max(0, Math.min(n, bays.length - 1)); track.scrollTo({left:n * w, behavior:"smooth"}); };
  let st; track.addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(() => { show(); restartTimer(); }, 90); }, {passive:true});
  const start = Math.min(+params.get("i") || 0, bays.length - 1);
  requestAnimationFrame(() => { track.scrollLeft = start * bays[0].clientWidth; show(); });
  window.addEventListener("resize", function rs(){ if(!wall.isConnected) return window.removeEventListener("resize", rs); track.scrollLeft = current() * bays[0].clientWidth; });
  // Tour: steps to the next piece every few seconds, hides the controls, keeps the screen awake.
  // While it plays, a tap brings the controls back for a few seconds (with a big pause button) instead of stopping it.
  let tour = null, lock = null, peekT = null;
  const tourBtn = document.getElementById("wtour"), bigBtn = document.getElementById("wbig");
  const advance = () => { if(!wall.isConnected) return stopTour(); const n = current() + perView(); go(n >= bays.length ? 0 : n); };
  const restartTimer = () => { if(!tour) return; clearInterval(tour); tour = setInterval(advance, tourSecs() * 1000); };
  const hidePeek = () => { clearTimeout(peekT); wall.classList.remove("peek"); if(tour) wall.classList.add("quiet"); };
  const peek = () => { clearTimeout(peekT); wall.classList.remove("quiet"); wall.classList.add("peek");
    if(bigBtn){ bigBtn.textContent = tour ? "❚❚" : "▶"; bigBtn.setAttribute("aria-label", tour ? "Pause" : "Play"); }
    peekT = setTimeout(hidePeek, 3000); };
  const startTour = () => {
    if(tour) return; if(tourBtn) tourBtn.textContent = "⏸ Pause";
    tour = setInterval(advance, tourSecs() * 1000); hidePeek();
    if(navigator.wakeLock && !lock) navigator.wakeLock.request("screen").then(l => lock = l).catch(()=>{});
  };
  const stopTour = () => { if(!tour) return; clearInterval(tour); tour = null; wall.classList.remove("quiet"); if(tourBtn) tourBtn.textContent = "▶ Tour"; if(lock){ lock.release().catch(()=>{}); lock = null; } };
  if(tourBtn) tourBtn.onclick = e => { e.stopPropagation(); tour ? (stopTour(), peek()) : startTour(); };
  if(bigBtn) bigBtn.onclick = e => { e.stopPropagation(); if(tour){ stopTour(); peek(); } else startTour(); };
  // Taps while the controls are hidden only bring them back.
  wall.addEventListener("click", e => {
    if(!wall.classList.contains("quiet")) return;
    e.preventDefault(); e.stopPropagation(); peek();
  }, true);
  wall.addEventListener("pointerdown", () => { if(wall.classList.contains("peek")){ clearTimeout(peekT); peekT = setTimeout(hidePeek, 3000); } });
  const step = d => { go(current() + d * perView()); restartTimer(); };
  // Diner: the chrome rail sits just above the placards so they never straddle it.
  const placeRail = () => {
    if(!wall.classList.contains("r-diner")) return;
    const top = wall.getBoundingClientRect().top, cards = [...wall.querySelectorAll(".placard")];
    if(!cards.length) return;
    const y = Math.min(...cards.map(p => p.getBoundingClientRect().top - top));
    wall.style.setProperty("--rail", Math.max(80, Math.round(y - 52)) + "px");
  };
  placeRail(); wall.addEventListener("load", placeRail, true);
  window.addEventListener("resize", function pr(){ if(!wall.isConnected) return window.removeEventListener("resize", pr); placeRail(); });
  const sp = document.getElementById("wspeed"); if(sp) sp.onchange = () => LS.set("cm.tourSecs", +sp.value);
  const sh = document.getElementById("wshuf");
  const newShuffle = () => { LS.set("cm.wallShuffle", true); location.hash = "#/wall/" + id + "?s=" + (Math.floor(Math.random() * 1e9) + 1); };
  if(sh) sh.onclick = newShuffle;
  if(document.getElementById("worder")) document.getElementById("worder").onclick = () => { LS.set("cm.wallShuffle", false); location.hash = "#/wall/" + id; };
  if(document.getElementById("wprev")){ document.getElementById("wprev").onclick = () => step(-1); document.getElementById("wnext").onclick = () => step(1); }
  document.getElementById("wroom").onchange = e => {
    const v = e.target.value; ROOMS.forEach(([k]) => wall.classList.remove("r-" + k)); wall.classList.add("r-" + v); placeRail();
    c.room = v; delete c.frame; persist().catch(err => toast("Couldn't save the room choice: " + err.message));
  };
  track.addEventListener("click", e => {
    const b = e.target.closest("[data-open]"); if(!b) return;
    const it = byId.get(b.dataset.open); stopTour(); hidePeek(); mediaUrl(cover(it).path).then(lightbox).catch(()=>{});
  });
  document.addEventListener("keydown", function k(e){
    if(!wall.isConnected) return document.removeEventListener("keydown", k);
    if(document.getElementById("lb")) return;
    if(e.key === "ArrowRight") step(1); else if(e.key === "ArrowLeft") step(-1);
    else if(e.key === " "){ e.preventDefault(); tour ? (stopTour(), peek()) : startTour(); }
    else if(e.key === "Escape"){ stopTour(); location.hash = "#/c/" + id; }
  });
}

function viewItem(id){

async function shrink(file, max, quality){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch{ bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, s = Math.min(1, max / Math.max(w,h));
  const cv = document.createElement("canvas"); cv.width = Math.round(w*s); cv.height = Math.round(h*s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);

}

async function loadBitmap(blob){

  catch{ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("Couldn't open that photo.")); i.src=URL.createObjectURL(blob); }); }

function scaledCanvas(src, max){
  const s = Math.min(1, max / Math.max(src.width, src.height)), c = document.createElement("canvas");
  c.width = Math.round(src.width*s); c.height = Math.round(src.height*s); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c;
}
// Rotate by quarter turns + a small straightening angle; returns the rotated canvas and the biggest clean rectangle inside it.
function rotated(src, quarter, deg){
  const q = ((quarter % 4) + 4) % 4, w0 = q % 2 ? src.height : src.width, h0 = q % 2 ? src.width : src.height;
  const a = Math.abs(deg) * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
  const W = Math.ceil(w0*cos + h0*sin), H = Math.ceil(w0*sin + h0*cos);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,W,H);
  x.translate(W/2, H/2); x.rotate(q*Math.PI/2 + deg*Math.PI/180); x.imageSmoothingQuality = "high";
  x.drawImage(src, -src.width/2, -src.height/2);
  const k = Math.min(w0 / (w0*cos + h0*sin), h0 / (w0*sin + h0*cos));
  const iw = w0*k/W, ih = h0*k/H;
  return {c, inner:{x:(1-iw)/2, y:(1-ih)/2, w:iw, h:ih}};
}
// Find the piece against a plain background: compare every pixel to the border colour.
function autoCropBox(canvas){
  const sm = scaledCanvas(canvas, 360), W = sm.width, H = sm.height, d = sm.getContext("2d").getImageData(0,0,W,H).data;
  const px = (x,y) => { const i = (y*W+x)*4; return [d[i],d[i+1],d[i+2]]; };
  const border = []; for(let x=0;x<W;x+=2){ border.push(px(x,1), px(x,H-2)); } for(let y=0;y<H;y+=2){ border.push(px(1,y), px(W-2,y)); }
  const med = [0,1,2].map(ch => border.map(p=>p[ch]).sort((a,b)=>a-b)[border.length>>1]);
  const dist = p => Math.abs(p[0]-med[0]) + Math.abs(p[1]-med[1]) + Math.abs(p[2]-med[2]);
  const spread = border.map(dist).sort((a,b)=>a-b)[Math.floor(border.length*.8)];
  const th = Math.max(48, spread * 1.6);
  const cols = new Array(W).fill(0), rows = new Array(H).fill(0);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(dist(px(x,y)) > th){ cols[x]++; rows[y]++; }
  const edge = (arr, lim) => { let a = 0, b = arr.length-1; while(a < b && arr[a] < lim) a++; while(b > a && arr[b] < lim) b--; return [a, b]; };
  const [x0,x1] = edge(cols, H*.04), [y0,y1] = edge(rows, W*.04);
  const pad = .012, box = {x:x0/W - pad, y:y0/H - pad, w:(x1-x0+1)/W + 2*pad, h:(y1-y0+1)/H + 2*pad};
  box.x = Math.max(0, box.x); box.y = Math.max(0, box.y); box.w = Math.min(1-box.x, box.w); box.h = Math.min(1-box.y, box.h);
  if(box.w*box.h > .94 || box.w < .12 || box.h < .12) return null;
  return box;
}
function photoEditor(blob){

      <div class="pe-stage" id="peStage"><div class="pe-wrap" id="peWrap"><canvas id="peC"></canvas><div class="pe-crop" id="peCrop"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div></div>

    document.getElementById("peR").onclick = () => { quarter++; rebuild(); };

    document.getElementById("peDeg").oninput = e => { deg = +e.target.value; document.getElementById("peDegV").textContent = deg + "°"; rebuild(false); };

      const dx = (e.clientX - drag.sx) / drag.W, dy = (e.clientY - drag.sy) / drag.H, c = {...drag.c}, inn = R.inner, min = .06;

}
const safeName = n => (n||"file").replace(/[^\w.\- ]+/g,"_").slice(-80);

/* ---------- Barcode scanning ---------- */
let zxingLoad;
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  return zxingLoad = zxingLoad || new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="vendor/zxing.min.js"; s.onload=res; s.onerror=()=>{ zxingLoad=null; rej(new Error("Couldn't load the scanner.")); }; document.head.appendChild(s); });

/* iPhone home-screen apps ask for the camera every time it is switched on, so between scans the camera is
   paused rather than released, and reused if the next scan comes within a few minutes. */
let camStream = null, camTimer = null;
function releaseCam(){ clearTimeout(camTimer); if(camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; }
function parkCam(){ if(!camStream) return; camStream.getTracks().forEach(t => t.enabled = false); clearTimeout(camTimer); camTimer = setTimeout(releaseCam, 3 * 60 * 1000); }
async function getCam(){
  clearTimeout(camTimer);
  if(camStream && camStream.getTracks().some(t => t.readyState === "live")){ camStream.getTracks().forEach(t => t.enabled = true); return camStream; }
  camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}});
  return camStream;
}
document.addEventListener("visibilitychange", () => { if(document.hidden && !document.getElementById("sc")) releaseCam(); });
function scanBarcode(onCode){
  const L = document.getElementById("layer");
  L.innerHTML = `<div class="scanner" id="sc"><video playsinline muted autoplay></video><div class="aim"></div>
    <div class="bar"><div class="msg" id="scMsg">Starting camera…</div>
    <form id="scForm"><input name="code" inputmode="numeric" placeholder="Or type the number under the barcode"><button class="iconbtn primary" type="submit">Look up</button></form>
    <button class="iconbtn" id="scClose" type="button" style="background:#222;color:#fff;border-color:#444">Cancel</button></div></div>`;
  const video = L.querySelector("video"), msg = document.getElementById("scMsg");
  let finished = false;
  const stop = () => { finished = true; video.srcObject = null; parkCam(); L.innerHTML = ""; };
  const finish = code => { if(finished) return; stop(); onCode(code); };
  document.getElementById("scClose").onclick = stop;
  document.getElementById("scForm").onsubmit = e => { e.preventDefault(); const v = new FormData(e.target).get("code").trim(); if(v) finish(v); };
  (async () => {
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("This browser can't use the camera here.");
      await loadZXing();
      if(finished) return;
      const stream = await getCam();
      if(finished){ parkCam(); return; }
      video.srcObject = stream; await video.play().catch(()=>{});
      const F = ZXing.BarcodeFormat, hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const zx = new ZXing.MultiFormatReader(); zx.setHints(hints);
      let native = null;
      try{ if("BarcodeDetector" in window) native = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]}); }catch{}
      const cv = document.createElement("canvas"), ctx = cv.getContext("2d", {willReadFrequently:true});
      const tick = async () => {
        if(finished) return;
        if(video.readyState >= 2 && video.videoWidth){
          const s = Math.min(1, 1280 / video.videoWidth);
          cv.width = Math.round(video.videoWidth * s); cv.height = Math.round(video.videoHeight * s);
          ctx.drawImage(video, 0, 0, cv.width, cv.height);
          try{
            if(native){ const r = await native.detect(cv); if(r.length) return finish(r[0].rawValue); }
            const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
            const r = zx.decode(bmp); if(r) return finish(r.getText());
          }catch(e){ /* not found in this frame */ }
        }
        setTimeout(tick, 200);
      };
      tick();
      if(!finished) msg.textContent = "Point the camera at the barcode and hold steady.";
    }catch(e){
      if(finished) return;
      msg.textContent = (e && e.name === "NotAllowedError") ? "Camera permission was blocked. Allow camera access for this site, or type the number below." : (e.message || "Camera unavailable.") + " You can type the number below.";
    }
  })();
}

/* ---------- Duplicate check when adding a new piece ---------- */
const normTitle = t => sortKey(String(t||"").toLowerCase().replace(/,\s*(the|a|an)\s*$/,"")).replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
// Fields that tell two otherwise-identical pieces apart (an LP vs a 7-inch, issue #14 vs #15, a variant cover).
const DISTINCT_FIELD = /issue|volume|vol|variant|cover|format|edition|size|speed|printing|version|region|platform/i;
function findDupes(it){
  const c = coll(it.collectionId), t = normTitle(it.title);
  return cat.items.filter(x => {
    if(x.id === it.id || x.collectionId !== it.collectionId) return false;
    if(it.barcode && x.barcode && sameCode(it.barcode, x.barcode)) return true;
    if(!t || normTitle(x.title) !== t) return false;
    if(it.maker && x.maker && normTitle(it.maker) !== normTitle(x.maker)) return false;
    if(it.year && x.year && String(it.year).trim() !== String(x.year).trim()) return false;
    return !c.fields.some(f => { const a = (it.fields||{})[f.k], b = (x.fields||{})[f.k];
      return (f.opts || DISTINCT_FIELD.test(f.l)) && a && b && normTitle(a) !== normTitle(b); });

}
function askDupe(it, dupes){
  return new Promise(resolve => {

  if(!g){ g = {id:"c_" + uid(), name:"Board Games", icon:"🎲", maker:"Designer", lookup:"boardgame", fields:[{k:"publisher",l:"Publisher"},{k:"players",l:"Players"},{k:"playtime",l:"Playing time"}]}; cat.collections.push(g); }
  const progress = opts.progress || (()=>{});
  progress("Reading your BoardGameGeek collection…");
  let d = null;
  for(let i = 0; i < 6; i++){ // BGG answers 202 while it prepares a collection
    const r = await serviceFetch("bgg", "collection?own=1&username=" + encodeURIComponent(user));
    if(r.status === 202){ progress("BoardGameGeek is preparing your collection…"); await new Promise(res => setTimeout(res, 2500)); continue; }
    if(!r.ok) throw new Error("BoardGameGeek error " + r.status);
    d = xml(await r.text()); break;
  }
  if(!d) throw new Error("BoardGameGeek is still preparing your collection. Try again in a minute.");
  const err = d.querySelector("errors error message, error message"); if(err) throw new Error("BoardGameGeek: " + err.textContent);
  const norm = t => String(t||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const owned = [...d.querySelectorAll("item")].map(i => ({id:i.getAttribute("objectid"), sub:i.getAttribute("subtype"),
    title:((i.querySelector("name")||{}).textContent||"").trim(), year:((i.querySelector("yearpublished")||{}).textContent||"").trim(),
    image:((i.querySelector("image")||{}).textContent||"").trim(), thumb:((i.querySelector("thumbnail")||{}).textContent||"").trim(),
    plays:((i.querySelector("numplays")||{}).textContent||"").trim(), comment:((i.querySelector("comment")||{}).textContent||"").trim()}));
  const have = new Set(cat.items.map(i => i.bggId).filter(Boolean));
  const fresh = [];
  for(const o of owned){
    if(have.has(o.id)) continue;
    const match = cat.items.find(i => !i.bggId && i.collectionId === g.id && norm(i.title) === norm(o.title));
    if(match){ match.bggId = o.id; have.add(o.id); continue; }
    fresh.push(o); have.add(o.id);
  }
  // Fetch designer / publisher / players for new games, 20 at a time.
  const details = {};
  for(let k = 0; k < fresh.length; k += 20){
    progress("Getting details for new games… " + Math.min(k + 20, fresh.length) + " of " + fresh.length);
    try{
      const t = await bggGet("thing?id=" + fresh.slice(k, k + 20).map(o => o.id).join(","));
      t.querySelectorAll("item").forEach(i => {
        const v = sel => { const e = i.querySelector(sel); return e ? (e.getAttribute("value")||"").trim() : ""; };
        const links = type => [...i.querySelectorAll('link[type="' + type + '"]')].map(l => l.getAttribute("value"));
        const mn = v("minplayers"), mx = v("maxplayers"), pt = v("playingtime");
        details[i.getAttribute("id")] = {designer:links("boardgamedesigner").slice(0,3).join(", "), publisher:links("boardgamepublisher").slice(0,2).join(", "),
          players:mn ? (mn === mx ? mn : mn + "–" + mx) : "", playtime:pt && pt !== "0" ? pt + " min" : "", expansion:i.getAttribute("type") === "boardgameexpansion"};
      });
    }catch(e){ console.warn(e.message); }
    if(k + 20 < fresh.length) await new Promise(res => setTimeout(res, 1200));
  }
  const now = new Date().toISOString(), norml = x => String(x).toLowerCase().replace(/[^a-z0-9]/g,"");
  for(const o of fresh){
    const det = details[o.id] || {}, it = {id:uid(), collectionId:g.id, bggId:o.id, title:o.title, maker:det.designer||"", year:o.year, fields:{}, extra:[], tags:["BGG"], media:[], created:now, updated:now};
    const named = {"Publisher":det.publisher, "Players":det.players, "Playing time":det.playtime, "Type":det.expansion ? "Expansion" : "", "Plays logged":o.plays && o.plays !== "0" ? o.plays : "", "BoardGameGeek":"https://boardgamegeek.com/boardgame/" + o.id};
    Object.entries(named).forEach(([l,v]) => { if(!v) return; const f = g.fields.find(f => norml(f.l) === norml(l) || norml(f.l).startsWith(norml(l))); if(f) it.fields[f.k] = v; else it.extra.push({l, v}); });
    if(o.comment) it.notes = o.comment;
    if(o.image) it.media.push({id:uid(), kind:"photo", remote:true, name:"BoardGameGeek image", path:o.image, thumb:o.thumb || o.image});
    cat.items.push(it);
  }
  const missing = cat.items.filter(i => i.bggId && i.collectionId === g.id && !owned.some(o => o.id === i.bggId)).length;
  cat.settings = {...(cat.settings||{}), bggLastSync:now};
  await persist();
  return {added:fresh.length, total:owned.length, missing, gallery:g};
}
async function autoSyncBGG(){
  const st = cat.settings || {};

/* Copy looked-up details into a piece. overwrite=false only fills blanks, so your own entries win. */
function mergeResult(it, r, overwrite){
  ["title","maker","year"].forEach(k => { if(r[k] && (overwrite || !it[k])) it[k] = r[k]; });
  it.fields = it.fields || {}; it.extra = it.extra || []; it.media = it.media || [];
  const gf = coll(it.collectionId).fields, norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g,"");
  Object.entries(r.fields||{}).forEach(([k,v]) => { if(v && (overwrite || !it.fields[k]) && gf.some(f=>f.k===k)) it.fields[k] = v; });
  if(r.barcode && !it.barcode) it.barcode = r.barcode;
  const keyed = new Set(Object.entries(r.fields||{}).filter(([k,v]) => v && gf.some(f=>f.k===k)).map(([k]) => k));
  Object.entries(r.named||{}).forEach(([label, v]) => {
    if(!v) return; v = String(v);
    const f = gf.find(f => norm(f.l) === norm(label) || norm(f.l).startsWith(norm(label)));
    if(f){ if(keyed.has(f.k)) return; if(overwrite || !it.fields[f.k]) it.fields[f.k] = v; return; }
    if(gf.some(f => keyed.has(f.k) && norm(f.l).includes(norm(label)))) return;
    const ex = it.extra.find(e => norm(e.l) === norm(label));
    if(ex){ if(overwrite) ex.v = v; } else it.extra.push({l:label, v});
  });
  (r.extra||[]).forEach(x => { if(x.v && !it.extra.some(e=>e.l.toLowerCase()===x.l.toLowerCase())) it.extra.push(x); });
  it.matched = {source:r.source || "", at:new Date().toISOString(), ...(r.ref ? {ref:r.ref} : {})};
}
const lookupName = kind => kind === "music" ? (((cat && cat.settings)||{}).discogsToken ? "Discogs & MusicBrainz" : "MusicBrainz") : (LOOKUPS[kind]||"").split(": ")[1] || "";
const isMatched = it => !!(it.matched || it.bggId);
/* Match a saved piece to a database later: fills in blanks and adds a cover if it has no photo. */
function matchSaved(it, opts){
  opts = opts || {};
  const c = coll(it.collectionId), kind = lookupKind(c), isf = issueField(c), iss = isf && (it.fields||{})[isf.k];
  if(kind === "none") return toast("Choose a lookup source for this gallery in ✎ Edit gallery first.");
  pickResult(kind, kind === "comic" && iss && !/#/.test(it.title) ? it.title + " #" + iss : it.title, it.maker, async r => {
    const before = JSON.stringify(it);
    mergeResult(it, r, false);
    if(r.cover && !(it.media||[]).some(m => m.kind === "photo")){
      try{
        const resp = await fetchT(r.cover, {}, 20000), blob = await resp.blob();
        if(!resp.ok || !/^image\//.test(blob.type)){ const e = new Error("no cover"); e.noCover = true; throw e; }
        const base = "media/" + it.id + "/" + uid();
        await store.putFile(base + ".jpg", await shrink(blob, 2400, .88)); await store.putFile(base + "_t.jpg", await shrink(blob, 520, .8));
        it.media.unshift({id:uid(), kind:"photo", name:"cover.jpg", path:base + ".jpg", thumb:base + "_t.jpg"});
      }catch(e){ if(!e.noCover && /^https:/.test(r.cover)) it.media.unshift({id:uid(), kind:"photo", remote:true, name:"cover", path:r.cover, thumb:r.thumb || r.cover}); }
    }
    it.updated = new Date().toISOString();
    try{ await persist(); toast("Matched to " + (r.source || "database")); }
    catch(e){ Object.assign(it, JSON.parse(before)); alert(e.message); return; }
    opts.after ? opts.after() : route();
  }, opts);
}

async function releaseImages(ref){
  const out = [];
  if(ref && ref.discogs){ const tok = (cat.settings||{}).discogsToken;
    if(tok){ const j = await getJSON("https://api.discogs.com/releases/" + ref.discogs + "?token=" + encodeURIComponent(tok));
      (j.images||[]).forEach(i => out.push({url:i.uri, thumb:i.uri150 || i.uri, label:i.type === "primary" ? "Front (Discogs)" : "Discogs"})); } }
  if(ref && ref.mb){
    try{ const j = await getJSON("https://coverartarchive.org/release/" + ref.mb);
      (j.images||[]).forEach(i => out.push({url:(i.thumbnails||{}).large || i.image, thumb:(i.thumbnails||{}).small || (i.thumbnails||{})["250"] || i.image, label:(i.types||[]).join(", ") || "Image"})); }
    catch(e){ /* no art for this release */ }
  }
  return out;
}

async function useCover(it, url, thumb, replace){
  const done = busy("Saving the new cover…"), before = JSON.stringify(it), old = cover(it);
  try{

      m = {id:uid(), kind:"photo", name:"cover.jpg", path:base + ".jpg", thumb:base + "_t.jpg"};
    }catch(e){ m = {id:uid(), kind:"photo", remote:true, name:"cover", path:url, thumb:thumb || url}; }
    it.media = it.media || [];
    if(replace && old) it.media = it.media.filter(x => x !== old);
    it.media.unshift(m); it.updated = new Date().toISOString();
    await persist();
    if(replace && old && !old.remote){ store.deleteFile(old.path).catch(()=>{}); if(old.thumb) store.deleteFile(old.thumb).catch(()=>{}); }
    done(); document.getElementById("layer").innerHTML = ""; toast("Cover updated"); route();
  }catch(e){ Object.assign(it, JSON.parse(before)); done(); alert("Couldn't save the cover: " + e.message); }
}
